[package]
name = "jackin-capsule"
version = "0.6.4"
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "In-container PID 1 control plane for Capsule-managed role containers."
homepage = "https://jackin.tailrocks.com/"
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[features]
default = []
# Enables the DHAT allocator in allocation regression tests and opt-in live
# capsule allocation telemetry for the focused-pane render handoff.
dhat-heap = ["dep:dhat"]
# Plan 009 spike: enables the flagged Codex app-server status authority mapping
# in the pure detection crate without changing the default Codex hook path.
codex-app-server-authority = ["jackin-agent-status/codex-app-server-authority"]

[lib]
name = "jackin_capsule"
path = "src/lib.rs"

[[bin]]
name = "jackin-capsule"
path = "src/main.rs"

[dependencies]
jackin-brand = { workspace = true }
anyhow = { workspace = true }
jackin-agent-status = { workspace = true }
jackin-core = { workspace = true }
jackin-tui = { workspace = true }
# OTLP export for the in-container session, runtime-gated on the endpoint the
# host injects. Pulls the opentelemetry stack into the capsule image.
jackin-diagnostics = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util", "io-std", "sync", "macros", "time", "net", "signal", "process"] }
crossterm = { workspace = true }
portable-pty = { workspace = true }
nix = { workspace = true, features = ["term", "signal", "process", "inotify"] }
libc = "0.2"
# termpane: the owned terminal model (extracted from crates/jackin-term).
# `DamageGrid` is the sole VT parser / screen / scrollback / passthrough model.
termpane = { workspace = true }
url = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
sha2 = { workspace = true }
ratatui = { workspace = true }
termrock = { workspace = true }
hex = { workspace = true }
dhat = { workspace = true, optional = true }
# tui-term was evaluated for pane-body rendering (see ADR-004) but did not fit
# the capsule's owned-grid model. The custom cell widget approach is used instead.
# Atomic first-seed of agent home dirs (D6): copy to sibling temp then rename.
tempfile = { workspace = true }
uuid = { workspace = true }
[build-dependencies]
jackin-build-meta = { workspace = true }

[[bench]]
name = "pane_body"
harness = false

[[bench]]
name = "scrollback_snapshot"
harness = false

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true, features = ["filters"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
opentelemetry-proto = { workspace = true }

[lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
# Landlock/capability syscalls are the fail-closed boundary; keep the unsafe
# surface confined to process_isolation.rs and review it as a security API.
unsafe_code = "allow"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
async_fn_in_trait = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
multiple_crate_versions = "allow"
mod_module_files = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_assert = "deny"
manual_let_else = "warn"
match_bool = "warn"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "warn"
large_enum_variant = "warn"
large_futures = "allow"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
str_to_string = "warn"
return_self_not_must_use = "warn"
redundant_feature_names = "allow"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
implicit_hasher = "allow"
similar_names = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
format_push_string = "allow"
no_effect_underscore_binding = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
