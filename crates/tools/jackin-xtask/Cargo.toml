[package]
name = "jackin-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Workspace automation (construct image build/publish) for jackin."
publish = false
default-run = "jackin-xtask"

[[bin]]
name = "jackin-xtask"
path = "src/main.rs"

[[bin]]
name = "jackin-precommit-owner"
path = "src/precommit_owner_main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
clap = { workspace = true, features = ["derive"] }
flate2 = { workspace = true }
fs4 = { workspace = true }
jackin-process = { workspace = true }
portable-pty = { workspace = true }
hex = { workspace = true }
nix = { workspace = true, features = ["dir", "fs", "user"] }
proc-macro2 = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
rusqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
signal-hook = "=0.3.18"
syn = { workspace = true, features = ["full", "visit", "parsing", "extra-traits"] }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
toml = { workspace = true }
zip = { workspace = true }
uuid = { workspace = true }
velnor-actions-contract = { workspace = true }

[target.'cfg(unix)'.dependencies]
jackin-process-directory = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
