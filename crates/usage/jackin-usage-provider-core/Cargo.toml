[package]
name = "jackin-usage-provider-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Provider substrate for usage: the bucket model, the provider error, the HTTP client, and number and time helpers."
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
uuid = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util = { workspace = true }
time = { workspace = true, features = ["formatting", "macros", "parsing"] }
reqwest = { workspace = true, features = ["form"] }
rustls = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
