[package]
name = "jackin-capsule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "In-container PID 1 control plane for Capsule-managed role containers."
homepage = "https://jackin.tailrocks.com/"
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[package.metadata.jackin.capsule-artifact]
schema = 1
features = []

[features]
default = []
codex-app-server-authority = ["jackin-agent-status/codex-app-server-authority"]

[lib]
name = "jackin_capsule"
path = "src/lib.rs"

[[bin]]
name = "jackin-capsule"
path = "src/main.rs"

[dependencies]
jackin-brand = { workspace = true }
anyhow = { workspace = true }
jackin-agent-status = { workspace = true }
jackin-core = { workspace = true }
jackin-tui = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage = { workspace = true }
jackin-usage-provider-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util", "io-std", "sync", "macros", "time", "net", "signal", "process"] }
crossterm = { workspace = true }
portable-pty = { workspace = true }
nix = { workspace = true, features = ["term", "signal", "process", "inotify", "fs"] }
libc = { workspace = true }
termpane = { workspace = true }
url = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
sha2 = { workspace = true }
ratatui = { workspace = true }
termrock = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
jackin-process-directory = { workspace = true }

[build-dependencies]
jackin-build-meta = { workspace = true }

[[bench]]
name = "pane_body"
harness = false

[[bench]]
name = "scrollback_snapshot"
harness = false

[dev-dependencies]
jackin-process = { workspace = true, features = ["test-support"] }
criterion = { workspace = true, features = ["html_reports"] }
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tracing = { workspace = true }

[lints]
workspace = true
