version = "v1alpha10"
workdir = "/workspace/project"
accounts = ["personal"]
default_launch = []

[account_bindings]
claude = "personal"

[env]
SECTIONED_TOKEN = { op = "op://vault-id/item-id/section-id/field-id", path = "Private/Build/Authentication/Deploy Token" }
LITERAL_PERCENT = { op = "op://vault-id/item-id/field-id", path = "Private/Team%2FBlue/token" }
WORKSPACE_TOKEN = { op = "op://workspace-vault/workspace-item/auth-section/token-field?attribute=otp", path = "Shared%2FBlue/Deployment[Fixture%2FWest]/Authentication%2FSection/Token?attribute=otp", account = "workspace-fixture@example.invalid", on_demand = true }

[github]
auth_forward = "token"

[github.env]
GH_TOKEN = { op = "op://github-vault-id/item-id/field-id", path = "GitHub/Automation/Token" }

[roles."org/release"]
account_bindings = { claude = "personal" }
default_launch = []

[roles."org/release".env]
ROLE_TOKEN = { op = "op://role-vault-id/item-id/section-id/field-id", path = "Release/Deployment/Production/Token" }

[roles."org/release".github]
auth_forward = "token"

[roles."org/release".github.env]
GH_TOKEN = { op = "op://role-github-vault-id/item-id/field-id", path = "Release/GitHub/Token" }
