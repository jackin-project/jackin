version = "v1alpha12"
account_scan_exclusions = ["removed-source-fingerprint"]
default_launch = []

[accounts.personal]
name = "Personal"
provider = "anthropic"

[accounts.personal.credential]
type = "api_key"
value = { op = "op://vault-fixture/item-fixture/section-fixture/field-fixture?attribute=otp", path = "Ops%2FBlue/Recovery[Fixture%2FWest]/Auth%2FSection/OTP?attribute=otp", account = "fixture@example.invalid", on_demand = true }

[bootstrap]
version = 1
fresh_install = false

[env]
SECTIONED_TOKEN = { op = "op://vault-id/item-id/section-id/field-id", path = "Private/Build/Authentication/Deploy Token" }
LITERAL_PERCENT = { op = "op://vault-id/item-id/field-id", path = "Private/Team%2FBlue/token" }
QUERY_TOKEN = { op = "op://vault-id/item-id/section-id/field-id?attribute=otp", path = "Private/Build/Authentication/Token?attribute=otp" }

[github]
auth_forward = "token"

[github.env]
GH_TOKEN = { op = "op://github-vault-id/item-id/field-id", path = "GitHub/Automation/Token" }

[roles."org/release"]
git = "https://example.test/release.git"

[roles."org/release".env]
RELEASE_TOKEN = { op = "op://release-vault-id/item-id/field-id", path = "Release/Signing/Token" }

[workspaces.project]
workdir = "/workspace/project"
accounts = ["personal"]
default_launch = []

[workspaces.project.env]
WORKSPACE_TOKEN = { op = "op://workspace-vault-id/item-id/section-id/field-id", path = "Project/Database/Connection/URL" }

[workspaces.project.github]
auth_forward = "token"

[workspaces.project.github.env]
GH_TOKEN = { op = "op://workspace-github-vault-id/item-id/field-id", path = "Project/GitHub/Token" }

[workspaces.project.roles."org/release"]
account_bindings = { claude = "personal" }
default_launch = []

[workspaces.project.roles."org/release".env]
ROLE_TOKEN = { op = "op://role-vault-id/item-id/section-id/field-id", path = "Release/Deployment/Production/Token" }

[workspaces.project.roles."org/release".github]
auth_forward = "token"

[workspaces.project.roles."org/release".github.env]
GH_TOKEN = { op = "op://role-github-vault-id/item-id/field-id", path = "Release/GitHub/Token" }
