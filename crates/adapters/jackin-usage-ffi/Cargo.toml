[package]
name = "jackin-usage-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Synchronous boltffi facade over jackin-usage host runtime for the macOS menu-bar app"
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "jackin_usage_ffi"
crate-type = ["lib", "staticlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
jackin-config = { workspace = true }
jackin-core = { workspace = true }
jackin-env = { workspace = true }
jackin-usage = { workspace = true }
jackin-usage-provider-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
boltffi = "=0.30.1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
