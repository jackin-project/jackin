[package]
name = "jackin-usage"
crate = "jackin-usage-ffi"

[targets.apple]
include_macos = true
ios_architectures = []
simulator_architectures = []
macos_architectures = ["arm64"]

[targets.apple.xcframework]
name = "JackinUsage"
output = "../../target/xcframework"

[targets.apple.spm]
layout = "split"
skip_package_swift = true

[targets.apple.swift]
output = "../../native/Sources/JackinUsageBindings"
