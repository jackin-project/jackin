[package]
name = "jackin-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Image generation and binary artifact management for jackin❯."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true
[lib]
name = "jackin_image"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-manifest = { workspace = true }
jackin-docker = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-process = { workspace = true }
nix = { workspace = true, features = ["user"] }
hex = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "process", "io-util", "sync", "macros", "time", "fs"] }
reqwest = { workspace = true }
sigstore-verify = { workspace = true }
sigstore-trust-root = { workspace = true }
sigstore-bundle = { workspace = true }
sigstore-types = { workspace = true }
sigstore-crypto = { workspace = true }
velnor-actions-contract = { workspace = true }

[build-dependencies]
jackin-build-meta = { workspace = true }

[lints]
workspace = true
