id: t16-claude-mimo
display_name: Claude Code with MiMo
description: Claude Code with MiMo with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for Claude Code with MiMo
    env_vars: [ANTHROPIC_AUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: token-plan-sgp.xiaomimimo.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/claude
