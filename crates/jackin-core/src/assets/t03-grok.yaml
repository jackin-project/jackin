id: grok
display_name: Grok Build
description: Grok Build with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for Grok Build
    env_vars: [GROK_SESSION_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://auth.x.ai/oauth2/token
      refresh_before_seconds: 300
      material:
        - name: client_id
          description: Grok Build OIDC client ID
          required: true
          secret: false
        - name: refresh_token
          description: Grok Build OAuth refresh token
          required: true
          secret: true
discovery:
  credentials: [access_token]
endpoints:
  - host: cli-chat-proxy.grok.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: auth.x.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/grok
