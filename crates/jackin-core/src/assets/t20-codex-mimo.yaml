id: t20-codex-mimo
display_name: Codex with MiMo
description: Codex with MiMo with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for Codex with MiMo
    env_vars: [XIAOMI_TOKEN_PLAN_SGP_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: token-plan-sgp.xiaomimimo.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/codex
