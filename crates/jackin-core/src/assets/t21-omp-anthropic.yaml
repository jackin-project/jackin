id: t21-omp-anthropic
display_name: omp with Anthropic
description: omp with Anthropic with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for omp with Anthropic
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/omp
