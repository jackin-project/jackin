id: t19-codex-minimax
display_name: Codex with MiniMax
description: Codex with MiniMax with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for Codex with MiniMax
    env_vars: [MINIMAX_CODE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: api.minimax.io
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/codex
