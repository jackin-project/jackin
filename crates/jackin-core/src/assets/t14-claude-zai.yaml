id: t14-claude-zai
display_name: Claude Code with Z.AI
description: Claude Code with Z.AI with gateway-managed credential
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Gateway-held credential for Claude Code with Z.AI
    env_vars: [ZAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: api.z.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/claude
