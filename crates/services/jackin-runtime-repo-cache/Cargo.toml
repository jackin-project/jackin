[package]
name = "jackin-runtime-repo-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Role-repo clone, validation, and cache."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_repo_cache"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-instance = { workspace = true }
jackin-manifest = { workspace = true }
jackin-runtime-identity = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }
fs4 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
jackin-test-support = { workspace = true }
dialoguer = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
