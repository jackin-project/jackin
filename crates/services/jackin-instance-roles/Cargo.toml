[package]
name = "jackin-instance-roles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Role-state orchestration for jackin❯ role containers: RoleState preparation dispatch across agents and bindings."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_instance_roles"
path = "src/lib.rs"

[dependencies]
jackin-core                 = { workspace = true }
jackin-config               = { workspace = true }
jackin-manifest             = { workspace = true }
jackin-diagnostics          = { workspace = true }
jackin-telemetry            = { workspace = true }
jackin-instance-agents      = { workspace = true }
jackin-instance-credentials = { workspace = true }

anyhow = { workspace = true }

[features]
test-support = []

[dev-dependencies]
jackin-diagnostics          = { workspace = true, features = ["test-support"] }
jackin-instance-agents      = { workspace = true, features = ["test-support"] }
jackin-instance-credentials = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
nix        = { workspace = true, features = ["dir", "fs", "user"] }
tempfile   = { workspace = true }
rusqlite   = { workspace = true }
tracing    = { workspace = true }

[lints]
workspace = true
