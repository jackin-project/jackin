[package]
name = "jackin-instance-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Per-agent credential provisioning for jackin❯ role containers: agent provisioners, auth-source snapshot/capture, and slot layout."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_instance_agents"
path = "src/lib.rs"

[dependencies]
jackin-core                 = { workspace = true }
jackin-config               = { workspace = true }
jackin-process              = { workspace = true }
jackin-telemetry            = { workspace = true }
jackin-instance-credentials = { workspace = true }

anyhow          = { workspace = true }
serde           = { workspace = true, features = ["derive"] }
serde_json      = { workspace = true }
serde_yaml_ng   = { workspace = true }
directories     = { workspace = true }
sha2            = { workspace = true }
hex             = { workspace = true }
tempfile        = { workspace = true }
zeroize         = { workspace = true }

[features]
test-support = []

[dev-dependencies]
jackin-diagnostics          = { workspace = true, features = ["test-support"] }
jackin-instance-credentials = { workspace = true, features = ["test-support"] }
tracing                     = { workspace = true }

[lints]
workspace = true
