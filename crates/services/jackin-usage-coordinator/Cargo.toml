[package]
name = "jackin-usage-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Per-account single-flight usage refresh generations with file-backed state stores."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_coordinator"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
nix = { workspace = true, features = ["fs", "user"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
