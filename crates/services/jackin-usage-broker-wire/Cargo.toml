[package]
name = "jackin-usage-broker-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Broker socket/lease wire primitives: consts, lease ownership, run-dir hardening, probe budgets."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_broker_wire"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["clock"] }
jackin-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-coordinator = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
