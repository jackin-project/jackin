[package]
name = "jackin-usage-provider-minimax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "MiniMax usage snapshot collection: Token Plan remains, PAYG balances, and bucket views."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_provider_minimax"
path = "src/lib.rs"

[dependencies]
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-provider-core = { workspace = true }

reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
