[package]
name = "jackin-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Container bootstrap pipeline: runtime, instance, isolation. Holds the concrete DockerApi/CommandRunner impls, image build, DinD sidecar management, mount materialization, and instance lifecycle."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true
[lib]
name = "jackin_runtime"
path = "src/lib.rs"

[dependencies]
jackin-brand = { workspace = true }
jackin-core = { workspace = true }
jackin-config = { workspace = true }
jackin-env = { workspace = true }
jackin-manifest = { workspace = true }
jackin-docker = { workspace = true }
jackin-image = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-launch = { workspace = true }
jackin-host = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-isolation = { workspace = true }
jackin-instance = { workspace = true }
jackin-runtime-coordination = { workspace = true }
jackin-runtime-discovery = { workspace = true }
jackin-runtime-docker-profile = { workspace = true }
jackin-runtime-drift = { workspace = true }
jackin-runtime-exec-host = { workspace = true }
jackin-runtime-exit-summary = { workspace = true }
jackin-runtime-host-daemon = { workspace = true }
jackin-runtime-identity = { workspace = true }
jackin-runtime-isolation = { workspace = true }
jackin-runtime-launch-plan = { workspace = true }
jackin-runtime-naming = { workspace = true }
jackin-runtime-process-telemetry = { workspace = true }
jackin-runtime-progress = { workspace = true }
jackin-runtime-prune-output = { workspace = true }
jackin-runtime-reactive-daemon = { workspace = true }
jackin-runtime-repo-cache = { workspace = true }
jackin-runtime-session-control = { workspace = true }
jackin-runtime-snapshot = { workspace = true }
jackin-runtime-spin-wait = { workspace = true }
jackin-runtime-universe = { workspace = true }
jackin-usage = { workspace = true }

tokio = { workspace = true, features = ["rt", "process", "io-util", "io-std", "net", "signal", "sync", "macros", "time", "fs"] }
futures-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
crossterm = { workspace = true }
dialoguer = { workspace = true }
sha2 = { workspace = true }
fs4 = { workspace = true }
hex = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tempfile = { workspace = true }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user", "socket", "poll", "process", "signal", "fs"] }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-runtime-identity = { workspace = true, features = ["test-support"] }
jackin-runtime-universe = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
jackin-test-support = { workspace = true }
jackin-image = { workspace = true }
jackin-manifest = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
jackin-build-meta = { workspace = true }

[features]
daemon-spike = ["jackin-runtime-reactive-daemon/daemon-spike"]

[[bench]]
name = "launch_attach"
harness = false

[[bench]]
name = "launch_pipeline"
harness = false

[lints]
workspace = true
