[package]
name = "jackin-runtime-process-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Telemetry-instrumented process spawn/exec wrappers over jackin-process."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_process_telemetry"
path = "src/lib.rs"

[dependencies]
jackin-process = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
