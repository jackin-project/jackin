[package]
name = "jackin-runtime-host-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host daemon backend serving RPCs over a Unix socket."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_host_daemon"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-runtime-process-telemetry = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["socket"] }

[lints]
workspace = true
