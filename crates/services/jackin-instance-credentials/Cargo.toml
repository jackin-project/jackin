[package]
name = "jackin-instance-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Credential substrate for jackin❯ role containers: outcome types, journaled auth-directory transactions, and secure path primitives."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_instance_credentials"
path = "src/lib.rs"

[dependencies]
jackin-core   = { workspace = true }
jackin-config = { workspace = true }

anyhow     = { workspace = true }
thiserror  = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
fs4        = { workspace = true }
nix        = { workspace = true, features = ["dir", "fs", "user"] }
tempfile   = { workspace = true }

[features]
test-support = []

[lints]
workspace = true
