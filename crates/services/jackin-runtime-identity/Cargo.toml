[package]
name = "jackin-runtime-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host git identity capture and capsule supervisor user."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_identity"
path = "src/lib.rs"

[features]
default = []
test-support = []

[dependencies]
jackin-core = { workspace = true }
jackin-diagnostics = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[lints]
workspace = true
