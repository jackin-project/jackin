[package]
name = "jackin-runtime-exec-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host-side credential resolver socket for jackin-exec sessions."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_exec_host"
path = "src/lib.rs"

[dependencies]
jackin-env = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-runtime-process-telemetry = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
