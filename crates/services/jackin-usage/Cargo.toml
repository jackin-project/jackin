[package]
name = "jackin-usage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Usage, pricing, telemetry, and token-monitor subsystem for the jackin-capsule in-container daemon."
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "jackin_usage"
path = "src/lib.rs"

[features]
default = []

[dependencies]
jackin-usage-provider-zai = { workspace = true }
jackin-usage-provider-kimi = { workspace = true }
jackin-usage-provider-amp = { workspace = true }
jackin-usage-provider-minimax = { workspace = true }
jackin-usage-provider-openrouter = { workspace = true }
jackin-usage-provider-grok = { workspace = true }
jackin-usage-provider-antigravity = { workspace = true }
jackin-usage-provider-cursor = { workspace = true }
jackin-usage-provider-codex = { workspace = true }
jackin-usage-provider-hermes = { workspace = true }
jackin-usage-provider-gemini = { workspace = true }
jackin-usage-provider-muse = { workspace = true }
jackin-usage-output = { workspace = true }
jackin-usage-coordinator = { workspace = true }
jackin-usage-store-backend = { workspace = true }
jackin-usage-snapshot-store = { workspace = true }
jackin-usage-token-monitor = { workspace = true }
jackin-usage-capsule-telemetry = { workspace = true }
jackin-usage-credential-resolver = { workspace = true }
jackin-usage-host-runtime = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
jackin-usage-provider-codex = { workspace = true, features = ["test-support"] }
jackin-usage-snapshot-store = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
jackin-protocol = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "token_log_reread"
harness = false

[[bench]]
name = "snapshot_upsert"
harness = false
