[package]
name = "jackin-usage-capsule-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "In-container Capsule telemetry lifecycle: OTLP export, startup guard, panic hook."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_capsule_telemetry"
