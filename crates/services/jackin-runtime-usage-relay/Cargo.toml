[package]
name = "jackin-runtime-usage-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Usage relay tunnels and launch usage capabilities for runtime."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_usage_relay"
path = "src/lib.rs"

[dependencies]
jackin-config = { workspace = true }
jackin-core = { workspace = true }
jackin-env = { workspace = true }
jackin-instance = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-runtime-apple-container-client = { workspace = true }
jackin-runtime-process-telemetry = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-coordinator = { workspace = true }
jackin-usage-host-runtime = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
