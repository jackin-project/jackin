[package]
name = "jackin-usage-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host account-source discovery, validation, and capability mapping."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_discovery"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-config = { workspace = true }
jackin-protocol = { workspace = true }
jackin-usage-provider-core = { workspace = true }
jackin-usage-provider-amp = { workspace = true }
jackin-usage-provider-antigravity = { workspace = true }
jackin-usage-provider-claude = { workspace = true }
jackin-usage-provider-codex = { workspace = true }
jackin-usage-provider-cursor = { workspace = true }
jackin-usage-provider-gemini = { workspace = true }
jackin-usage-provider-grok = { workspace = true }
jackin-usage-provider-kimi = { workspace = true }
jackin-usage-provider-opencode = { workspace = true }
jackin-usage-host-accounts = { workspace = true }
jackin-usage-host-credentials = { workspace = true }
jackin-usage-host-presentation = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
serde_json = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[lints]
workspace = true
