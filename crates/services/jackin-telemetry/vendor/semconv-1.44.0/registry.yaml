{
  "groups": [
    {
      "id": "registry.app.vendored",
      "type": "attribute_group",
      "brief": "Vendored application attributes required by the selected upstream events.",
      "stability": "development",
      "attributes": [
        {
          "id": "app.build_id",
          "type": "string",
          "stability": "development",
          "brief": "Unique identifier for a particular build or compilation of the application.",
          "examples": [
            "6cff0a7e-cefc-4668-96f5-1273d8b334d0",
            "9f2b833506aa6973a92fde9733e6271f",
            "my-app-1.0.0-code-123"
          ]
        },
        {
          "id": "app.crash.id",
          "type": "string",
          "stability": "development",
          "brief": "A unique identifier representing an instance of an end user facing app crash.\n",
          "note": "Its value MAY be meaningful and be used as a reference for telemetry and metadata recorded by\nthe same instrumentation (e.g. it is an ID generated by an external source that captured the crash).\nIt MAY come from a source external to the instrumentation such that it can be used to look up additional\ndata from other sources as well as facilitate deduplication.\n",
          "examples": [
            "083d3d2d-9a0e-47f8-be3d-bc3c5538ba38"
          ]
        },
        {
          "id": "app.jank.frame_count",
          "type": "int",
          "stability": "development",
          "brief": "A number of frame renders that experienced jank.",
          "note": "Depending on platform limitations, the value provided MAY be approximation.\n",
          "examples": [
            9,
            42
          ]
        },
        {
          "id": "app.jank.threshold",
          "stability": "development",
          "type": "double",
          "brief": "The minimum rendering threshold for this jank, in seconds.",
          "examples": [
            0.016,
            0.7,
            1.024
          ]
        },
        {
          "id": "app.jank.period",
          "stability": "development",
          "type": "double",
          "brief": "The time period, in seconds, for which this jank is being reported.",
          "examples": [
            1.0,
            5.0,
            10.24
          ]
        },
        {
          "id": "exception.type",
          "type": "string",
          "stability": "stable",
          "brief": "The type of the exception (its fully-qualified class name, if applicable). The dynamic type of the exception should be preferred over the static type in languages that support it.\n",
          "examples": [
            "java.net.ConnectException",
            "OSError"
          ],
          "note": "If the recorded exception type is a wrapper that is not meaningful for\nfailure classification, instrumentation MAY use the type of the inner\nexception instead. For example, in Go, errors created with `fmt.Errorf`\nusing `%w` MAY be unwrapped when the wrapper type does not help\nclassify the failure.\n"
        },
        {
          "id": "exception.message",
          "type": "string",
          "stability": "stable",
          "brief": "The exception message.",
          "examples": [
            "Division by zero",
            "Can't convert 'int' object to str implicitly"
          ],
          "note": "> [!WARNING]\n>\n> This attribute may contain sensitive information.\n"
        },
        {
          "id": "exception.stacktrace",
          "type": "string",
          "stability": "stable",
          "brief": "A stacktrace as a string in the natural representation for the language runtime. The representation is to be determined and documented by each language SIG.\n",
          "examples": "Exception in thread \"main\" java.lang.RuntimeException: Test exception\\n at com.example.GenerateTrace.methodB(GenerateTrace.java:13)\\n at com.example.GenerateTrace.methodA(GenerateTrace.java:9)\\n at com.example.GenerateTrace.main(GenerateTrace.java:5)\n"
        },
