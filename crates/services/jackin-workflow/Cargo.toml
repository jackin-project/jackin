[package]
name = "jackin-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Durable host-side workflow run state, reducer, and recovery (C5)."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_workflow"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-usage-store-backend = { workspace = true }
jackin-workflow-spec = { workspace = true }
jackin-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
