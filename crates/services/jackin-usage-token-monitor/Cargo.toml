[package]
name = "jackin-usage-token-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Per-session token-spend monitor: provider log polling, totals, cost estimates."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_token_monitor"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-store-backend = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }

[lints]
workspace = true
