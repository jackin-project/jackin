[package]
name = "jackin-usage-provider-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Shared provider substrate for usage collection: snapshot cache, fetch transport, outcome mapping, labels, and usage views."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_provider_core"
path = "src/lib.rs"

[dependencies]
jackin-core      = { workspace = true }
jackin-protocol  = { workspace = true }
jackin-telemetry = { workspace = true }

chrono     = { workspace = true, features = ["clock"] }
httpdate   = { workspace = true }
nix        = { workspace = true }
reqwest    = { workspace = true, features = ["blocking", "json", "rustls"] }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tower      = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile  = { workspace = true }
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-otlp-testbed = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "materialize_accounts"
harness = false

[lints]
workspace = true
