[package]
name = "jackin-runtime-host-attach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host-owned attach client for running Capsule daemons."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_host_attach"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-host = { workspace = true }
jackin-process = { workspace = true }
jackin-protocol = { workspace = true }
jackin-runtime-attach-transport = { workspace = true }
jackin-runtime-process-telemetry = { workspace = true }
jackin-runtime-snapshot = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
nix = { workspace = true, features = ["poll", "socket"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "signal", "time"] }
tracing = { workspace = true }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
