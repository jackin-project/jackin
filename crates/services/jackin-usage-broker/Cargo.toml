[package]
name = "jackin-usage-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Host usage broker lifecycle and bounded Unix-socket transport."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_broker"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-config = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-coordinator = { workspace = true }
jackin-usage-discovery = { workspace = true }
jackin-usage-host-accounts = { workspace = true }
jackin-usage-host-credentials = { workspace = true }
jackin-usage-host-presentation = { workspace = true }
jackin-usage-broker-publish = { workspace = true }
jackin-usage-broker-wire = { workspace = true }
jackin-usage-provider-core = { workspace = true }
jackin-usage-provider-claude = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
nix = { workspace = true, features = ["fs", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
jackin-usage-coordinator = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
