[package]
name = "jackin-runtime-universe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Construct-entry/exit boundary tracking for the operator span."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_runtime_universe"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
jackin-core = { workspace = true }
jackin-docker = { workspace = true }
jackin-runtime-coordination = { workspace = true }
jackin-runtime-discovery = { workspace = true }
jackin-runtime-universe-claims = { workspace = true }
jackin-telemetry = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
jackin-diagnostics = { workspace = true, features = ["test-support"] }
jackin-test-support = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "dir"] }

[lints]
workspace = true
