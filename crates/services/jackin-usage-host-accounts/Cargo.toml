


[package]
name = "jackin-usage-host-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Canonical host account inventory: catalog materialization, identity, selection."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_host_accounts"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true, features = ["clock"] }
getrandom = { version = "=0.4.3", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
jackin-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-usage-host-presentation = { workspace = true }
jackin-usage-provider-core = { workspace = true }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["zeroize"] }
zeroize = { workspace = true }

[lints]
workspace = true
