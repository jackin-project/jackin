[package]
name = "jackin-usage-snapshot-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Capsule-local SQLite cache for usage quota snapshots: schema, upserts, views."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_snapshot_store"
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
jackin-core = { workspace = true }
jackin-diagnostics = { workspace = true }
jackin-protocol = { workspace = true }
jackin-telemetry = { workspace = true }
jackin-usage-provider-core = { workspace = true }
jackin-usage-store-backend = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
