[package]
name = "jackin-instance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Instance identity, manifest/index persistence, container naming, and auth API re-exports for jackin❯ role containers."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_instance"
path = "src/lib.rs"

[dependencies]
jackin-core            = { workspace = true }
jackin-config          = { workspace = true }
jackin-instance-agents = { workspace = true }
jackin-instance-credentials = { workspace = true }
jackin-instance-roles       = { workspace = true }

anyhow     = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand       = { workspace = true }
chrono     = { workspace = true, features = ["clock"] }
sha2       = { workspace = true }
hex        = { workspace = true }
fs4        = { workspace = true }

[features]
test-support = []

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
