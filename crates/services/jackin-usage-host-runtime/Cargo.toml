[package]
name = "jackin-usage-host-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Capsule-free host usage runtime for the macOS menu-bar app and CLI."
license.workspace = true
readme = "README.md"
publish = false

repository.workspace = true

[lib]
name = "jackin_usage_host_runtime"
path = "src/lib.rs"

[dependencies]
jackin-core = { workspace = true }
jackin-protocol = { workspace = true }
jackin-usage-broker = { workspace = true }
jackin-usage-credential-resolver = { workspace = true }
jackin-usage-destination = { workspace = true }
jackin-usage-discovery = { workspace = true }
jackin-usage-host-accounts = { workspace = true }
jackin-usage-host-credentials = { workspace = true }
jackin-usage-host-glance = { workspace = true }
jackin-usage-host-presentation = { workspace = true }
jackin-usage-projection = { workspace = true }
jackin-usage-provider-core = { workspace = true }
jackin-usage-snapshot-store = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
serde_json = { workspace = true }

[dev-dependencies]
jackin-config = { workspace = true }
jackin-usage-broker-wire = { workspace = true }
jackin-usage-coordinator = { workspace = true }
jackin-usage-snapshot-store = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
