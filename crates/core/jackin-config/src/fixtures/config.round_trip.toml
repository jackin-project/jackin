version = "v1alpha3"
# jackin❯ config — top-of-file note
# keep this across saves

# Named credentials reused by authorized workspaces
[accounts.work]
name = "Work Claude"
provider = "anthropic"
[accounts.work.credential]
type = "profile"
agent = "claude"
directory = "/home/operator/.claude-work"

# Our two builtin roles
[roles.agent-smith]
git = "https://github.com/jackin-project/jackin-agent-smith.git"
trusted = true

[roles.the-architect]
git = "https://github.com/jackin-project/jackin-the-architect.git"
trusted = true

# An external role we vetted in 2025-Q4
[roles."chainargos/agent-brown"]
git = "git@github.com:chainargos/jackin-agent-brown.git"
trusted = true

# Production workspace — the big one
[workspaces.prod]
workdir = "/workspace/prod"
allowed_roles = ["agent-smith"]
default_agent = "codex"
accounts = ["work"]

[workspaces.prod.account_bindings]
claude = "work"

[workspaces.prod.env]
# Rotate quarterly (last: 2026-Q1)
API_TOKEN = "op://Personal/api/token"

# Passes through from host
GITHUB_TOKEN = "$GITHUB_TOKEN"

# Role-specific selection still requires workspace authorization
[workspaces.prod.roles.agent-smith.account_bindings]
claude = "work"

[workspaces.prod.roles.agent-smith.env]
# 1Password OpRef shape
ANTHROPIC_API_KEY = { op = "op://Work/Anthropic/api-key", path = "Work/Anthropic/api-key" }
# Literal $-expansion shape
OPENAI_API_KEY = "$OPENAI_API_KEY"

# Playground workspace — disposable
[workspaces.playground]
workdir = "/tmp/playground"
