[package]
name = "jackin-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = ["Alexey Zhokhov <alexey@zhokhov.com>"]
description = "Shared wire-format types for jackin❯'s host CLI ↔ in-container multiplexer control channel."
homepage = "https://jackin.tailrocks.com/"
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[lib]
name = "jackin_protocol"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll", "socket"] }

[dependencies]
anyhow = { workspace = true }
jackin-core = { workspace = true }
jackin-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
