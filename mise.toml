min_version = "2026.10.7"

[tools]
"github:open-telemetry/weaver" = "0.27.0"
actionlint = "1.7.12"
bun = "1.4.2"
cargo-binstall = "1.25.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.39"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"cargo:cargo-shear" = "1.14.0"
# Provides `boltffi` for the macOS desktop build; keep aligned with Cargo.toml.
"cargo:boltffi_cli" = { version = "0.31.0", os = ["macos"] }
"cargo:cargo-zigbuild" = "0.23.4"
"cargo:dylint-link" = "6.1.0"
cosign = "3.1.3"
hk = "2.5.0"
mr-boxington = "1.23.0"
rust = { version = "1.99.0", mr_boxington = true }
shellcheck = "0.11.0"
node = "26.10.0"
python = "3.14.8"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.12.23"
"pipx:fsfe/reuse-tool" = { version = "v6.2.0", package_name = "reuse", extras = "charset-normalizer", depends = [
  "python",
  "uv",
] }
syft = "1.54.0"
xcodegen = { version = "2.46.0", os = ["macos"] }
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.17.0"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Keep ordinary Cargo calls routed through MBX, including Cargo subprocesses
# started by jackin-xtask and boltffi. Rust version selection remains owned by
# rust-toolchain.toml; MBX has its own independent pinned tool entry above.

# Root tasks were removed. Native macOS workflows live in native/mise.toml.
