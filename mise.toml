[tools]
"aqua:apple/container" = { version = "1.2.2", os = ["macos"] }
"github:open-telemetry/weaver" = "0.24.2"
actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.21.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.0.4"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.38"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.4"
# Provides `boltffi`; pin matches the jackin-usage-ffi boltffi crate.
"cargo:boltffi_cli" = "0.30.1"
"cargo:cargo-zigbuild" = "0.23.0"
"cargo:codebook-lsp" = { version = "0.3.42", default-features = false }
"cargo:sccache" = "0.16.0"
"cargo:dylint-link" = "6.0.4"
cosign = "3.1.3"
hyperfine = "1.20.0"
shellcheck = "0.11.0"
node = "24.18.0"
python = "3.14.7"
ripgrep = "15.2.0"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.11.29"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python", "uv"] }
syft = "1.46.0"
xcodegen = "2.46.0"
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.16.0"
# rust is read from `rust-toolchain.toml` via the `idiomatic_version_file`
# setting below — single source of truth for the toolchain channel and components.

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Construct image tasks. Each delegates to the `jackin-xtask` Rust binary
# via `cargo xtask construct <sub>`; all task logic lives in Rust, not shell.
[tasks.construct-init-buildx]
description = "Create and bootstrap the construct Buildx builder"
run = "cargo xtask construct init-buildx"

[tasks.construct-doctor-buildx]
description = "Inspect the construct Buildx builder and list builders"
run = "cargo xtask construct doctor-buildx"

[tasks.construct-reset-buildx]
description = "Recreate the construct Buildx builder from scratch"
run = "cargo xtask construct reset-buildx"

[tasks.construct-build-local]
description = "Build the construct image for the host platform and load it locally"
run = "cargo xtask construct build-local"

[tasks.construct-build-platform]
description = "Build the construct image for one platform (amd64|arm64) and load it"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct build-platform "$usage_platform"'

[tasks.construct-push-platform]
description = "Push a single-platform construct image by digest (CI)"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct push-platform "$usage_platform"'

[tasks.construct-assert-version-unpublished]
description = "Fail when docker/construct/VERSION already exists in the registry"
run = "cargo xtask construct assert-version-unpublished"

[tasks.construct-publish-manifest]
description = "Combine per-platform digests into a multi-platform manifest (CI)"
run = "cargo xtask construct publish-manifest"

[tasks.construct-inspect]
description = "Print the resolved construct Bake configuration"
run = "cargo xtask construct inspect"

# Canonical gate contract (native class). The generated ci-pr.yml gates map to
# exactly these commands; keep the names stable because ci-pr.yml is generated
# and never hand-edited:
#   install → `mise install --locked`   (direct command, no task by design)
#   build   → `mise run ci`             (depends-only aggregate over `build`)
#   test    → `mise run desktop-ci`     (platform-only gate, macOS lane)
#   lint    → `mise run lint`
#   format  → `mise run fmt`
# `lint` and `fmt` stay out of the `ci` aggregate: the generated workflow
# runs them as separate gates, so aggregating them here would re-run them.
[tasks.build]
description = "Build gate: policy, docs, and snapshot partitions of the unified CI graph"
run = "git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main && cargo xtask ci --only policy --only docs --only snapshots"

[tasks.ci]
description = "Depends-only aggregate of the build gate (the generated CI build gate)"
depends = ["build"]

[tasks.test]
description = "Run the unified test gate"
run = "cargo xtask ci --only tests --fast"

[tasks.lint]
description = "Run the unified lint gate"
run = "cargo xtask ci --only lint --fast"

[tasks.fmt]
description = "Run the unified formatting gate"
run = "cargo fmt --check"

# jackin❯ desktop (native macOS usage menu bar).
# Logic lives in `cargo xtask desktop`; mise tasks are the operator entry points.
#
# Local loop:
#   mise run desktop-build          # prints DESKTOP_APP=… absolute path
#   mise run desktop-verify
#   mise run desktop-run            # launch menu-bar app (no Dock icon)
#   mise run desktop                # build + verify + run (one shot)

[tasks.desktop-bindings]
description = "Generate boltffi Swift bindings for jackin❯ desktop"
run = "cargo xtask desktop bindings"

[tasks.desktop-bindings-check]
description = "Fail when committed boltffi bindings drift from regeneration"
run = "cargo xtask desktop bindings-check"

[tasks.desktop-xcframework]
description = "Build the arm64 static JackinUsageFFI XCFramework"
run = "cargo xtask desktop xcframework"

[tasks.swift-package-native-ci]
description = "CI gate for native SwiftPM package (xcframework then build/test)"
run = '''
set -euo pipefail
mise run desktop-xcframework
cd native && swift build && swift test --parallel
'''

[tasks.desktop-generate]
description = "Regenerate the jackin❯ desktop Xcode project"
run = "xcodegen generate --spec native/project.yml"

[tasks.desktop-format]
description = "Format handwritten jackin❯ desktop Swift sources"
# Generated boltffi Swift carries swiftlint/swiftformat disable headers, but
# Apple's swift-format honors no inline disables — exclude the bindings tree.
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -path '*/JackinUsageBindings/*' -print0 | xargs -0 xcrun swift-format format --configuration .swift-format --in-place --parallel"

[tasks.desktop-format-check]
description = "Fail on jackin❯ desktop Swift formatting violations"
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -path '*/JackinUsageBindings/*' -print0 | xargs -0 xcrun swift-format lint --configuration .swift-format --strict --parallel"

[tasks.desktop-lint]
description = "Fail on jackin❯ desktop SwiftLint violations"
# No --config flag: an explicit config path disables SwiftLint's nested-config
# discovery, which the per-directory test-policy and size-debt files rely on.
run = "cd native && swiftlint lint --strict"

[tasks.desktop-test-ui]
description = "Run jackin❯ desktop UI tests against the real app host"
run = "native/Scripts/run-ui-tests.sh"

[tasks.desktop-deadcode]
description = "Scan jackin❯ desktop for unused declarations"
run = "cd native && periphery scan --project JackinDesktop.xcodeproj --schemes JackinDesktop --retain-public --retain-objc-accessible --retain-assign-only-properties --report-exclude '**/JackinUsageBindings/**' --strict --quiet"

[tasks.desktop-build]
description = "Build JackinDesktop.app (prints absolute path + how to run)"
usage = '''
arg "<version>" help="CFBundleShortVersionString (e.g. 0.6.0)" default="0.6.0"
arg "<build>" help="CFBundleVersion numeric build (e.g. 1)" default="1"
'''
run = 'cargo xtask desktop build --version "$usage_version" --build "$usage_build"'

[tasks.desktop-verify]
description = "Fail-closed verify of JackinDesktop.app (prints path + run hint)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
arg "[version]" help="Expected CFBundleShortVersionString"
arg "[build]" help="Expected CFBundleVersion numeric build"
flag "--release" help="Require Developer ID + notarization (Gatekeeper + stapler)"
'''
run = '''
set -euo pipefail
args=("$usage_app")
if [ -n "${usage_version:-}" ]; then args+=(--version "$usage_version"); fi
if [ -n "${usage_build:-}" ]; then args+=(--build "$usage_build"); fi
if [ "${usage_release:-false}" = "true" ]; then args+=(--release); fi
cargo xtask desktop verify "${args[@]}"
'''

[tasks.desktop-test]
description = "Host + pure Swift OpenUsage/CodexBar limits-only parity harnesses for Desktop"
run = "cargo xtask desktop test"

# Canonical cadence graph — one definition per command, CI and release invoke
# these exact task names (see native/Design/UnifiedAgentUsage/SwiftProjectReadiness.md).
#
# Planned seam (execution-capsules research; deliberately NOT implemented in
# the workflow-level refactor): the PR validation lane (`desktop-ci`) will
# split from the merge/scheduled resilience lane. The split lands between
# `desktop-ci` and the heavier tiers below — `desktop-merge`/`desktop-
# scheduled` will stop re-running this full PR graph and gain the resilience
# profile (clean-build ratchet, fault campaigns) instead. Until then, keep
# resilience probes out of `desktop-ci`.
[tasks.desktop-ci]
description = "PR cadence: full nonmutating jackin❯ desktop gate graph"
run = '''
set -euo pipefail
mise run desktop-bindings-check
mise run desktop-generate
mise run desktop-format-check
mise run desktop-lint
mise run desktop-test
mise run desktop-build
cargo xtask desktop test-swift
mise run desktop-verify
'''

[tasks.desktop-merge]
description = "Merge cadence: PR graph plus UI tests against the real app host"
run = '''
set -euo pipefail
mise run desktop-ci
mise run desktop-test-ui
'''

[tasks.desktop-scheduled]
description = "Scheduled cadence: merge graph plus dead-code scan"
run = '''
set -euo pipefail
mise run desktop-merge
mise run desktop-deadcode
'''

[tasks.desktop-run]
description = "Launch JackinDesktop.app (menu bar only — no Dock icon)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
flag "--verify" help="Run fail-closed verify before launch"
'''
run = '''
if [ "${usage_verify:-}" = "true" ]; then
  cargo xtask desktop run "$usage_app" --verify
else
  cargo xtask desktop run "$usage_app"
fi
'''

[tasks.desktop-prototype-build]
description = "Build the Unified Agent Usage native design prototype"
run = '''
set -euo pipefail
package="native/Design/Prototypes/UnifiedAgentUsage"
swift build --package-path "$package"
app="$package/.build/UnifiedAgentUsageProto.app"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp "$package/AppInfo.plist" "$app/Contents/Info.plist"
cp "$package/.build/debug/UnifiedAgentUsageProto" "$app/Contents/MacOS/UnifiedAgentUsageProto"
ditto "$package/.build/debug/UnifiedAgentUsageProto_UnifiedAgentUsageProto.bundle" \
  "$app/Contents/Resources/UnifiedAgentUsageProto_UnifiedAgentUsageProto.bundle"
'''

[tasks.desktop-prototype-run]
description = "Launch the Unified Agent Usage native design prototype"
usage = '''
arg "<scenario>" help="Fixture name (F00–F29 and named variants)" default="F02"
arg "<window>" help="Window size in WIDTHxHEIGHT form" default="1000x680"
arg "<appearance>" help="Appearance (dark-only application)" default="dark"
arg "[reduce]" help="Optional reduction mode: transparency, motion, or transparency,motion"
arg "[backdrop]" help="Optional harness backdrop hex color"
flag "--increase-contrast" help="Render the process-local Increased Contrast variant"
'''
run = '''
set -euo pipefail
app="native/Design/Prototypes/UnifiedAgentUsage/.build/UnifiedAgentUsageProto.app"
args=(
  --tr-scenario "$usage_scenario"
  --tr-window "$usage_window"
  --tr-appearance "$usage_appearance"
)
if [ -n "${usage_reduce:-}" ]; then args+=(--tr-reduce "$usage_reduce"); fi
if [ -n "${usage_backdrop:-}" ]; then args+=(--tr-backdrop "$usage_backdrop"); fi
if [ "${usage_increase_contrast:-false}" = "true" ]; then args+=(--tr-increase-contrast); fi
pkill -f "$PWD/$app/Contents/MacOS/UnifiedAgentUsageProto" 2>/dev/null || true
launchctl remove com.jackin.prototype.unified-agent-usage 2>/dev/null || true
open -n "$app" --args "${args[@]}"
'''

[tasks.desktop-prototype]
description = "Build + launch the Unified Agent Usage native design prototype"
usage = '''
arg "<scenario>" help="Fixture name (F00–F29 and named variants)" default="F02"
arg "<window>" help="Window size in WIDTHxHEIGHT form" default="1000x680"
arg "<appearance>" help="Appearance (dark-only application)" default="dark"
arg "[reduce]" help="Optional reduction mode: transparency, motion, or transparency,motion"
arg "[backdrop]" help="Optional harness backdrop hex color"
flag "--increase-contrast" help="Render the process-local Increased Contrast variant"
'''
run = '''
set -euo pipefail
mise run desktop-prototype-build
args=("$usage_scenario" "$usage_window" "$usage_appearance")
if [ -n "${usage_reduce:-}" ]; then args+=("$usage_reduce"); fi
if [ -n "${usage_backdrop:-}" ]; then args+=("$usage_backdrop"); fi
if [ "${usage_increase_contrast:-false}" = "true" ]; then args+=(--increase-contrast); fi
mise run desktop-prototype-run -- "${args[@]}"
'''

[tasks.desktop]
description = "Build + verify + launch jackin❯ desktop (local smoke)"
usage = '''
arg "<version>" help="CFBundleShortVersionString (e.g. 0.6.0)" default="0.6.0"
arg "<build>" help="CFBundleVersion numeric build (e.g. 1)" default="1"
'''
run = '''
set -euo pipefail
cargo xtask desktop build --version "$usage_version" --build "$usage_build"
cargo xtask desktop verify native/dist/JackinDesktop.app
cargo xtask desktop run native/dist/JackinDesktop.app
'''

[tasks.desktop-sign-notarize]
description = "Developer ID sign + notarize + staple JackinDesktop.app (requires Apple credentials)"
usage = '''
arg "[app]" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
arg "[out_zip]" help="Final post-staple ZIP path"
arg "[version]" help="Expected CFBundleShortVersionString"
arg "[build]" help="Expected CFBundleVersion numeric build"
'''
run = '''
set -euo pipefail
args=("$usage_app")
if [ -n "${usage_out_zip:-}" ]; then args+=("$usage_out_zip"); fi
if [ -n "${usage_version:-}" ]; then args+=(--version "$usage_version"); fi
if [ -n "${usage_build:-}" ]; then args+=(--build "$usage_build"); fi
cargo xtask desktop sign-notarize "${args[@]}"
'''

[tasks.desktop-release-state]
description = "Print independent Desktop release/cask state KEY=value lines"
usage = '''
arg "<version>" help="Release version without leading v"
arg "<repo>" help="GitHub owner/name" default="jackin-project/jackin"
arg "<tap>" help="Homebrew tap owner/name" default="jackin-project/homebrew-tap"
'''
run = 'cargo xtask desktop release-state "$usage_version" --repo "$usage_repo" --tap "$usage_tap"'

[tasks.desktop-bootstrap-secrets]
description = "Bootstrap release-macos Apple secrets into GitHub (never prints secret values)"
run = "cargo xtask desktop bootstrap-secrets"

[tasks.renovate-upstream-sources]
description = "Verify the pinned mise release ships both construct architectures (guards the construct installer URLs and the MISE_VERSION customManager)"
run = '''
set -euo pipefail
source docker/construct/versions.env
if [ -z "${MISE_VERSION:-}" ]; then
  echo "::error::MISE_VERSION is empty"
  exit 1
fi
# The standalone installer (https://mise.run) the construct
# Dockerfile pipes to `sh` downloads these exact release assets.
for arch in x64 arm64; do
  url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-${arch}.tar.gz"
  if ! curl --fail --silent --show-error --location --head \
    --retry 5 --retry-all-errors --retry-delay 2 \
    --connect-timeout 15 --max-time 60 \
    -o /dev/null "$url"; then
    echo "::error::${url} did not resolve — mise v${MISE_VERSION} is missing the linux-${arch} release asset"
    exit 1
  fi
done
'''
