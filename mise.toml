min_version = "2026.10.8"

[tools]
"github:open-telemetry/weaver" = "0.27.0"
actionlint = "1.7.12"
bun = "1.4.3"
cargo-binstall = "1.25.3"
"cargo:cargo-audit" = "0.22.2"
cargo-deny = "0.20.2"
"cargo:cargo-dylint" = "6.1.1"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.39"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"cargo:cargo-shear" = "1.14.0"
"github:boltffi/boltffi" = { version = "0.31.1", os = ["macos"], matching_regex = "^boltffi-(darwin-aarch64|darwin-x86_64|linux-aarch64(-musl)?|linux-x86_64(-musl)?|windows-arm64|windows-x86_64)\\.(tar\\.gz|zip)$" }
"aqua:rust-cross/cargo-zigbuild" = "0.23.4"
"cargo:dylint-link" = "6.1.1"
cosign = "3.1.3"
hk = "2.6.0"
mr-boxington = "1.24.0"
rust = { version = "1.99.0", mr_boxington = true }
shellcheck = "0.11.0"
node = "26.11.1"
python = "3.14.8"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.13.0"
"pipx:fsfe/reuse-tool" = { version = "v6.2.0", package_name = "reuse", extras = "charset-normalizer", depends = [
  "python",
  "uv",
] }
syft = "1.54.1"
xcodegen = { version = "2.46.0", os = ["macos"] }
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.17.0"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tasks.renovate-upstream-sources]
description = "Verify the pinned mise release publishes both construct installer architectures"
run = "bash docker/construct/check-upstream-assets.sh"






