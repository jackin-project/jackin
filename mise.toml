min_version = "2026.10.3"

[tools]
"aqua:apple/container" = { version = "1.2.2", os = ["macos"] }
"github:open-telemetry/weaver" = "0.24.2"
actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.21.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.0.4"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.38"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.4"
# Provides `boltffi`; pin matches the jackin-usage-ffi boltffi crate.
"cargo:boltffi_cli" = "0.30.1"
"cargo:cargo-zigbuild" = "0.23.0"
"cargo:codebook-lsp" = { version = "0.3.42", default-features = false }
"cargo:sccache" = "0.16.0"
"cargo:dylint-link" = "6.0.4"
cosign = "3.1.3"
hk = "2.0.1"
hyperfine = "1.20.0"
# Supplies `mbx zigbuild` to the cross-platform capsule builder.
mr-boxington = "1.23.0"
rust = { version = "1.97.1", mr_boxington = true }
shellcheck = "0.11.0"
node = "24.18.0"
python = "3.14.7"
ripgrep = "15.2.0"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.11.29"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = [
  "python",
  "uv",
] }
syft = "1.46.0"
xcodegen = "2.46.0"
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.16.0"
# Rust's Mise pin stays aligned with `rust-toolchain.toml`, which is also read
# by rustup and editors.

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Keep ordinary Cargo calls routed through MBX, including Cargo subprocesses
# started by jackin-xtask and boltffi. Rust version selection remains owned by
# rust-toolchain.toml; MBX has its own independent pinned tool entry above.

# Root tasks were removed. Native macOS workflows live in native/mise.toml.
