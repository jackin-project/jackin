[tools]
"aqua:apple/container" = { version = "1.2.2", os = ["macos"] }
"github:open-telemetry/weaver" = "0.24.2"
actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.21.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.0.4"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.38"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.4"
# Provides `boltffi`; pin matches the jackin-usage-ffi boltffi crate.
"cargo:boltffi_cli" = "0.30.1"
"cargo:cargo-zigbuild" = "0.23.0"
"cargo:codebook-lsp" = { version = "0.3.42", default-features = false }
"cargo:sccache" = "0.16.0"
"cargo:dylint-link" = "6.0.4"
cosign = "3.1.3"
hk = "2.0.1"
hyperfine = "1.20.0"
shellcheck = "0.11.0"
node = "24.18.0"
python = "3.14.7"
ripgrep = "15.2.0"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.11.29"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python", "uv"] }
syft = "1.46.0"
xcodegen = "2.46.0"
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.16.0"
# rust is read from `rust-toolchain.toml` via the `idiomatic_version_file`
# setting below — single source of truth for the toolchain channel and components.

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Construct image tasks. Each delegates to the `jackin-xtask` Rust binary
# via `cargo xtask construct <sub>`; all task logic lives in Rust, not shell.
[tasks.construct-init-buildx]
description = "Create and bootstrap the construct Buildx builder"
run = "cargo xtask construct init-buildx"

[tasks.construct-doctor-buildx]
description = "Inspect the construct Buildx builder and list builders"
run = "cargo xtask construct doctor-buildx"

[tasks.construct-reset-buildx]
description = "Recreate the construct Buildx builder from scratch"
run = "cargo xtask construct reset-buildx"

[tasks.construct-build-local]
description = "Build the construct image for the host platform and load it locally"
run = "cargo xtask construct build-local"

[tasks.construct-build-platform]
description = "Build the construct image for one platform (amd64|arm64) and load it"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct build-platform "$usage_platform"'

[tasks.construct-push-platform]
description = "Push a single-platform construct image by digest (CI)"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct push-platform "$usage_platform"'

[tasks.construct-assert-version-unpublished]
description = "Fail when docker/construct/VERSION already exists in the registry"
run = "cargo xtask construct assert-version-unpublished"

[tasks.construct-publish-manifest]
description = "Combine per-platform digests into a multi-platform manifest (CI)"
run = "cargo xtask construct publish-manifest"

[tasks.construct-inspect]
description = "Print the resolved construct Bake configuration"
run = "cargo xtask construct inspect"

# Canonical gate contract (native class). The generated ci-pr.yml gates map to
# exactly these commands; keep the names stable because ci-pr.yml is generated
# and never hand-edited:
#   install → `mise install --locked`   (direct command, no task by design)
#   build   → `mise run ci`             (depends-only aggregate over `build`)
#   test    → `mise run desktop-ci`     (platform-only gate, macOS lane)
#   lint    → `mise run lint`
#   format  → `mise run fmt`
# `lint` and `fmt` stay out of the `ci` aggregate: the generated workflow
# runs them as separate gates, so aggregating them here would re-run them.
[tasks.build]
description = "Build gate: policy, docs, and snapshot partitions of the unified CI graph"
run = "git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main && cargo xtask ci --only policy --only docs --only snapshots"

[tasks.ci]
description = "Depends-only aggregate of the build gate (the generated CI build gate)"
depends = ["build"]

[tasks.test]
description = "Run the unified test gate"
run = "cargo xtask ci --only tests --fast"

[tasks.lint]
description = "Run the unified lint gate"
run = "cargo xtask ci --only lint --fast"

[tasks.fmt]
description = "Run the unified formatting gate"
run = "cargo fmt --check"

[tasks.fmt-fix]
description = "Apply workspace formatting (fix side of the fmt gate; staged by hand after hook review)"
run = "cargo fmt"

# Scheduled evidence task. The collector owns API pagination and first-attempt
# joins; the generated check-profile workflow owns cadence and artifact upload.
[tasks.ci-evidence]
description = "Collect first-attempt CI/Main and Desktop evidence and write the rollup"
run = '''
set -euo pipefail
mkdir -p target/ci-evidence
if [ "${GITHUB_ACTIONS:-false}" = "true" ] && [ ! -s target/ci-evidence/attempts.json ]; then
  previous_run="$(gh run list \
    --repo "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set}" \
    --workflow ci-evidence.yml \
    --status completed \
    --limit 20 \
    --json databaseId \
    --jq '.[0].databaseId // empty')"
  if [ -n "${previous_run}" ] && [ "${previous_run}" != "${GITHUB_RUN_ID:-}" ]; then
    gh run download "${previous_run}" \
      --repo "${GITHUB_REPOSITORY}" \
      --name ci-evidence \
      --dir target/ci-evidence
    test -s target/ci-evidence/attempts.json
  fi
fi
cargo xtask ci-evidence collect \
  --repository "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY must be set}" \
  --output target/ci-evidence/attempts.json
cargo xtask ci-evidence rollup \
  --input target/ci-evidence/attempts.json \
  --json target/ci-evidence/rollup.json \
  --markdown target/ci-evidence/rollup.md
test -s target/ci-evidence/attempts.json
test -s target/ci-evidence/rollup.json
test -s target/ci-evidence/rollup.md
'''

[tasks.clippy-affected]
description = "Run Clippy with CI flags over crates affected by worktree changes (pre-commit hook)"
run = "cargo xtask clippy-affected"

[tasks.hooks-install]
description = "Install hk Git hooks for this checkout via the mise launcher (idempotent; stash isolation requires the local install)"
run = "hk install --mise"

# jackin❯ desktop (native macOS usage menu bar).
# Logic lives in `cargo xtask desktop`; mise tasks are the operator entry points.
#
# Local loop:
#   mise run desktop-build          # prints DESKTOP_APP=… absolute path
#   mise run desktop-verify
#   mise run desktop-run            # launch menu-bar app (no Dock icon)
#   mise run desktop                # build + verify + run (one shot)

[tasks.desktop-bindings]
description = "Generate boltffi Swift bindings for jackin❯ desktop"
run = "cargo xtask desktop bindings"

[tasks.desktop-bindings-check]
description = "Fail when committed boltffi bindings drift from regeneration"
run = "cargo xtask desktop bindings-check"

[tasks.desktop-xcframework]
description = "Build the arm64 static JackinUsageFFI XCFramework"
run = "cargo xtask desktop xcframework"

[tasks.swift-package-native-ci]
description = "CI gate for native SwiftPM package (xcframework then build/test)"
run = '''
set -euo pipefail
mise run desktop-xcframework
cd native && swift build && swift test --parallel
'''

[tasks.desktop-generate]
description = "Regenerate the jackin❯ desktop Xcode project"
run = "xcodegen generate --spec native/project.yml"

[tasks.desktop-format]
description = "Format handwritten jackin❯ desktop Swift sources"
# Generated boltffi Swift carries swiftlint/swiftformat disable headers, but
# Apple's swift-format honors no inline disables — exclude the bindings tree.
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -path '*/JackinUsageBindings/*' -print0 | xargs -0 xcrun swift-format format --configuration .swift-format --in-place --parallel"

[tasks.desktop-format-check]
description = "Fail on jackin❯ desktop Swift formatting violations"
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -path '*/JackinUsageBindings/*' -print0 | xargs -0 xcrun swift-format lint --configuration .swift-format --strict --parallel"

[tasks.desktop-lint]
description = "Fail on jackin❯ desktop SwiftLint violations"
# No --config flag: an explicit config path disables SwiftLint's nested-config
# discovery, which the per-directory test-policy and size-debt files rely on.
run = "cd native && swiftlint lint --strict"

[tasks.desktop-test-ui]
description = "Run jackin❯ desktop UI tests against the real app host"
run = "native/Scripts/run-ui-tests.sh"

[tasks.desktop-deadcode]
description = "Scan jackin❯ desktop for unused declarations"
run = "cd native && periphery scan --project JackinDesktop.xcodeproj --schemes JackinDesktop --retain-public --retain-objc-accessible --retain-assign-only-properties --report-exclude '**/JackinUsageBindings/**' --strict --quiet"

[tasks.desktop-build]
description = "Build JackinDesktop.app (prints absolute path + how to run)"
usage = '''
arg "[version]" help="CFBundleShortVersionString (e.g. 0.6.0)"
arg "[build]" help="CFBundleVersion numeric build (e.g. 1)"
'''
run = '''
set -eu
# Explicit args win; the release workflow exports JACKIN_APP_* via
# desktop-release-env; otherwise the previous defaults apply.
version="${usage_version:-${JACKIN_APP_VERSION:-0.6.0}}"
build="${usage_build:-${JACKIN_APP_BUILD:-1}}"
cargo xtask desktop build --version "$version" --build "$build"
'''

[tasks.desktop-verify]
description = "Fail-closed verify of JackinDesktop.app (prints path + run hint)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
arg "[version]" help="Expected CFBundleShortVersionString"
arg "[build]" help="Expected CFBundleVersion numeric build"
flag "--release" help="Require Developer ID + notarization (Gatekeeper + stapler)"
'''
run = '''
set -euo pipefail
args=("$usage_app")
if [ -n "${usage_version:-}" ]; then args+=(--version "$usage_version"); fi
if [ -n "${usage_build:-}" ]; then args+=(--build "$usage_build"); fi
if [ "${usage_release:-false}" = "true" ]; then args+=(--release); fi
cargo xtask desktop verify "${args[@]}"
'''

[tasks.desktop-test]
description = "Host + pure Swift OpenUsage/CodexBar limits-only parity harnesses for Desktop"
run = "cargo xtask desktop test"

# Canonical cadence graph — one definition per command, CI and release invoke
# these exact task names (see native/Design/UnifiedAgentUsage/SwiftProjectReadiness.md).
#
# Planned seam (execution-capsules research; deliberately NOT implemented in
# the workflow-level refactor): the PR validation lane (`desktop-ci`) will
# split from the merge/scheduled resilience lane. The split lands between
# `desktop-ci` and the heavier tiers below — `desktop-merge`/`desktop-
# scheduled` will stop re-running this full PR graph and gain the resilience
# profile (clean-build ratchet, fault campaigns) instead. Until then, keep
# resilience probes out of `desktop-ci`.
[tasks.desktop-ci]
description = "PR cadence: full nonmutating jackin❯ desktop gate graph"
run = '''
set -euo pipefail
mise run desktop-bindings-check
mise run desktop-generate
mise run desktop-format-check
mise run desktop-lint
mise run desktop-test
mise run desktop-build
cargo xtask desktop test-swift
mise run desktop-verify
'''

[tasks.desktop-merge]
description = "Merge cadence: PR graph plus UI tests against the real app host"
run = '''
set -euo pipefail
mise run desktop-ci
mise run desktop-test-ui
'''

[tasks.desktop-scheduled]
description = "Scheduled cadence: merge graph plus dead-code scan"
run = '''
set -euo pipefail
mise run desktop-merge
mise run desktop-deadcode
'''

[tasks.desktop-run]
description = "Launch JackinDesktop.app (menu bar only — no Dock icon)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
flag "--verify" help="Run fail-closed verify before launch"
'''
run = '''
if [ "${usage_verify:-}" = "true" ]; then
  cargo xtask desktop run "$usage_app" --verify
else
  cargo xtask desktop run "$usage_app"
fi
'''

[tasks.desktop-prototype-build]
description = "Build the Unified Agent Usage native design prototype"
run = '''
set -euo pipefail
package="native/Design/Prototypes/UnifiedAgentUsage"
swift build --package-path "$package"
app="$package/.build/UnifiedAgentUsageProto.app"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp "$package/AppInfo.plist" "$app/Contents/Info.plist"
cp "$package/.build/debug/UnifiedAgentUsageProto" "$app/Contents/MacOS/UnifiedAgentUsageProto"
ditto "$package/.build/debug/UnifiedAgentUsageProto_UnifiedAgentUsageProto.bundle" \
  "$app/Contents/Resources/UnifiedAgentUsageProto_UnifiedAgentUsageProto.bundle"
'''

[tasks.desktop-prototype-run]
description = "Launch the Unified Agent Usage native design prototype"
usage = '''
arg "<scenario>" help="Fixture name (F00–F29 and named variants)" default="F02"
arg "<window>" help="Window size in WIDTHxHEIGHT form" default="1000x680"
arg "<appearance>" help="Appearance (dark-only application)" default="dark"
arg "[reduce]" help="Optional reduction mode: transparency, motion, or transparency,motion"
arg "[backdrop]" help="Optional harness backdrop hex color"
flag "--increase-contrast" help="Render the process-local Increased Contrast variant"
'''
run = '''
set -euo pipefail
app="native/Design/Prototypes/UnifiedAgentUsage/.build/UnifiedAgentUsageProto.app"
args=(
  --tr-scenario "$usage_scenario"
  --tr-window "$usage_window"
  --tr-appearance "$usage_appearance"
)
if [ -n "${usage_reduce:-}" ]; then args+=(--tr-reduce "$usage_reduce"); fi
if [ -n "${usage_backdrop:-}" ]; then args+=(--tr-backdrop "$usage_backdrop"); fi
if [ "${usage_increase_contrast:-false}" = "true" ]; then args+=(--tr-increase-contrast); fi
pkill -f "$PWD/$app/Contents/MacOS/UnifiedAgentUsageProto" 2>/dev/null || true
launchctl remove com.jackin.prototype.unified-agent-usage 2>/dev/null || true
open -n "$app" --args "${args[@]}"
'''

[tasks.desktop-prototype]
description = "Build + launch the Unified Agent Usage native design prototype"
usage = '''
arg "<scenario>" help="Fixture name (F00–F29 and named variants)" default="F02"
arg "<window>" help="Window size in WIDTHxHEIGHT form" default="1000x680"
arg "<appearance>" help="Appearance (dark-only application)" default="dark"
arg "[reduce]" help="Optional reduction mode: transparency, motion, or transparency,motion"
arg "[backdrop]" help="Optional harness backdrop hex color"
flag "--increase-contrast" help="Render the process-local Increased Contrast variant"
'''
run = '''
set -euo pipefail
mise run desktop-prototype-build
args=("$usage_scenario" "$usage_window" "$usage_appearance")
if [ -n "${usage_reduce:-}" ]; then args+=("$usage_reduce"); fi
if [ -n "${usage_backdrop:-}" ]; then args+=("$usage_backdrop"); fi
if [ "${usage_increase_contrast:-false}" = "true" ]; then args+=(--increase-contrast); fi
mise run desktop-prototype-run -- "${args[@]}"
'''

[tasks.desktop]
description = "Build + verify + launch jackin❯ desktop (local smoke)"
usage = '''
arg "<version>" help="CFBundleShortVersionString (e.g. 0.6.0)" default="0.6.0"
arg "<build>" help="CFBundleVersion numeric build (e.g. 1)" default="1"
'''
run = '''
set -euo pipefail
cargo xtask desktop build --version "$usage_version" --build "$usage_build"
cargo xtask desktop verify native/dist/JackinDesktop.app
cargo xtask desktop run native/dist/JackinDesktop.app
'''

[tasks.desktop-sign-notarize]
description = "Developer ID sign + notarize + staple JackinDesktop.app (requires Apple credentials)"
usage = '''
arg "[app]" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
arg "[out_zip]" help="Final post-staple ZIP path"
arg "[version]" help="Expected CFBundleShortVersionString"
arg "[build]" help="Expected CFBundleVersion numeric build"
'''
run = '''
set -eu
# CI imports an ephemeral signing keychain when the release job maps the
# P12 secret; local runs use the login keychain and skip the import.
# Credentials are deleted before this process exits (success, failure,
# interrupt, or termination).
if [ -n "${DEVELOPER_ID_APPLICATION_P12_BASE64:-}" ]; then
  : "${DEVELOPER_ID_APPLICATION_P12_PASSWORD:?missing DEVELOPER_ID_APPLICATION_P12_PASSWORD}"
  : "${APP_STORE_CONNECT_API_KEY_P8:?missing APP_STORE_CONNECT_API_KEY_P8}"
  : "${APP_STORE_CONNECT_KEY_ID:?missing APP_STORE_CONNECT_KEY_ID}"
  : "${APP_STORE_CONNECT_ISSUER_ID:?missing APP_STORE_CONNECT_ISSUER_ID}"
  keychain_path="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/jackin-signing.keychain-db"
  keychain_password="$(openssl rand -base64 32)"
  p12_path="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/developer-id.p12"
  p8_path="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
  cleanup_signing() {
    security delete-keychain "$keychain_path" 2>/dev/null || true
    rm -f "$p12_path" "$p8_path"
  }
  trap cleanup_signing EXIT INT TERM
  printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$p12_path"
  printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$p8_path"
  security create-keychain -p "$keychain_password" "$keychain_path"
  security set-keychain-settings -lut 21600 "$keychain_path"
  security unlock-keychain -p "$keychain_password" "$keychain_path"
  security import "$p12_path" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -A -t cert -f pkcs12 \
    -k "$keychain_path" -T /usr/bin/codesign
  old_ifs=$IFS; IFS='
'
  # Newline-split only: IFS above keeps keychain paths with spaces intact.
  # shellcheck disable=SC2046,SC2086
  security list-keychain -d user -s "$keychain_path" $(security list-keychain -d user | tr -d '"')
  IFS=$old_ifs
  security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
    -k "$keychain_password" "$keychain_path"
  identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
  [ -n "$identity" ] || { echo "no Developer ID Application identity in imported keychain" >&2; exit 1; }
  export DEVELOPER_ID_APPLICATION="$identity"
  export APP_STORE_CONNECT_API_KEY_PATH="$p8_path"
fi
set -- "${usage_app:-native/dist/JackinDesktop.app}"
if [ -n "${usage_out_zip:-}" ]; then set -- "$@" "$usage_out_zip"; fi
if [ -n "${usage_version:-}" ]; then set -- "$@" --version "$usage_version"; fi
if [ -n "${usage_build:-}" ]; then set -- "$@" --build "$usage_build"; fi
cargo xtask desktop sign-notarize "$@"
'''

[tasks.desktop-release-state]
description = "Print independent Desktop release/cask state KEY=value lines"
usage = '''
arg "[version]" help="Release version without leading v"
arg "<repo>" help="GitHub owner/name" default="jackin-project/jackin"
arg "<tap>" help="Homebrew tap owner/name" default="jackin-project/homebrew-tap"
'''
run = '''
set -eu
version="${usage_version:-${JACKIN_APP_VERSION:-}}"
[ -n "$version" ] || { echo "version required: pass a version or set JACKIN_APP_VERSION" >&2; exit 1; }
cargo xtask desktop release-state "$version" --repo "$usage_repo" --tap "$usage_tap"
'''

[tasks.desktop-bootstrap-secrets]
description = "Bootstrap release-macos Apple secrets into GitHub (never prints secret values)"
run = "cargo xtask desktop bootstrap-secrets"

[tasks.desktop-release-env]
description = "Derive JACKIN_APP_VERSION/BUILD for the release workflow (dispatch fixture, tag, or manifest)"
run = '''
set -eu
# Dispatch drills assemble a fixed fixture (no secrets, no external
# writes); tag pushes derive the immutable version + commit-count build.
if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
  version="0.0.0"
  build="1"
else
  if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
    version="${GITHUB_REF_NAME#v}"
  else
    version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
    case "$version" in
      *-dev*) echo "Cannot release a dev version ($version)" >&2; exit 1;;
    esac
  fi
  # CFBundleVersion needs full history; the checkout is shallow, and this
  # repository is public so an unauthenticated unshallow is safe.
  if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
    git fetch --unshallow --quiet
  fi
  build="$(git rev-list --count HEAD)"
  case "$build" in
    ''|*[!0-9]*) echo "CFBundleVersion commit count is not numeric" >&2; exit 1;;
  esac
fi
# Stable X.Y.Z: digits and exactly two dots, no empty part.
case "$version" in
  ''|*[!0-9.]*|.*|*.|*..*) echo "Stable app version must be X.Y.Z (got $version)" >&2; exit 1;;
esac
dots="$(printf '%s' "$version" | tr -cd '.' )"
# NOTE: shell length expansion is banned in this file — mise renders task
# scripts as templates first, so that syntax breaks task parsing.
# Match the two dots with a glob instead.
case "$dots" in
  '..') ;;
  *) echo "Stable app version must be X.Y.Z (got $version)" >&2; exit 1;;
esac
if [ -n "${GITHUB_ENV:-}" ]; then
  printf 'JACKIN_APP_VERSION=%s\nJACKIN_APP_BUILD=%s\n' "$version" "$build" >> "$GITHUB_ENV"
fi
printf 'JACKIN_APP_VERSION=%s\nJACKIN_APP_BUILD=%s\n' "$version" "$build"
'''

[tasks.release-preview-package]
description = "Build and attest the complete six-payload Homebrew preview package"
run = '''
set -euo pipefail

source_commit="${VELNOR_SOURCE_COMMIT:?missing VELNOR_SOURCE_COMMIT}"
case "$source_commit" in
  ''|*[!0-9a-f]*) echo "source commit is not lowercase hex: $source_commit" >&2; exit 1 ;;
esac
[ "$(printf '%s' "$source_commit" | wc -c | tr -d ' ')" = 40 ]
[ "$(git rev-parse HEAD)" = "$source_commit" ]

source_ref="${VELNOR_SOURCE_REF:?missing VELNOR_SOURCE_REF}"
[ "$source_ref" = "refs/heads/main" ] || { echo "preview source ref must be refs/heads/main: $source_ref" >&2; exit 1; }
source_repository="jackin-project/jackin"
origin_url="$(git remote get-url origin)"
case "$origin_url" in
  https://github.com/jackin-project/jackin|https://github.com/jackin-project/jackin.git|git@github.com:jackin-project/jackin|git@github.com:jackin-project/jackin.git|ssh://git@github.com/jackin-project/jackin|ssh://git@github.com/jackin-project/jackin.git) ;;
  *) echo "preview source origin is not $source_repository: $origin_url" >&2; exit 1 ;;
esac
[ "$(git ls-remote "$origin_url" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')" = "$source_commit" ] || {
  echo "preview source commit is not the live origin/main" >&2
  exit 1
}
[ -z "$(git status --porcelain=v1 --untracked-files=all)" ] || {
  echo "preview source checkout must be clean" >&2
  exit 1
}
base_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
case "$base_version" in
  ''|*[!0-9.]*|.*|*.|*..*) echo "workspace version is not X.Y.Z: $base_version" >&2; exit 1 ;;
esac
case "$(printf '%s' "$base_version" | tr -cd '.')" in
  '..') ;;
  *) echo "workspace version is not X.Y.Z: $base_version" >&2; exit 1 ;;
esac
short_commit="$(printf '%s' "$source_commit" | cut -c1-7)"
commit_count="$(git rev-list --count "$source_commit")"
case "$commit_count" in
  ''|*[!0-9]*) echo "invalid source commit count: $commit_count" >&2; exit 1 ;;
esac
version="${base_version}-preview.${commit_count}+${short_commit}"

package_dir="${VELNOR_VERIFIED_PACKAGE_DIR:?missing VELNOR_VERIFIED_PACKAGE_DIR}"
runner_temp="${RUNNER_TEMP:?missing RUNNER_TEMP}"
case "$runner_temp" in
  /*) ;;
  *) echo "RUNNER_TEMP must be an absolute path: $runner_temp" >&2; exit 1 ;;
esac
[ -d "$runner_temp" ] || { echo "RUNNER_TEMP is not a directory: $runner_temp" >&2; exit 1; }
workspace_root="$(pwd -P)"
runner_temp="$(cd -- "$runner_temp" && pwd -P)"
case "$runner_temp" in
  "$workspace_root"|"$workspace_root"/*)
    echo "RUNNER_TEMP must not be inside the source checkout: $runner_temp" >&2
    exit 1
    ;;
esac
run_id="${GITHUB_RUN_ID:?missing GITHUB_RUN_ID}"
run_attempt="${GITHUB_RUN_ATTEMPT:?missing GITHUB_RUN_ATTEMPT}"
case "$run_id:$run_attempt" in
  ''|*[!0-9:]*) echo "GitHub run identity is not numeric" >&2; exit 1 ;;
esac
task_root="$runner_temp/jackin-preview-$run_id-$run_attempt"
safe_package_dir="$task_root/package"
[ "$package_dir" = "$safe_package_dir" ] || {
  echo "VELNOR_VERIFIED_PACKAGE_DIR must be the unique task-owned path $safe_package_dir" >&2
  exit 1
}
archive_root="$task_root/archives"
check_dir="$task_root/check"
rm -rf -- "$task_root"
mkdir -p -- "$archive_root/jackin" "$archive_root/capsule" "$package_dir" "$check_dir"
trap 'rm -rf -- "$task_root"' EXIT

export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$PWD/target}"
cargo xtask release-archives \
  --package jackin \
  --version "$version" \
  --output-dir "$archive_root/jackin"
cargo xtask release-archives \
  --package jackin-capsule \
  --version "$version" \
  --output-dir "$archive_root/capsule"

cp -- "$archive_root/jackin/"*.tar.gz* "$package_dir/"
cp -- "$archive_root/capsule/"*.tar.gz* "$package_dir/"

payloads=(
  jackin-aarch64-apple-darwin.tar.gz
  jackin-x86_64-apple-darwin.tar.gz
  jackin-aarch64-unknown-linux-gnu.tar.gz
  jackin-x86_64-unknown-linux-gnu.tar.gz
  jackin-capsule-aarch64-unknown-linux-gnu.tar.gz
  jackin-capsule-x86_64-unknown-linux-gnu.tar.gz
)
supporting_assets=(
  jackin-aarch64-apple-darwin.tar.gz.sha256
  jackin-aarch64-apple-darwin.tar.gz.bundle
  jackin-aarch64-apple-darwin.tar.gz.sbom.json
  jackin-x86_64-apple-darwin.tar.gz.sha256
  jackin-x86_64-apple-darwin.tar.gz.bundle
  jackin-x86_64-apple-darwin.tar.gz.sbom.json
  jackin-aarch64-unknown-linux-gnu.tar.gz.sha256
  jackin-aarch64-unknown-linux-gnu.tar.gz.bundle
  jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json
  jackin-x86_64-unknown-linux-gnu.tar.gz.sha256
  jackin-x86_64-unknown-linux-gnu.tar.gz.bundle
  jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json
  jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256
  jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle
  jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json
  jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256
  jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle
  jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json
  SHA256SUMS
  capsule-manifest.json
  capsule-manifest.json.bundle
)
for payload in "${payloads[@]}"; do
  test -s "$package_dir/$payload"
  test -s "$package_dir/$payload.sha256"
  test -s "$package_dir/$payload.bundle"
  test -s "$package_dir/$payload.sbom.json"
  expected="$(awk 'NR == 1 {print $1}' "$package_dir/$payload.sha256")"
  [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
  test "$(sha256sum "$package_dir/$payload" | awk '{print $1}')" = "$expected"
  cargo xtask release-verify "$package_dir/$payload" --skip-attestation
done

test "$(tar -xzf "$package_dir/jackin-x86_64-unknown-linux-gnu.tar.gz" -C "$check_dir" && "$check_dir/jackin" --version)" = "jackin $version"

LC_ALL=C sha256sum \
  "$package_dir/jackin-aarch64-apple-darwin.tar.gz" \
  "$package_dir/jackin-x86_64-apple-darwin.tar.gz" \
  "$package_dir/jackin-aarch64-unknown-linux-gnu.tar.gz" \
  "$package_dir/jackin-x86_64-unknown-linux-gnu.tar.gz" \
  "$package_dir/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz" \
  "$package_dir/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz" \
  | sed "s# $package_dir/# #" > "$package_dir/SHA256SUMS"

jq -n \
  --arg version "$version" \
  --arg arm64 "$(awk 'NR == 1 {print $1}' "$package_dir/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256")" \
  --arg x86 "$(awk 'NR == 1 {print $1}' "$package_dir/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256")" \
  '{version: $version, targets: {"aarch64-unknown-linux-gnu": $arm64, "x86_64-unknown-linux-gnu": $x86}}' \
  > "$package_dir/capsule-manifest.json"
cosign sign-blob \
  --bundle "$package_dir/capsule-manifest.json.bundle" \
  --yes "$package_dir/capsule-manifest.json"

for supporting_asset in "${supporting_assets[@]}"; do
  test -s "$package_dir/$supporting_asset"
done

jq -n \
  --arg version "$version" \
  --arg source_commit "$source_commit" \
  --arg source_ref "$source_ref" \
  --arg source_repository "$source_repository" \
  --arg schema "velnor.package-release.v1" \
  --argjson assets "$(
    for payload in "${payloads[@]}"; do
      jq -n \
        --arg name "$payload" \
        --arg sha256 "$(awk 'NR == 1 {print $1}' "$package_dir/$payload.sha256")" \
        '{name: $name, sha256: $sha256}'
    done | jq -s .
  )" \
  --argjson supporting_assets "$(
    for supporting_asset in "${supporting_assets[@]}"; do
      jq -n \
        --arg name "$supporting_asset" \
        --arg sha256 "$(sha256sum "$package_dir/$supporting_asset" | awk '{print $1}')" \
        '{name: $name, sha256: $sha256}'
    done | jq -s .
  )" \
  '{assets: $assets, schema: $schema, source_commit: $source_commit, source_ref: $source_ref, source_repository: $source_repository, supporting_assets: $supporting_assets, version: $version}' \
  > "$package_dir/release-manifest.json"

payload_count="$(printf '%s\n' "${payloads[@]}" | wc -l | tr -d '[:space:]')"
supporting_asset_count="$(printf '%s\n' "${supporting_assets[@]}" | wc -l | tr -d '[:space:]')"
jq -e \
  --arg schema "velnor.package-release.v1" \
  --arg source_commit "$source_commit" \
  --arg source_ref "$source_ref" \
  --arg source_repository "$source_repository" \
  --arg version "$version" \
  --argjson payload_count "$payload_count" \
  --argjson supporting_asset_count "$supporting_asset_count" \
  'keys == ["assets", "schema", "source_commit", "source_ref", "source_repository", "supporting_assets", "version"] and
   .schema == $schema and
   .source_commit == $source_commit and
   .source_ref == $source_ref and
   .source_repository == $source_repository and
   .version == $version and
   (.assets | type == "array" and length == $payload_count and all(.[]; (keys == ["name", "sha256"] and (.sha256 | test("^[0-9a-f]{64}$"))))) and
   (.supporting_assets | type == "array" and length == $supporting_asset_count and all(.[]; (keys == ["name", "sha256"] and (.sha256 | test("^[0-9a-f]{64}$")))))' \
  "$package_dir/release-manifest.json" >/dev/null
for payload in "${payloads[@]}"; do
  expected="$(sha256sum "$package_dir/$payload" | awk '{print $1}')"
  jq -e --arg name "$payload" --arg sha256 "$expected" \
    '[.assets[] | select(.name == $name and .sha256 == $sha256)] | length == 1' \
    "$package_dir/release-manifest.json" >/dev/null
done
for supporting_asset in "${supporting_assets[@]}"; do
  expected="$(sha256sum "$package_dir/$supporting_asset" | awk '{print $1}')"
  jq -e --arg name "$supporting_asset" --arg sha256 "$expected" \
    '[.supporting_assets[] | select(.name == $name and .sha256 == $sha256)] | length == 1' \
    "$package_dir/release-manifest.json" >/dev/null
done

jq -n \
  --arg source_digest "$source_commit" \
  --arg source_ref "$source_ref" \
  --arg source_repository "$source_repository" \
  --slurpfile manifest "$package_dir/release-manifest.json" \
  '{manifest: $manifest[0], source_digest: $source_digest, source_ref: $source_ref, source_repository: $source_repository}' \
  > "$package_dir/identity.json"

jq -e \
  --arg source_digest "$source_commit" \
  --arg source_ref "$source_ref" \
  --arg source_repository "$source_repository" \
  --slurpfile manifest "$package_dir/release-manifest.json" \
  'keys == ["manifest", "source_digest", "source_ref", "source_repository"] and
   .source_digest == $source_digest and
   .source_ref == $source_ref and
   .source_repository == $source_repository and
   .manifest == $manifest[0]' \
  "$package_dir/identity.json" >/dev/null

# Verify the complete handoff, including the signed capsule manifest's target
# bindings, before exposing the package to the workflow's publish steps.
cargo xtask release-verify-package

printf 'version=%s\nsource_commit=%s\n' "$version" "$source_commit"
'''

[tasks.verify-preview-package]
description = "Verify the complete six-payload Homebrew preview package handoff"
run = '''
set -euo pipefail
: "${VELNOR_VERIFIED_PACKAGE_DIR:?missing VELNOR_VERIFIED_PACKAGE_DIR}"
cargo xtask release-verify-package
'''

[tasks.migrate-preview-legacy]
description = "One-time migration of the known legacy rolling preview release"
run = 'cargo xtask preview migrate-legacy'

[tasks.renovate-upstream-sources]
description = "Verify the pinned mise release ships both construct architectures (guards the construct installer URLs and the MISE_VERSION customManager)"
run = '''
set -eu
. ./docker/construct/versions.env
if [ -z "${MISE_VERSION:-}" ]; then
  echo "::error::MISE_VERSION is empty"
  exit 1
fi
# The standalone installer (https://mise.run) the construct
# Dockerfile pipes to `sh` downloads these exact release assets.
for arch in x64 arm64; do
  url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-${arch}.tar.gz"
  if ! curl --fail --silent --show-error --location --head \
    --retry 5 --retry-all-errors --retry-delay 2 \
    --connect-timeout 15 --max-time 60 \
    -o /dev/null "$url"; then
    echo "::error::${url} did not resolve — mise v${MISE_VERSION} is missing the linux-${arch} release asset"
    exit 1
  fi
done
'''
