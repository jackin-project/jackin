min_version = "2026.10.3"

[tools]
"aqua:apple/container" = { version = "1.2.2", os = ["macos"] }
"github:open-telemetry/weaver" = "0.24.2"
actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.25.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.39"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"cargo:cargo-shear" = "1.14.0"
# Provides `boltffi`; pin matches the jackin-usage-ffi boltffi crate.
"cargo:boltffi_cli" = { version = "0.30.1", os = ["macos"] }
"cargo:cargo-zigbuild" = "0.23.4"
"cargo:codebook-lsp" = { version = "0.3.42", os = ["macos"] }
"cargo:sccache" = "0.18.0"
"cargo:dylint-link" = "6.1.0"
cosign = "3.1.3"
hk = "2.0.1"
hyperfine = "1.20.0"
# Native mise integration routes Cargo through mbx. Keep this pin aligned with
# rust-toolchain.toml, which is also used directly by rustup and editors.
mr-boxington = "1.22.0"
rust = { version = "1.99.0", mr_boxington = true }
shellcheck = "0.11.0"
node = "24.18.0"
python = "3.14.7"
ripgrep = "15.2.0"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
uv = "0.12.23"
# The official release is source-only; use its pinned release tag so mise keeps
# this CLI on uv's normal source-build path instead of wheel-only dependency locks.
"pipx:fsfe/reuse-tool" = { version = "v6.2.0", package_name = "reuse", extras = "charset-normalizer", depends = [
  "python",
  "uv",
] }
syft = "1.46.0"
xcodegen = "2.46.0"
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.16.0"
# rust is read from `rust-toolchain.toml` via the `idiomatic_version_file`
# setting below — single source of truth for the toolchain channel and components.

[settings]
cargo.binstall = true
cargo.binstall_quickinstall = true
cargo.binstall_only = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Native macOS workflow tasks live in native/mise.toml.
