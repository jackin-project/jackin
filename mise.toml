min_version = "2026.10.3"

[tools]
# Follow rust-toolchain.toml and route Cargo through mbx.
rust = { version = "latest", mr_boxington = true }
mr-boxington = "1.22.0"
"cargo-binstall" = "1.25.1"

# Rust workspace checks, security, coverage, fuzzing, and release builds.
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.1.0"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.39"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"cargo:cargo-shear" = "1.14.0"
"cargo:cargo-zigbuild" = "0.23.4"
"cargo:dylint-link" = "6.1.0"
# Provides `boltffi` for the macOS desktop build; keep aligned with Cargo.toml.
"cargo:boltffi_cli" = { version = "0.31.0", os = ["macos"] }
zig = "0.17.0"

# Documentation development.
node = "26.10.0"
bun = "1.4.2"

# macOS desktop development.
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
xcodegen = { version = "2.46.0", os = ["macos"] }
xcbeautify = { version = "3.2.1", os = ["macos"] }

# Repository lint and telemetry checks.
"github:open-telemetry/weaver" = "0.27.0"
actionlint = "1.7.12"
hk = "2.5.0"
shellcheck = "0.11.0"

# Release packaging and signing.
cosign = "3.1.3"
syft = "1.54.0"

# REUSE is source-only upstream, so install its tagged release through uv.
python = "3.14.8"
uv = "0.12.23"
"pipx:fsfe/reuse-tool" = { version = "v6.2.0", package_name = "reuse", extras = "charset-normalizer", depends = ["python", "uv"] }

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true
