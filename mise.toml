[tools]
"aqua:apple/container" = { version = "1.2.2", os = ["macos"] }
"github:open-telemetry/weaver" = "0.24.2"
actionlint = "1.7.12"
bun = "1.3.14"
cargo-binstall = "1.21.1"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-dylint" = "6.0.4"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-hack" = "0.6.45"
"cargo:cargo-hakari" = "0.9.38"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-mutants" = "27.1.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:cargo-shear" = "1.13.4"
# Provides `uniffi-bindgen`; pin matches jackin-usage-ffi UniFFI (needs cli feature).
"cargo:uniffi" = { version = "0.32.0", default-features = true, features = "cli" }
"cargo:cargo-zigbuild" = "0.23.0"
"cargo:codebook-lsp" = { version = "0.3.42", default-features = false }
"cargo:sccache" = "0.16.0"
"cargo:dylint-link" = "6.0.4"
cosign = "3.1.2"
hyperfine = "1.20.0"
shellcheck = "0.11.0"
node = "24.18.0"
python = "3.14.7"
periphery = { version = "3.8.0", os = ["macos"] }
swiftlint = { version = "0.65.0", os = ["macos"] }
uv = "0.11.29"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }
syft = "1.46.0"
xcodegen = "2.46.0"
xcbeautify = { version = "3.2.1", os = ["macos"] }
zig = "0.16.0"
# rust is read from `rust-toolchain.toml` via the `idiomatic_version_file`
# setting below — single source of truth for the toolchain channel and components.

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

# Construct image tasks. Each delegates to the `jackin-xtask` Rust binary
# via `cargo xtask construct <sub>`; all task logic lives in Rust, not shell.
[tasks.construct-init-buildx]
description = "Create and bootstrap the construct Buildx builder"
run = "cargo xtask construct init-buildx"

[tasks.construct-doctor-buildx]
description = "Inspect the construct Buildx builder and list builders"
run = "cargo xtask construct doctor-buildx"

[tasks.construct-reset-buildx]
description = "Recreate the construct Buildx builder from scratch"
run = "cargo xtask construct reset-buildx"

[tasks.construct-build-local]
description = "Build the construct image for the host platform and load it locally"
run = "cargo xtask construct build-local"

[tasks.construct-build-platform]
description = "Build the construct image for one platform (amd64|arm64) and load it"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct build-platform "$usage_platform"'

[tasks.construct-push-platform]
description = "Push a single-platform construct image by digest (CI)"
usage = 'arg "<platform>" help="amd64 or arm64"'
run = 'cargo xtask construct push-platform "$usage_platform"'

[tasks.construct-assert-version-unpublished]
description = "Fail when docker/construct/VERSION already exists in the registry"
run = "cargo xtask construct assert-version-unpublished"

[tasks.construct-publish-manifest]
description = "Combine per-platform digests into a multi-platform manifest (CI)"
run = "cargo xtask construct publish-manifest"

[tasks.construct-inspect]
description = "Print the resolved construct Bake configuration"
run = "cargo xtask construct inspect"

[tasks.ci]
description = "Run unified build and policy gates"
run = "git fetch --no-tags origin main:refs/remotes/origin/main && cargo xtask ci --only policy --only docs --only snapshots"

[tasks.test]
description = "Run the unified test gate"
run = "cargo xtask ci --only tests --fast"

[tasks.lint]
description = "Run the unified lint gate"
run = "cargo xtask ci --only lint --fast"

[tasks.fmt]
description = "Run the unified formatting gate"
run = "cargo fmt --check"

# jackin❯ desktop (native macOS usage menu bar).
# Logic lives in `cargo xtask desktop`; mise tasks are the operator entry points.
#
# Local loop:
#   mise run desktop-build          # prints DESKTOP_APP=… absolute path
#   mise run desktop-verify
#   mise run desktop-run            # launch menu-bar app (no Dock icon)
#   mise run desktop                # build + verify + run (one shot)

[tasks.desktop-bindings]
description = "Generate UniFFI Swift bindings for jackin❯ desktop"
run = "cargo xtask desktop bindings"

[tasks.desktop-xcframework]
description = "Build the arm64 static JackinUsageFFI XCFramework"
run = "cargo xtask desktop xcframework"

[tasks.desktop-generate]
description = "Regenerate the jackin❯ desktop Xcode project"
run = "xcodegen generate --spec native/project.yml"

[tasks.desktop-format]
description = "Format handwritten jackin❯ desktop Swift sources"
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -name 'jackin_usage_ffi.swift' -print0 | xargs -0 xcrun swift-format format --configuration .swift-format --in-place --parallel"

[tasks.desktop-format-check]
description = "Fail on jackin❯ desktop Swift formatting violations"
run = "cd native && find Sources Tests UITests Tools Scripts -name '*.swift' ! -name 'jackin_usage_ffi.swift' -print0 | xargs -0 xcrun swift-format lint --configuration .swift-format --strict --parallel"

[tasks.desktop-lint]
description = "Fail on jackin❯ desktop SwiftLint violations"
run = "cd native && swiftlint lint --strict --config .swiftlint.yml"

[tasks.desktop-test-ui]
description = "Run jackin❯ desktop UI tests against the real app host"
run = "native/Scripts/run-ui-tests.sh"

[tasks.desktop-deadcode]
description = "Scan jackin❯ desktop for unused declarations"
run = "cd native && periphery scan --project JackinDesktop.xcodeproj --schemes JackinDesktop --retain-public --retain-objc-accessible --retain-assign-only-properties --report-exclude '**/jackin_usage_ffi.swift' --strict --quiet"

[tasks.desktop-build]
description = "Build JackinDesktop.app (prints absolute path + how to run)"
usage = '''
arg "<version>" help="CFBundleShortVersionString (e.g. 0.6.0)" default="0.6.0"
arg "<build>" help="CFBundleVersion numeric build (e.g. 1)" default="1"
'''
run = 'cargo xtask desktop build --version "$usage_version" --build "$usage_build"'

[tasks.desktop-verify]
description = "Fail-closed verify of JackinDesktop.app (prints path + run hint)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
'''
run = 'cargo xtask desktop verify "$usage_app"'

[tasks.desktop-test]
description = "Host + pure Swift OpenUsage/CodexBar limits-only parity harnesses for Desktop"
run = "cargo xtask desktop test"

[tasks.desktop-ci]
description = "Run the required jackin❯ desktop macOS CI contract"
run = '''
set -euo pipefail
mise run desktop-bindings
mise run desktop-format-check
mise run desktop-lint
mise run desktop-test
cd native
swift test -c release
'''

[tasks.desktop-run]
description = "Launch JackinDesktop.app (menu bar only — no Dock icon)"
usage = '''
arg "<app>" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
flag "--verify" help="Run fail-closed verify before launch"
'''
run = '''
if [ "${usage_verify:-}" = "true" ]; then
  cargo xtask desktop run "$usage_app" --verify
else
  cargo xtask desktop run "$usage_app"
fi
'''

[tasks.desktop]
description = "Build + verify + launch jackin❯ desktop (local smoke)"
usage = '''
arg "<version>" help="CFBundleShortVersionString (e.g. 0.6.0)" default="0.6.0"
arg "<build>" help="CFBundleVersion numeric build (e.g. 1)" default="1"
'''
run = '''
set -euo pipefail
cargo xtask desktop build --version "$usage_version" --build "$usage_build"
cargo xtask desktop verify native/dist/JackinDesktop.app
cargo xtask desktop run native/dist/JackinDesktop.app
'''

[tasks.desktop-sign-notarize]
description = "Developer ID sign + notarize + staple JackinDesktop.app (requires Apple credentials)"
usage = '''
arg "[app]" help="Path to JackinDesktop.app" default="native/dist/JackinDesktop.app"
arg "[out_zip]" help="Final post-staple ZIP path"
'''
run = '''
if [ -n "${usage_out_zip:-}" ]; then
  cargo xtask desktop sign-notarize "$usage_app" "$usage_out_zip"
else
  cargo xtask desktop sign-notarize "$usage_app"
fi
'''

[tasks.desktop-release-state]
description = "Print independent Desktop release/cask state KEY=value lines"
usage = '''
arg "<version>" help="Release version without leading v"
arg "--repo" help="GitHub owner/name" default="jackin-project/jackin"
arg "--tap" help="Homebrew tap owner/name" default="jackin-project/homebrew-tap"
'''
run = 'cargo xtask desktop release-state "$usage_version" --repo "$usage_repo" --tap "$usage_tap"'

[tasks.desktop-bootstrap-secrets]
description = "Bootstrap release-macos Apple secrets into GitHub (never prints secret values)"
run = "cargo xtask desktop bootstrap-secrets"
