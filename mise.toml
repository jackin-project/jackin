[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
prek = "0.4.13"
shellcheck = "0.11.0"

[tasks.actionlint]
run = "actionlint"

[tasks.ci]
run = "prek run --all-files"

[tasks.test]
run = "prek run --all-files"

[tasks.lint]
run = "prek run --all-files"

[tasks.fmt]
run = "prek run --all-files"

[settings]
lockfile = true
