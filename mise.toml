min_version = { hard = "2026.11.1", soft = "2026.11.1" }

[tools]
"aqua:betterleaks/betterleaks" = "1.10.0"
bun = "1.4.4"
cargo-binstall = "1.26.2"
cargo-deny = "0.20.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
"github:Boshen/cargo-shear" = "1.14.0"
gh = "2.103.3"
"aqua:gitleaks/gitleaks" = "8.30.1"
hk = { version = "2.12.0", workflow = "release.yml" }
"github:mongodb/kingfisher" = { version = "2.16.0", matching_regex = "^kingfisher-(darwin|linux)-(arm64|x64)\\.tgz$|^kingfisher-windows-x64\\.zip$" }
mr-boxington = { version = "1.30.0", workflow = "release.yml@refs/heads/main" }
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
], mr_boxington = true }
shellcheck = "0.11.0"
jactionlint = { version = "2.4.0", workflow = "release.yaml" }
rumdl = "0.3.2"
uv = "0.13.7"
node = "26.13.0"
python = "3.15.2"
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer" }
zizmor = "1.32.0"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks."check:dependency-usage"]
description = "Reject unused workspace dependencies"
run = "cargo shear --deny-warnings"

[tasks."check:repository-steps"]
description = "Run the repository steps that start no external tool: comments, layers, pins, containers, errors"
run = "cargo xtask ci --only comments,layers,pins,containers,errors"

[tasks."ci:fast"]
description = "Run the repository gates without the docs build"
run = "mbx +1.99.1 xtask ci --fast"

[tasks."ci:full"]
description = "Run the repository gates; the docs build joins at P12.1"
run = "mbx +1.99.1 xtask ci --no-docs"

[tasks."check:secrets-scan"]
description = "Scan the indexed tree in a temporary linked worktree and the history reachable from HEAD with gitleaks, betterleaks and Kingfisher"
run = """
status=0
index_tree=$(git write-tree) || exit 1
parent=$(mktemp -d) || exit 1
tree="$parent/worktree"
cleanup() {
  result=$?
  trap - 0 HUP INT TERM
  git -c core.hooksPath=/dev/null worktree remove --force "$tree" >/dev/null 2>&1 || result=1
  rmdir "$parent" 2>/dev/null || result=1
  exit "$result"
}
trap cleanup 0
trap 'exit 129' HUP
trap 'exit 130' INT
trap 'exit 143' TERM
git -c core.hooksPath=/dev/null worktree add --detach --no-checkout "$tree" HEAD || exit 1
git_dir=$(git -C "$tree" rev-parse --absolute-git-dir) || exit 1
GIT_INDEX_FILE="$git_dir/index" git -C "$tree" -c core.hooksPath=/dev/null read-tree "$index_tree" || exit 1
GIT_INDEX_FILE="$git_dir/index" git -C "$tree" -c core.hooksPath=/dev/null checkout-index --all || exit 1
(cd "$tree" && gitleaks dir . --redact --no-banner) || status=1
gitleaks git . --redact --no-banner --log-opts=HEAD || status=1
(cd "$tree" && betterleaks dir . --config .gitleaks.toml --redact --no-banner) || status=1
betterleaks git . --config .gitleaks.toml --redact --no-banner --log-opts=HEAD || status=1
(cd "$tree" && kingfisher scan . --git-history none --confidence low --no-validate --redact --no-update-check --baseline-file .kingfisher-baseline.yml) || status=1
kingfisher scan . --git-history full --branch HEAD --confidence low --no-validate --redact --no-update-check --baseline-file .kingfisher-baseline.yml || status=1
exit "$status"
"""

[tasks."check:sonar"]
description = "Verify the Sonar scanner configuration applies the repository properties from the repository root"
run = """
status=0
properties=sonar-project.properties
scanner_config=.sonarcloud.properties
for f in "$properties" "$scanner_config"
do
  if [ ! -f "$f" ] || [ -L "$f" ]
  then
    status=1
  fi
done
if [ "$status" -eq 0 ]
then
  left=$(mktemp) || exit 1
  right=$(mktemp) || exit 1
  cleanup() {
    result=$?
    trap - 0 HUP INT TERM
    rm -f "$left" "$right" || result=1
    exit "$result"
  }
  trap cleanup 0
  trap 'exit 129' HUP
  trap 'exit 130' INT
  trap 'exit 143' TERM
  grep -v '^[[:space:]]*#' "$properties" | grep -v '^[[:space:]]*$' | sort > "$left" || status=1
  grep -v '^[[:space:]]*#' "$scanner_config" | grep -v '^[[:space:]]*$' | sort > "$right" || status=1
  cmp -s "$left" "$right" || status=1
fi
exit "$status"
"""
