schema = 1

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
runner_label = "ubuntu-26.04"
generator_validation = "bootstrap"
max_parallel_jobs = 4

[[workflow.tasks]]
kind = "verification"
id = "construct-upstream-assets"
mise_task = "renovate-upstream-sources"
source = { mise_config = "mise.toml", working_directory = "." }
runner = "linux-x64"
timeout_minutes = 10

[[workflow.tasks]]
kind = "build"
id = "native-desktop-ci"
mise_task = "ci"
source = { mise_config = "native/mise.toml", working_directory = "native" }
tools = ["aqua:nextest-rs/nextest/cargo-nextest", "github:boltffi/boltffi", "mr-boxington", "rust", "swiftlint", "xcodegen"]
runner = "macos-26-arm64"
timeout_minutes = 120
cargo_build_jobs = 2
nextest_test_threads = 2

[[workflow.tasks]]
kind = "verification"
id = "native-swift-format"
mise_task = "format-check"
source = { mise_config = "native/mise.toml", working_directory = "native" }
runner = "macos-26-arm64"
timeout_minutes = 10

[[workflow.tasks]]
kind = "verification"
id = "native-swiftlint"
mise_task = "lint"
source = { mise_config = "native/mise.toml", working_directory = "native" }
runner = "macos-26-arm64"
timeout_minutes = 10

[resources]
compiler_process_budget = 4
test_process_budget = 4

[test_sharding]
default_shards = 1

[discovery]
exclude = [
  "native/**",
  "docs/**",
  "docker/**",
  "**/fuzz/**",
  "fuzz/**",
  "crates/tools/jackin-lints/**",
  "vendor/**"
]

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"
