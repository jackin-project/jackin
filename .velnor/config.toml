schema = 1

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
runner_label = "ubuntu-26.04"
generator_validation = "bootstrap"
max_parallel_jobs = 4

[resources]
compiler_process_budget = 4
test_process_budget = 4

[test_sharding]
default_shards = 1

[discovery]
exclude = [
  "native/**",
  "docs/**",
  "docker/**",
  "**/fuzz/**",
  "fuzz/**",
  "crates/tools/jackin-lints/**",
  "vendor/**",
  "crates/core/jackin-brand/**",
  "crates/core/jackin-build-meta/**",
  "crates/adapters/jackin-oppicker/**",
  "crates/tools/jackin-pr-trailers/**",
  "crates/adapters/jackin-omp-store/**"
]

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"
