schema = 2

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 4
crate_timeout_minutes = 10
mise_quiet = false
pull_request_cache_policy = "read-only"
runner_label = "ubuntu-26.04"

[resources]
compiler_process_budget = 4
test_process_budget = 4

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[stacks.rust]
compile_driver = "mbx"
test_runner = "cargo_nextest"
allow_empty_test_suite = true

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
all_features = true
target = "host"

[discovery]
exclude = ["docs/**", "vendor/sqlx-sqlite/**"]

[actions.overrides]

[execution]
default_profile = "hosted"
hosted_profile = "hosted"
scale_set_profile = "local"

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"

