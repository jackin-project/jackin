[agent]
id = "codex"
provider = "codex"
launch_command = ["codex", "--sandbox", "danger-full-access", "-c", "check_for_update_on_startup=false"]
workdir = "/sandbox/project"
state_dir = "/sandbox/.codex"

[binaries]
dir = "/usr/local/bin"
agent = "/usr/local/bin/codex"
code_mode_host = "/usr/local/bin/codex-code-mode-host"
start = "/usr/local/bin/jackin-start"
system_config = "/etc/codex/config.toml"

[install]
version = "0.166.0"
url_template = "https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-{target}.tar.gz"
archive_members = ["bin/codex", "bin/codex-code-mode-host"]
version_output = "codex-cli {version}"
system_config_content = "check_for_update_on_startup = false\n"

[install.targets.arm64]
platform = "linux/arm64"
target = "aarch64-unknown-linux-musl"
sha256 = "7821b77dda2e6283fb1f63f3165177a271da8833e857cf673c6ca1c9db3bfcc6"

[install.targets.amd64]
platform = "linux/amd64"
target = "x86_64-unknown-linux-musl"
sha256 = "1d44b28bc4ac9937d7d3532264baa68a507ce364956a0d4ebb856f331cdee254"

[openshell_provider]
profile_id = "codex"
profile_file = "rewrite/drafts/codex-provider.yaml"
name_template = "jackin-{account}-codex"
credential_keys = ["CODEX_AUTH_ACCESS_TOKEN"]
refresh_token_key = "CODEX_AUTH_REFRESH_TOKEN"
refresh_strategy = "oauth2-refresh-token"
token_url = "https://auth.openai.com/oauth/token"
client_id_source = "auth.json tokens.oauth_provenance.client_id"

[[network_policy.rules]]
name = "_provider_{provider}"
binaries = ["/usr/local/bin/codex"]
endpoints = [
  { host = "api.openai.com", port = 443, protocol = "rest", access = "read-write", enforcement = "enforce" },
  { host = "auth.openai.com", port = 443, protocol = "rest", access = "read-write", enforcement = "enforce" },
  { host = "chatgpt.com", port = 443, protocol = "rest", access = "read-write", enforcement = "enforce" },
  { host = "ab.chatgpt.com", port = 443, protocol = "rest", access = "read-write", enforcement = "enforce" },
]

[auth_json]
path = "/sandbox/.codex/auth.json"
mode = "0600"
auth_mode = "chatgptAuthTokens"
openai_api_key = "null"
access_token = "placeholder: the value of the sandbox env CODEX_AUTH_ACCESS_TOKEN, which is an openshell:resolve:env placeholder"
refresh_token = "empty string"
account_id = "real: the account id of the host login, written at account import, never the CODEX_AUTH_ACCOUNT_ID placeholder"
id_token = "non-secret placeholder JWT: header alg none, payload iss https://auth.openai.com aud codex sub openshell-app-server, signature part placeholder"
last_refresh = "UTC timestamp at write time"

[start]
launch_id_env = "JACKIN_LAUNCH_ID"
setup_hook_env = "JACKIN_HOOK_SETUP"
preflight_hook_env = "JACKIN_HOOK_PREFLIGHT"
state_dir = "/sandbox/.jackin"
ready_marker = "/sandbox/.jackin/ready-{launch_id}"
setup_done_marker = "/sandbox/.jackin/setup-done-{launch_id}"
