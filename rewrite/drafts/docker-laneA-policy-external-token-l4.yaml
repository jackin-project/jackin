version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /sbin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /tmp
    - /dev/null
    - /sandbox
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  docker_engine:
    name: docker_engine
    endpoints:
      - host: host.openshell.internal
        port: 18477
        allow_uninspected_credentials: true
        credential_binding:
          provider: p05a-engine
    binaries:
      - path: /usr/local/bin/docker
