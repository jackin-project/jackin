allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
too-many-lines-threshold = 150
cognitive-complexity-threshold = 58
excessive-nesting-threshold = 5
too-many-arguments-threshold = 7
disallowed-methods = [
    { path = "std::process::Command::output", reason = "blocking subprocess output must not run on render/runtime threads; use async process helpers or spawn_blocking" },
    { path = "std::thread::sleep", reason = "blocking sleep must not run on render/runtime threads; use async sleep, polling hooks, or an owned OS thread" },
    { path = "std::fs::File::open", reason = "blocking filesystem opens must not run on render/runtime threads; use async file work or spawn_blocking" },
    { path = "std::fs::OpenOptions::open", reason = "blocking filesystem opens must not run on render/runtime threads; use async file work or spawn_blocking" },
    { path = "ratatui_core::buffer::Buffer::set_string", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::set_stringn", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::set_line", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::set_span", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::set_style", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::cell_mut", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::get_mut", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::reset", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::merge", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Buffer::resize", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_symbol", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_char", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_style", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_fg", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_bg", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_skip", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::set_diff_option", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::merge_symbol", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::reset", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui::Frame::buffer_mut", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui::Frame::render_widget", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui::Frame::render_stateful_widget", reason = "C1: the baseline draws, jackin-tui draws nothing" },
]
disallowed-fields = [
    { path = "ratatui_core::buffer::Buffer::content", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::fg", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::bg", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::modifier", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::diff_option", reason = "C1: the baseline draws, jackin-tui draws nothing" },
    { path = "ratatui_core::buffer::Cell::skip", reason = "C1: the baseline draws, jackin-tui draws nothing" },
]
