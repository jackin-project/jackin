# Baseline rumdl policy (hk builtin `rumdl`). Same intent as the documentation-portal markdownlint policy:
# long lines, inline HTML and non-H1 first lines are normal in these docs. Broken relative links (MD057) stay ON: after the
# split many READMEs still point at monorepo paths (../../AGENTS.md, ../../docs/...) and must be fixed or removed.
[global]
disable = ["MD013", "MD033", "MD041"]
exclude = [
  ".github/**", # generated by velnor-actions, never hand-edited
  "**/node_modules/**",
  "**/target/**",
  "**/AGENTS.md", # agent instruction files, not product documentation
  "**/CLAUDE.md",
]
