[global]
disable = ["MD013", "MD033", "MD041"]
exclude = [
  ".github/**", # generated by velnor-actions, never hand-edited
  "**/node_modules/**",
  "**/target/**",
  "**/AGENTS.md", # agent instruction files, not product documentation
  "**/CLAUDE.md",
]

[per-file-ignores]
"docs/openshell-v2/SPEC.md" = ["MD025", "MD052"]
