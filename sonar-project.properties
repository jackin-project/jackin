# SHA-1 in the git pack parser/verifier is mandated by the git pack wire format:
# the digest is compared only against the trailer that `git bundle create` already
# wrote, and switching to SHA-256 would make every sha1-format export fail with
# BundleRefusal::Trailer. SHA-256 object format is already supported via
# ObjectFormat::Sha256 (crates/jackin-session/src/export/bundle.rs:111-143,
# :547-551; :159-169).
sonar.exclusions=vendor/**,rewrite/drafts/**
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=**/crates/jackin-session/src/export/bundle.rs
sonar.issue.ignore.multicriteria.e2.ruleKey=rust:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=**/crates/jackin-session/examples/export_memory.rs
