# Canonical Rust channel and required components for rustup and editors.
# Keep its channel aligned with the Rust option in mise.toml and `rust-version`
# in Cargo.toml; mise needs the repeated version to enable native mbx wrapping.

[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
