# Authentic third-party verification vectors retain their upstream licensing.
# Source revisions and the corresponding unmodified licenses are recorded beside them.
[[annotations]]
path = [
  "crates/adapters/jackin-image/src/release_evidence/fixtures/cosign-*",
  "crates/adapters/jackin-image/src/release_evidence/fixtures/sigstore-python-*",
  "crates/adapters/jackin-image/src/release_evidence/fixtures/sigstore-rust-*",
  "crates/adapters/jackin-image/src/release_evidence/fixtures/velnor-0.1.13-*",
  "crates/adapters/jackin-image/src/release_evidence/fixtures/velnor-LICENSE-APACHE",
]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "Apache-2.0"
