[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "Prefer rustls/aws-lc-rs-backed TLS in this workspace." },
    { crate = "openssl-sys", reason = "Prefer rustls/aws-lc-rs-backed TLS in this workspace." },
    { crate = "bollard", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "bollard-stubs", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "bollard-buildkit-proto", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "docker-api", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "docker-api-stubs", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "shiplift", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "dockworker", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "rs-docker", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "docker-sdk", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "bollard-next", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "docker-wrapper", reason = "Docker runs only through docker buildx in jackin-image; no Docker client crate (D01)." },
    { crate = "podman-api", reason = "Jackin never runs Podman, and Docker runs only through docker buildx in jackin-image; no container client crate (D01)." },
]
skip = [
    { crate = "block-buffer@0.10.4", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "crypto-common@0.1.6", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "digest@0.10.7", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "generic-array@0.14.9", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "hashbrown@0.15.5", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "nix@0.29.0", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "num-bigint@0.4.8", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "pem@3.0.6", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "sha1@0.10.7", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "sha2@0.10.9", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "signature@2.2.0", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "synstructure@0.13.2", reason = "russh and the OpenShell SDK pull different RustCrypto generations; keep the older survivor visible for future drift." },
    { crate = "base64@0.22.1", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "cpufeatures@0.2.17", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "getrandom@0.2.17", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "getrandom@0.3.4", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "r-efi@5.3.0", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "rand@0.8.8", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "rand@0.9.5", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "rand_chacha@0.3.1", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "rand_core@0.6.4", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "rand_core@0.9.5", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "syn@2.0.119", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "thiserror@1.0.69", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "thiserror-impl@1.0.69", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "nix@0.28.0", reason = "portable-pty 0.9.0, the PTY driver of xtask e2e, is the latest stable release and pins nix 0.28; keep the older survivor visible for future drift." },
    { crate = "bitflags@1.3.2", reason = "portable-pty 0.9.0 (xtask e2e) still depends on bitflags 1; keep the older survivor visible for future drift." },
    { crate = "cfg_aliases@0.1.1", reason = "nix 0.28.0 under portable-pty 0.9.0 (xtask e2e) builds with cfg_aliases 0.1; keep the older survivor visible for future drift." },
    { crate = "foldhash@0.1.5", reason = "jsonschema 0.60.2 (xtask e2e) pulls hashbrown 0.17.1 on foldhash 0.2.0 while the OpenShell build tree keeps hashbrown 0.15.5 on foldhash 0.1.5; keep the older survivor visible for future drift." },
    { crate = "compact_str@0.9.1", reason = "ratatui-core and termpane pin different compact_str generations; keep the older survivor visible for future drift." },
    { crate = "unicode-width@0.1.14", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
    { crate = "untrusted@0.7.1", reason = "Transitive duplicate from the OpenShell SDK and russh dependency trees; keep the older survivor visible for future drift." },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/NVIDIA/OpenShell",
    "https://github.com/tailrocks/terminal-components-baseline",
    "https://github.com/tailrocks/termpane",
]
