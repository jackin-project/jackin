ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "Prefer rustls/aws-lc-rs-backed TLS in this workspace." },
    { crate = "yaml-rust", reason = "Use serde-saphyr for YAML parsing." },
    { crate = "uniffi", reason = "Native FFI bindings are boltffi-only (jackin-usage-ffi); UniFFI was removed and must not return." },
]
skip = [
    { crate = "allocator-api2@0.2.21", reason = "Existing duplicate-version debt; keep highest current version visible for future drift." },
    { crate = "base64@0.22.1", reason = "termrock head pulls base64 0.23.1; older transitive survivor kept visible for future drift." },
