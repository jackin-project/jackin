version = "v1alpha11"
workdir = "/workspace/prod"

[[mounts]]
src = "/home/operator/projects/prod"
dst = "/workspace/prod"

[env]
CLAUDE_CODE_OAUTH_TOKEN = { op = "op://v/i/f", account = "ACCT123", breadcrumb = { version = 1, value = "Vault/Item/Field" } }
PLAIN_ENV = "literal-value"

[roles."org/agent".env]
ROLE_TOKEN = { op = "op://rv/ri/rf", account = "ACCT123", breadcrumb = { version = 1, value = "RVault/RItem/RField" } }
