[package]
name = "p06-proof"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "p06-proof"
path = "src/main.rs"

[[bin]]
name = "p06-panes"
path = "src/panes/main.rs"

[dependencies]
anyhow = "1"
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6" }
russh = "0.65.0"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
vt100 = "0.18.1"
