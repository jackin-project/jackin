[workspace]
members = [
  "crates/jackin",
  "crates/jackin-core",
  "crates/jackin-image",
  "crates/jackin-openshell",
  "crates/jackin-session",
  "crates/jackin-testkit",
  "crates/jackin-tui",
  "crates/usage/jackin-usage",
  "crates/usage/jackin-usage-provider-claude",
  "crates/usage/jackin-usage-provider-codex",
  "crates/usage/jackin-usage-provider-core",
  "crates/usage/jackin-usage-provider-cursor",
  "crates/usage/jackin-usage-provider-gemini",
  "crates/usage/jackin-usage-provider-kimi",
  "crates/usage/jackin-usage-provider-minimax",
  "crates/usage/jackin-usage-provider-opencode",
  "crates/usage/jackin-usage-provider-openrouter",
  "crates/usage/jackin-usage-provider-zai",
  "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/jackin-project/jackin"
publish = false

[workspace.dependencies]
jackin-core = { path = "crates/jackin-core", version = "0.1.0" }
jackin-image = { path = "crates/jackin-image", version = "0.1.0" }
jackin-openshell = { path = "crates/jackin-openshell", version = "0.1.0" }
jackin-session = { path = "crates/jackin-session", version = "0.1.0" }
jackin-testkit = { path = "crates/jackin-testkit", version = "0.1.0" }
jackin-tui = { path = "crates/jackin-tui", version = "0.1.0" }
jackin-usage = { path = "crates/usage/jackin-usage", version = "0.1.0" }
jackin-usage-provider-claude = { path = "crates/usage/jackin-usage-provider-claude", version = "0.1.0" }
jackin-usage-provider-codex = { path = "crates/usage/jackin-usage-provider-codex", version = "0.1.0" }
jackin-usage-provider-core = { path = "crates/usage/jackin-usage-provider-core", version = "0.1.0" }
jackin-usage-provider-cursor = { path = "crates/usage/jackin-usage-provider-cursor", version = "0.1.0" }
jackin-usage-provider-gemini = { path = "crates/usage/jackin-usage-provider-gemini", version = "0.1.0" }
jackin-usage-provider-kimi = { path = "crates/usage/jackin-usage-provider-kimi", version = "0.1.0" }
jackin-usage-provider-minimax = { path = "crates/usage/jackin-usage-provider-minimax", version = "0.1.0" }
jackin-usage-provider-opencode = { path = "crates/usage/jackin-usage-provider-opencode", version = "0.1.0" }
jackin-usage-provider-openrouter = { path = "crates/usage/jackin-usage-provider-openrouter", version = "0.1.0" }
jackin-usage-provider-zai = { path = "crates/usage/jackin-usage-provider-zai", version = "0.1.0" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
futures = "0.3.34"
getrandom = "0.4.3"
globset = { version = "0.4.21", default-features = false }
noyalib = { version = "0.0.53", default-features = false, features = ["std", "lossless-u64"] }
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6", version = "0.0.0" }
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6", version = "0.0.0" }
openshell-providers = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6", version = "0.0.0" }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.6", version = "0.0.0" }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots-no-provider"] }
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs", "flate2"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
static_assertions = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tonic = { version = "0.14.9", features = ["tls-aws-lc"] }
tonic-types = "0.14.9"
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
missing_docs = "allow"

unsafe_code = "forbid"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
async_fn_in_trait = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"
unescaped_backticks = "allow"
invalid_html_tags = "allow"
bare_urls = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mod_module_files = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_assert = "deny"
assert_is_empty = "allow"
manual_let_else = "warn"
match_bool = "warn"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "warn"
large_enum_variant = "warn"
large_futures = "allow"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
str_to_string = "warn"
return_self_not_must_use = "warn"
redundant_feature_names = "allow"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
implicit_hasher = "allow"
similar_names = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
format_push_string = "allow"
no_effect_underscore_binding = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
unused_self = "warn"
option_option = "allow"
verbose_bit_mask = "allow"
unreadable_literal = "allow"
unnecessary_debug_formatting = "allow"
unused_async = "warn"
float_cmp = "deny"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "deny"
cast_precision_loss = "allow"
float_cmp_const = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
expl_impl_clone_on_copy = "deny"
iter_not_returning_iterator = "deny"
infallible_try_from = "deny"
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = "symbols"

[profile.preview]
inherits = "release"
lto = "off"
