[workspace.lints.rust]
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_attr_outside_unsafe = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
# S5 prescribes deny (not forbid): forbid makes per-site #[expect] unrepresentable (E0453).
unsafe_code = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
single_use_lifetimes = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
async_fn_in_trait = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"
private_intra_doc_links = "allow"
redundant_explicit_links = "allow"
unescaped_backticks = "allow"
invalid_html_tags = "allow"
bare_urls = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Bare-allow floor is 0 (ratchet bare-allow-per-crate); deny allows without reason.
# Prefer #[expect] so suppressions self-retire when the lint stops firing
# (census: docs/content/reference/developer-reference/lint-policy.mdx).
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
assertions_on_result_states = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mod_module_files = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
disallowed_methods = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_assert = "deny"
manual_let_else = "warn"
match_bool = "warn"
# allow census: docs/content/reference/developer-reference/lint-policy.mdx
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "warn"
large_enum_variant = "warn"
large_futures = "allow"
result_large_err = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
str_to_string = "warn"
return_self_not_must_use = "warn"
redundant_feature_names = "allow"
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
implicit_hasher = "allow"
similar_names = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
drop_non_drop = "allow"
format_push_string = "allow"
no_effect_underscore_binding = "allow"
items_after_statements = "allow"
unnecessary_wraps = "allow"
# promoted 2026-07-12 after residual fix (0 hits).
unused_self = "warn"
option_option = "allow"
verbose_bit_mask = "allow"
unreadable_literal = "allow"
unnecessary_debug_formatting = "allow"
# promoted 2026-07-12 after residual fix (0 hits).
unused_async = "warn"
float_cmp = "deny"
struct_field_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "deny"
cast_precision_loss = "allow"
float_cmp_const = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"
expl_impl_clone_on_copy = "deny"
iter_not_returning_iterator = "deny"
infallible_try_from = "deny"
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[profile.dev]
# Line tables only: ~30-50% smaller artifacts, faster link, stack traces still work.
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"

# Symbol-rich capsule build for triage. Select with:
#   cargo run --bin build-jackin-capsule -- --profile debug
# Produces a ~10x larger binary; backtraces resolve to function + file:line.
# Use RUST_BACKTRACE=full when launching to get the richest trace.
[profile.capsule-debug]
inherits = "release"
strip = false
debug = "line-tables-only"

# Desktop static library release lane: symbol-rich for archived triage
# artifacts. Selected by `cargo xtask desktop` (XCFramework, bindings, app
# build); release CI archives the unstripped Rust static library and the app
# dSYM beside the published bytes. The CLI/capsule release profile is
# deliberately not weakened.
[profile.desktop-release]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = false
debug = "line-tables-only"

[workspace.metadata.dylint]
libraries = [
    { path = "crates/tools/jackin-lints" },
]

# arrayref 0.3.10 on crates.io is a malicious publish (pulls the proc-macro1
