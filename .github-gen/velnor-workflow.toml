schema = 2

[generator]
repository = "jackin-project/jackin"
# D19 pin: immutable Velnor source for this generated tree. The matching
# published runtime is velnor-workflow-runtime-v1-6e504285922e7046
# (closure 6e504285922e7046ad6709cc537883a09314e6fbd4d007108c89fbe63262a9a4,
# built from 80bc420dae37ae459e2545af2362d0220fa70bb9; release
# 2026-09-21T20:27:10Z with Sigstore attestations over binary + manifest,
# verified manifest filter, digest, and binary --closure/--revision
# self-report before pinning).
revision = "80bc420dae37ae459e2545af2362d0220fa70bb9"

[scan]
# native/Package.swift scans: the xcframework-first ordering the exclusion
# used to protect now comes from the FFI product + prerequisite edge below,
# so the unit is scan-derived (plain swift commands + prepended prepare)
# instead of hand-declared. .swiftpm/ stays excluded: the filesystem scan
# would otherwise read untracked SwiftPM workspace state as evidence.
exclude = ["native/.swiftpm/**"]

# Public repo: GitHub-hosted singleton (no velnor lanes). Automatic events
# stay GitHub-only so ci-required is not blocked by queued self-hosted jobs
# when the Velnor fleet is unavailable.
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-26.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# [renovate] ON HOLD for wave pin 3 (W4 precedent): s2 `validate_renovate`
# requires the velnor provider + [workflow.selectors.velnor], but
# `enforce_visibility_policy` requires public repos to be exactly
# [github-hosted] and rejects a velnor selector — so [renovate] is
# unsatisfiable on public repos at this pin. The renderer itself is
# provider-agnostic (`control_plane_runner`), so the fix is validation-only
# (G12, generator side). Uncomment below + the two [[declare]] rows at pin 3
# to restore renovate.yml/renovate-validate.yml; until then both files are
