schema = 2

[generator]
repository = "jackin-project/jackin"
revision = "4dec6b9ec28b0d51cb370fd8f5d5401c6186adf0"

[scan]
exclude = ["native/Package.swift", "native/.swiftpm/**"]

# Public repo: GitHub-hosted singleton (no velnor lanes). Automatic events
# stay GitHub-only so ci-required is not blocked by queued self-hosted jobs
# when the Velnor fleet is unavailable.
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-26.04"]

[policy]
ruleset_required_status_checks = ["ci-required", "Policy"]
ruleset_external_status_checks = ["DCO"]

# [renovate] ON HOLD for wave pin 3 (W4 precedent): s2 `validate_renovate`
# requires the velnor provider + [workflow.selectors.velnor], but
# `enforce_visibility_policy` requires public repos to be exactly
# [github-hosted] and rejects a velnor selector — so [renovate] is
# unsatisfiable on public repos at this pin. The renderer itself is
# provider-agnostic (`control_plane_runner`), so the fix is validation-only
