schema = 2

[generator]
repository = "jackin-project/jackin"
# D19 pin: M1 PENDING — DO NOT LAND BEFORE THE M1 REGEN. The generic-Apple
# generator (velnor origin/main c832191f) is red (E0277 in
# velnor-workflow/src/s2/scan/rust.rs, no published runtime products for
# that rev), so the tree below is knowingly unregenerated and the pin stays
# at the pre-migration renderer until the parent announces M1 (fixed main
# SHA with published products), then pin M1 + regen + push.
# Pre-migration published runtime: velnor-workflow-runtime-v1-d873f22487444039
# (closure d873f22487444039f4038a51e1433b284621909c4c39f841cdda7935141b2ff4).
revision = "44243ed4917d53ad74a96c64d1c58dbe52c944c1"

# No [scan] exclude: native/Package.swift is scanned. The pre-migration
# exclusion plus the synthetic swift-package-native unit are gone; generic
# discovery owns the SwiftPM consumer (binaryTarget join), the XcodeGen app,
# and the BoltFFI producer with its product edge.

# Runner placement: the visibility-based runner policy resolves exactly one
# provider from .github-gen/visibility.toml. This repository is public, so
# every executable job runs on GitHub-hosted runners only; a Velnor
# selector or universe here would be a contradictory rejection. The
# pre-migration schema-1 rationale (automatic events stay GitHub-only so
# ci-required is not blocked by queued self-hosted jobs when the Velnor
# fleet is unavailable) is now structural: the singleton admits no second
# provider, and there is no dispatch-side provider default to declare.
# Apple-platform units land on the hosted macOS image by platform, Linux
# units on the selector below; check profiles and release jobs name the
# macos/github lanes explicitly per row.
[workflow]
providers = ["github-hosted"]
automatic_providers = ["github-hosted"]
default_branch = "main"

[workflow.selectors.github-hosted]
runs_on = ["ubuntu-26.04"]

[policy]
ruleset_required_status_checks = ["ci-required"]
ruleset_external_status_checks = ["DCO"]

# Self-hosted Renovate: schedule + writer identity from the #994 copy
# (renovate.yml: cron "0 6 * * *", secrets.RENOVATE_TOKEN, RENOVATE_GIT_AUTHOR).
# Runner placement needs no declaration: the visibility singleton routes the
# writer to GitHub-hosted. (Pre-migration schema-1 carried lanes = "github"
# because velnor/both lanes required a trusted label no fact supplied.)
# The copy sets RENOVATE_ALLOWED_UNSAFE_EXECUTIONS=mise (intended: let
# `mise lock` refresh mise.lock in Renovate PRs), but renovate.json
# configures no post-upgrade execution, so the knob has no live effect and
# nothing is lost by omitting it. If post-upgrade execution is ever
# configured, [renovate] allowed_commands renders RENOVATE_ALLOWED_COMMANDS.
[renovate]
enabled = true
reason = "Self-hosted Renovate writer for mise/cargo/docker/tool pins; validator gates renovate.json changes."
schedule = "0 6 * * *"
token = "RENOVATE_TOKEN"
config = "renovate.json"
validate = true
author = "Renovate Bot <renovate@whitesourcesoftware.com>"
signoff = true

[[declare]]
primitive = "renovate"
file = "renovate.yml"

[[declare]]
primitive = "renovate-validate"
file = "renovate-validate.yml"

# Desktop cadence (L5): the two heavier tiers from desktop-cadence.yml.
# Merge tier runs the PR graph + UI tests (task desktop-merge, mise.toml);
# scheduled tier runs the merge graph + dead-code scan (task desktop-scheduled).
# Toolchain env (DEVELOPER_DIR, MACOSX_DEPLOYMENT_TARGET) is job-level in the
# copy, so it travels as profile env; every tool id equals a mise.lock key.
[[check_profile]]
id = "desktop-merge"
name = "Desktop merge cadence"
runner = "macos"
tools = ["cargo-binstall", "rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:sccache", "cargo:boltffi_cli", "xcodegen", "swiftlint", "xcbeautify", "ripgrep"]
tasks = ["desktop-merge"]
timeout_minutes = 90
status = "required"
[check_profile.env]
CARGO_TERM_COLOR = "always"
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
# S1: `mise run` auto-installs every missing toolset entry before the task
# (26 tools, 576s on run 35542103447 despite a mise-cache HIT on the 9
# install_args tools). The desktop graph only invokes the 9 installed tools
# plus system/Xcode binaries (audit: plans/cicd-reliability/s1-result.md),
# so skip the upfront install and fail fast on any shim miss instead of
# slow-installing it back.
MISE_TASK_RUN_AUTO_INSTALL = "false"
MISE_NOT_FOUND_AUTO_INSTALL = "false"

[[check_profile]]
id = "desktop-scheduled"
name = "Desktop scheduled cadence"
schedule = "41 4 * * 1"
runner = "macos"
tools = ["cargo-binstall", "rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:sccache", "cargo:boltffi_cli", "xcodegen", "swiftlint", "xcbeautify", "periphery", "ripgrep"]
tasks = ["desktop-scheduled"]
timeout_minutes = 90
status = "required"
[check_profile.env]
CARGO_TERM_COLOR = "always"
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
# S1: same as desktop-merge — skip the whole-toolset auto-install
# (scheduled tier additionally needs periphery for desktop-deadcode, already
# in this profile's tool list). Audit: plans/cicd-reliability/s1-result.md.
MISE_TASK_RUN_AUTO_INSTALL = "false"
MISE_NOT_FOUND_AUTO_INSTALL = "false"

# One file, one trigger set, faithful to the copy: the merge tier runs on
# push-to-main + dispatch (copy desktop-cadence.yml push: branches: [main],
# merge job gated on event != schedule); the scheduled tier keeps the
# copy's Monday cron.
[[declare]]
primitive = "scheduled-checks"
file = "desktop-merge.yml"
[declare.args]
profiles = ["desktop-merge"]
name = "Desktop merge cadence"
events = ["push"]
branches = ["main"]

[[declare]]
primitive = "scheduled-checks"
file = "desktop-scheduled.yml"
[declare.args]
profiles = ["desktop-scheduled"]
name = "Desktop scheduled cadence"

# Renovate upstream liveness (D2): the #994 renovate-validate.yml job that
# verifies the pinned mise release still ships both construct architectures.
# Product-owned (versions.env path + mise URLs) as task
# renovate-upstream-sources; the generic primitive supplies triggers,
# concurrency, and the runner. Complements the generic schema validator
# (renovate-validate.yml), which passes --strict on this repo. The copy
# scoped pull_request to branches [main]; the primitive renders a bare
# pull_request (a superset that only runs the HEAD probe more often).
[[check_profile]]
id = "renovate-upstream-sources"
name = "Renovate upstream sources"
runner = "github"
tasks = ["renovate-upstream-sources"]
timeout_minutes = 10
status = "required"
[check_profile.env]
# The probe needs only sh + curl: skip mise's whole-toolset install
# (30 tools, ~9 cold minutes) before running the task.
MISE_TASK_RUN_AUTO_INSTALL = "false"

[[declare]]
primitive = "scheduled-checks"
file = "renovate-upstream-sources.yml"
[declare.args]
profiles = ["renovate-upstream-sources"]
name = "Renovate upstream sources"
events = ["push", "pull_request"]
branches = ["main"]

# Apple lane placement (generic-Apple migration): PRs run the discovered
# Apple units only (SwiftPM consumer + XcodeGen app + BoltFFI producer).
# The desktop-ci graph (bindings-check, generate, format-check, lint, test,
# build, test-swift, verify) stays the merge-lane entry via desktop-merge —
# no new PR lane is added and nothing is silently dropped. The obligations
# the generic recipe does not own (desktop-release cargo profile,
# MACOSX_DEPLOYMENT_TARGET export, the 5 swift-run harnesses, counted
# release test-swift, desktop-build Release stamping + native/dist copy,
# desktop-verify + dSYM UUID match, the per-test UI gate with count proof,
# swift-format/swiftlint/periphery) stay owned by these task-backed lanes.
# Profile/env shaping (desktop-release, MACOSX_DEPLOYMENT_TARGET) is
# reported as follow-up generic increments, not fixed here.

# Unit contracts the scan cannot derive. Typed capabilities only
# (`ci_tasks`, `mise_tools`); command arrays are rejected.
# Construct Dockerfile ARG defaults match versions.env so the scan-derived
# `docker build` is self-contained.
[[units]]
id = "rust-jackin-xtask"
mise_tools = ["github:open-telemetry/weaver"]

# (Pre-migration synthetic swift-package-native unit removed: generic
# discovery derives the consumer, its watch set, the xcframework platform
# need, and the FFI producer edge from native/Package.swift +
# crates/jackin-usage-ffi/boltffi.toml. Its ci_tasks glue
# (swift-package-native-ci) is deleted from mise.toml with it.)

# jackin-lints pins nightly via crates/jackin-lints/rust-toolchain.
# dylint-link must be on PATH (rust + cargo-binstall).
[[units]]
id = "rust-jackin-lints"
mise_tools = ["rust", "cargo-binstall"]

# Q4 obligation, second Swift unit (scanned): AppKit prototype, genuinely
# Apple-bound, but scan evidence cannot prove it. Row-over-scan merge keeps
# the scanned base and overrides the platform requirement only.
[[units]]
id = "swift-package-native-design-prototypes-unifiedagentusage"
platform = "macos-arm64"

# Desktop release (L10): tag-triggered tasks release over the canonical
# desktop mise tasks. Each event runs exactly one self-contained job
# (jobs share no filesystem): dispatch drills build/verify/release-state
# with a fixed fixture and no secrets; tag pushes run the full pipeline
# plus sign/notarize/attest. Versions derive in-job via
# desktop-release-env (tag/manifest/fixture); secrets map by reference
# and toolchain pins are explicit per job.
[release]
enabled = true
reason = "Tag-triggered desktop release: drill-only build job plus self-contained publish job (build/verify/sign/attest)."
kind = "tasks"
modes = ["validate"]
tag_pattern = "v[0-9]*"

[[release.job]]
id = "build"
tasks = ["desktop-release-env", "desktop-build", "desktop-verify", "desktop-release-state"]
runner = "macos"
modes = ["validate"]
timeout_minutes = 90

[release.job.env]
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"

[[release.job]]
id = "sign"
name = "Sign release"
tasks = ["desktop-release-env", "desktop-build", "desktop-verify", "desktop-release-state", "desktop-sign-notarize"]
runner = "macos"
modes = ["publish"]
timeout_minutes = 90
environment = "release-macos"
attest_subjects = ["native/dist/jackin-desktop-*-aarch64-apple-darwin.zip"]

[release.job.permissions]
contents = "read"
id-token = "write"
attestations = "write"

[release.job.env]
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
DEVELOPER_ID_APPLICATION_P12_BASE64 = "${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}"
DEVELOPER_ID_APPLICATION_P12_PASSWORD = "${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}"
APP_STORE_CONNECT_API_KEY_P8 = "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}"
APP_STORE_CONNECT_KEY_ID = "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
APP_STORE_CONNECT_ISSUER_ID = "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
EXPECTED_CERT_SHA256 = "${{ vars.JACKIN_DEVELOPER_ID_CERT_SHA256 }}"
EXPECTED_TEAM_ID = "${{ vars.JACKIN_DEVELOPER_ID_TEAM_ID }}"

[[declare]]
primitive = "release"
file = "release.yml"
