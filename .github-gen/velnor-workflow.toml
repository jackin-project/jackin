schema = 1

[generator]
repository = "jackin-project/jackin"

# Vendored generator inputs are never scan evidence: the download-ci-xtask
# runtime ships package.json manifests that must not select a Node unit.
[scan]
exclude = [
  ".github-gen/sources/**",
  "docker/construct/Dockerfile",
  "crates/jackin-lints/Cargo.toml",
  "native/Package.swift",
]

# Runner placement: GitHub-hosted is the default for automatic CI and manual
# dispatch. Velnor remains opt-in via workflow_dispatch runner=velnor, and
# cross-runner verification uses runner=both. The Velnor lane stays main-gated
# on automatic events so PRs never depend on fleet availability.
[workflow]
runners = "both"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-26.04"
macos_runner = "macos-26"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
files = [
  "ci-main.yml",
  "ci-policy.yml",
  "ci-pr.yml",
  "ci-unit-bun.yml",
  "ci-unit-docker.yml",
  "ci-unit-rust-2.yml",
  "ci-unit-rust.yml",
  "ci-unit-swift.yml",
  "maintenance.yml",
  "nightly.yml",
]


# Interim: adopted release-side workflows predate policy conformance (#965).
[policy]
exclude_workflows = [
  "cache-cleanup.yml",
  "construct.yml",
  "docs.yml",
  "hygiene.yml",
  "jackin-dev.yml",
  "preview.yml",
  "release.yml",
  "renovate.yml",
  "renovate-validate.yml",
  "reuse-compliance.yml",
]

# Unit contracts the scan cannot derive: the construct image build reads its
# tool versions from the checked-in versions file (main sources it the same
# way), and the xtask test suite shells out to the Weaver registry resolver
# at runtime, so its jobs install the pinned tool beside nextest.
[[units]]
id = "docker-docker-construct"
kind = "docker"
root = "docker/construct"
watch = ["docker/construct/**"]
ci_tasks = ["construct-ci-dockerfile"]

[[units]]
id = "rust-jackin-xtask"
mise_tools = ["github:open-telemetry/weaver"]

# The Swift package links a local XCFramework the Rust FFI build produces;
# generate it first (the same sanctioned task the desktop flows use) so
# `swift build` resolves its binary target.
[[units]]
id = "swift-package-native"
kind = "swift"
root = "native"
watch = ["native/**"]
ci_tasks = ["native-swift-ci"]
mise_tools = ["cargo-binstall", "rust", "cargo:sccache", "cargo:boltffi_cli"]

# jackin-lints pins a nightly toolchain with rustc-dev in crates/jackin-lints/rust-toolchain.
# mise-action exports RUSTUP_TOOLCHAIN for the repo default (1.97.1), so the unit runs
# through a mise task that unsets it and lets the crate toolchain file select nightly.
[[units]]
id = "rust-jackin-lints"
kind = "rust"
root = "crates/jackin-lints"
watch = ["crates/jackin-lints/**"]
ci_tasks = ["jackin-lints-ci"]
mise_tools = ["rust", "cargo-binstall"]

# Bespoke workflows the generator does not render yet: repository-owned
# sources under .github-gen/sources/workflows, copied verbatim each generation.

[[static_files]]
file = ".github/workflows/cache-cleanup.yml"
source = ".github-gen/sources/workflows/cache-cleanup.yml"

[[static_files]]
file = ".github/workflows/construct.yml"
source = ".github-gen/sources/workflows/construct.yml"

[[static_files]]
