schema = 1

[generator]
repository = "jackin-project/jackin"
# D19 pin: immutable Velnor source for this generated tree. The matching
# published runtime is velnor-workflow-runtime-v1-f1e4338feb077e70
# (closure f1e4338feb077e700b0c9b3c881967a2273e6ff199c4292386385ee7a6d9764b).
revision = "01bc16b2ad074eb3980d7b12a7b441192a7c3bc0"

[scan]
exclude = ["native/Package.swift", "native/.swiftpm/**"]

# Runner placement: keep both backends for manual dispatch; automatic events
# (main push/schedule, same-repo PR) must stay GitHub-only so ci-required is
# not blocked by queued self-hosted jobs when the Velnor fleet is unavailable.
[workflow]
runners = "github"
automatic = "github"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-26.04"
macos_runner = "macos-26"
velnor_labels = ["self-hosted", "velnor-target-mvp"]

[policy]
ruleset_required_status_checks = ["ci-required"]
ruleset_external_status_checks = ["DCO"]

# Self-hosted Renovate: schedule + writer identity from the #994 copy
# (renovate.yml: cron "0 6 * * *", secrets.RENOVATE_TOKEN, RENOVATE_GIT_AUTHOR).
# lanes = "github": the copy defaulted to velnor, but velnor/both lanes
# require [workflow] velnor_trusted_label, and no trusted-label fact exists in
# this repo. Revisit for velnor/both once the fleet label is known.
# The copy sets RENOVATE_ALLOWED_UNSAFE_EXECUTIONS=mise (intended: let
# `mise lock` refresh mise.lock in Renovate PRs), but renovate.json
# configures no post-upgrade execution, so the knob has no live effect and
# nothing is lost by omitting it. If post-upgrade execution is ever
# configured, [renovate] allowed_commands renders RENOVATE_ALLOWED_COMMANDS.
[renovate]
enabled = true
reason = "Self-hosted Renovate writer for mise/cargo/docker/tool pins; validator gates renovate.json changes."
schedule = "0 6 * * *"
token = "RENOVATE_TOKEN"
config = "renovate.json"
validate = true
lanes = "github"
author = "Renovate Bot <renovate@whitesourcesoftware.com>"
signoff = true

[[declare]]
primitive = "renovate"
file = "renovate.yml"

[[declare]]
primitive = "renovate-validate"
file = "renovate-validate.yml"

# Desktop cadence (L5): the two heavier tiers from desktop-cadence.yml.
# Merge tier runs the PR graph + UI tests (task desktop-merge, mise.toml);
# scheduled tier runs the merge graph + dead-code scan (task desktop-scheduled).
# Toolchain env (DEVELOPER_DIR, MACOSX_DEPLOYMENT_TARGET) is job-level in the
# copy, so it travels as profile env; every tool id equals a mise.lock key.
[[check_profile]]
id = "desktop-merge"
name = "Desktop merge cadence"
runner = "macos"
tools = ["cargo-binstall", "rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:sccache", "cargo:boltffi_cli", "xcodegen", "swiftlint", "xcbeautify", "ripgrep"]
tasks = ["desktop-merge"]
timeout_minutes = 90
status = "required"
[check_profile.env]
CARGO_TERM_COLOR = "always"
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
# S1: `mise run` auto-installs every missing toolset entry before the task
# (26 tools, 576s on run 35542103447 despite a mise-cache HIT on the 9
# install_args tools). The desktop graph only invokes the 9 installed tools
# plus system/Xcode binaries (audit: plans/cicd-reliability/s1-result.md),
# so skip the upfront install and fail fast on any shim miss instead of
# slow-installing it back.
MISE_TASK_RUN_AUTO_INSTALL = "false"
MISE_NOT_FOUND_AUTO_INSTALL = "false"

[[check_profile]]
id = "desktop-scheduled"
name = "Desktop scheduled cadence"
schedule = "41 4 * * 1"
runner = "macos"
tools = ["cargo-binstall", "rust", "aqua:nextest-rs/nextest/cargo-nextest", "cargo:sccache", "cargo:boltffi_cli", "xcodegen", "swiftlint", "xcbeautify", "periphery", "ripgrep"]
tasks = ["desktop-scheduled"]
timeout_minutes = 90
status = "required"
[check_profile.env]
CARGO_TERM_COLOR = "always"
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
# S1: same as desktop-merge — skip the whole-toolset auto-install
# (scheduled tier additionally needs periphery for desktop-deadcode, already
# in this profile's tool list). Audit: plans/cicd-reliability/s1-result.md.
MISE_TASK_RUN_AUTO_INSTALL = "false"
MISE_NOT_FOUND_AUTO_INSTALL = "false"

# One file, one trigger set, faithful to the copy: the merge tier runs on
# push-to-main + dispatch (copy desktop-cadence.yml push: branches: [main],
# merge job gated on event != schedule); the scheduled tier keeps the
# copy's Monday cron.
[[declare]]
primitive = "scheduled-checks"
file = "desktop-merge.yml"
[declare.args]
profiles = ["desktop-merge"]
name = "Desktop merge cadence"
events = ["push"]
branches = ["main"]

[[declare]]
primitive = "scheduled-checks"
file = "desktop-scheduled.yml"
[declare.args]
profiles = ["desktop-scheduled"]
name = "Desktop scheduled cadence"

# Renovate upstream liveness (D2): the #994 renovate-validate.yml job that
# verifies the pinned mise release still ships both construct architectures.
# Product-owned (versions.env path + mise URLs) as task
# renovate-upstream-sources; the generic primitive supplies triggers,
# concurrency, and the runner. Complements the generic schema validator
# (renovate-validate.yml), which passes --strict on this repo. The copy
# scoped pull_request to branches [main]; the primitive renders a bare
# pull_request (a superset that only runs the HEAD probe more often).
[[check_profile]]
id = "renovate-upstream-sources"
name = "Renovate upstream sources"
runner = "github"
tasks = ["renovate-upstream-sources"]
timeout_minutes = 10
status = "required"
[check_profile.env]
# The probe needs only sh + curl: skip mise's whole-toolset install
# (30 tools, ~9 cold minutes) before running the task.
MISE_TASK_RUN_AUTO_INSTALL = "false"

[[declare]]
primitive = "scheduled-checks"
file = "renovate-upstream-sources.yml"
[declare.args]
profiles = ["renovate-upstream-sources"]
name = "Renovate upstream sources"
events = ["push", "pull_request"]
branches = ["main"]

# Unit contracts the scan cannot derive. Command arrays are rejected by
# velnor-workflow 721c2fed; typed capabilities only (`ci_tasks`, `mise_tools`).
# Construct Dockerfile ARG defaults match versions.env so the scan-derived
# `docker build` is self-contained.
[[units]]
id = "rust-jackin-xtask"
mise_tools = ["github:open-telemetry/weaver"]

# XCFramework must exist before `swift build` resolves the binary target.
# Run desktop-xcframework in the same macOS job as swift-package-native so
# the binary target path is populated on one runner (separate jobs do not
# share target/xcframework).
# capabilities = ["xcframework"]: Q4 obligation — without it this Apple-bound
# unit renders ubuntu + Linux plan-artifact runtime (slice 9 split).
# depends_on (F2): FFI touches select this Swift consumer; selection coupling
# only, no forced serialization (the unit rebuilds the XCFramework in-job).
[[units]]
id = "swift-package-native"
kind = "swift"
root = "native"
watch = ["native/**/*.swift", "native/Package.swift", "native/Package.resolved", "native/.swiftpm/Package.resolved", "crates/jackin-xtask/**"]
ci_tasks = ["swift-package-native-ci"]
mise_tools = ["cargo-binstall", "rust", "cargo:sccache", "cargo:boltffi_cli"]
capabilities = ["xcframework"]
depends_on = ["rust-jackin-usage-ffi"]

# jackin-lints pins nightly via crates/jackin-lints/rust-toolchain.
# dylint-link must be on PATH (rust + cargo-binstall).
[[units]]
id = "rust-jackin-lints"
mise_tools = ["rust", "cargo-binstall"]

# Q4 obligation, second Swift unit (scanned): AppKit prototype, genuinely
# Apple-bound, but scan evidence cannot prove it. Row-over-scan merge keeps
# the scanned base and overrides the platform requirement only.
[[units]]
id = "swift-package-native-design-prototypes-unifiedagentusage"
capabilities = ["xcode"]

# Closed-world read contracts (D3) for the two opaque units the D3 planner
# names mechanically (`select` fallback_reason on the AGENTS.md-only diff:
# bun-jackin-docs runs unprovable package commands, swift-package-native
# executes `mise`). Every entry claims `complete`, uniformly per unit: the
# declared paths plus the scan watch are the unit's entire read set, so
# unmatched paths provably exclude it. Truth basis (verdict-totality: no
# path outside these globs can flip the unit's CI exit code):
# - bun: CI = bun install (postinstall fumadocs-mdx) + bun run build
#   (gen-crate-pages embeds crates/*/README.md, gates meta.json
#   completeness; vite+fumadocs consume docs/; prerender fetches localhost)
#   + bun test (two docs/ test files; fixtures stat
#   crates/jackin-core/src/*). Toolchain is setup-bun latest, no mise.
#   README link-existence only alters generated page bytes that no CI gate
#   observes (check:repo-links is local-only), never the verdict.
# - swift: CI = mise run swift-package-native-ci (mise reads root task defs
#   + tool versions) -> cargo xtask desktop xcframework (compiles xtask,
#   resolves the whole workspace, builds the FFI closure; the one in-closure
#   build script, jackin-diagnostics, is pure) -> swift build/test in native/
#   (Package.swift has no external refs; tests self-scan native/ only).
# Globs are rot-proof supersets on purpose: precise per-file contracts would
# silently rot the first time a fixture or script reads a new file, and a
# false `complete` silently skips verification. No glob matches AGENTS.md.
[[declare]]
primitive = "watch-graph"

[declare.args.reads]
"bun-jackin-docs" = [
  { paths = ["docs/**"], reason = "bun install/build/test run in docs/: vite+fumadocs consume content, src, configs, scripts, public; postinstall runs fumadocs-mdx; bun test discovers docs tests; toolchain is setup-bun latest with no mise", complete = true },
  { paths = ["crates/**"], reason = "gen-crate-pages embeds crates/*/README.md and gates meta.json completeness on the set; bun test fixtures stat crate sources; README link-existence only alters generated bytes no CI gate observes", complete = true },
]
"swift-package-native" = [
  { paths = ["native/**"], reason = "swift build/test run in native/: Package.swift targets, Sources/Tests/Tools/Scripts, generated boltffi bindings, and test self-scans of sources and swiftlint configs all live under native/", complete = true },
  { paths = ["crates/**"], reason = "cargo xtask compiles jackin-xtask and cargo build resolves the whole workspace then compiles the FFI closure (usage-ffi plus usage, config, core, env, protocol, telemetry, diagnostics, process); the in-closure diagnostics build script is pure", complete = true },
  { paths = ["vendor/**", "Cargo.toml", "Cargo.lock", ".cargo/**", "rust-toolchain.toml"], reason = "cargo workspace inputs: root manifests (desktop-release profile), lockfile, cargo config, toolchain pin, vendored path sources", complete = true },
  { paths = ["mise.toml", "mise.lock"], reason = "mise run reads root task defs and resolves tool versions (rust, cargo-binstall, sccache, boltffi_cli) for the task and mise-action", complete = true },
]

# Desktop release (L10): tag-triggered tasks release over the canonical
# desktop mise tasks. Each event runs exactly one self-contained job
# (jobs share no filesystem): dispatch drills build/verify/release-state
# with a fixed fixture and no secrets; tag pushes run the full pipeline
# plus sign/notarize/attest. Versions derive in-job via
# desktop-release-env (tag/manifest/fixture); secrets map by reference
# and toolchain pins are explicit per job.
[release]
enabled = true
reason = "Tag-triggered desktop release: drill-only build job plus self-contained publish job (build/verify/sign/attest)."
kind = "tasks"
modes = ["validate"]
tag_pattern = "v[0-9]*"

[[release.job]]
id = "build"
tasks = ["desktop-release-env", "desktop-build", "desktop-verify", "desktop-release-state"]
runner = "macos"
modes = ["validate"]
timeout_minutes = 90

[release.job.env]
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"

[[release.job]]
id = "sign"
name = "Sign release"
tasks = ["desktop-release-env", "desktop-build", "desktop-verify", "desktop-release-state", "desktop-sign-notarize"]
runner = "macos"
modes = ["publish"]
timeout_minutes = 90
environment = "release-macos"
attest_subjects = ["native/dist/jackin-desktop-*-aarch64-apple-darwin.zip"]

[release.job.permissions]
contents = "read"
id-token = "write"
attestations = "write"

[release.job.env]
DEVELOPER_DIR = "/Applications/Xcode_26.6.app/Contents/Developer"
MACOSX_DEPLOYMENT_TARGET = "26.0"
DEVELOPER_ID_APPLICATION_P12_BASE64 = "${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}"
DEVELOPER_ID_APPLICATION_P12_PASSWORD = "${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}"
APP_STORE_CONNECT_API_KEY_P8 = "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}"
APP_STORE_CONNECT_KEY_ID = "${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
APP_STORE_CONNECT_ISSUER_ID = "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
EXPECTED_CERT_SHA256 = "${{ vars.JACKIN_DEVELOPER_ID_CERT_SHA256 }}"
EXPECTED_TEAM_ID = "${{ vars.JACKIN_DEVELOPER_ID_TEAM_ID }}"

[[declare]]
primitive = "release"
file = "release.yml"
