name: Rust binary preview
"on":
  workflow_run:
    workflows:
      - CI # zizmor: ignore[dangerous-triggers]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      original_run_id:
        description: Original preview production workflow run ID
        required: true
        type: string
      original_run_attempt:
        description: Original preview production workflow run attempt
        required: true
        type: string
permissions: {}
concurrency:
  group: native-preview-${{ github.repository }}-${{ github.event.workflow_run.head_sha || inputs.original_run_id }}
  cancel-in-progress: false
jobs:
  preview-eligibility:
    name: Select authenticated main source for preview
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    permissions:
      actions: read
      contents: read
    outputs:
      commit_count: ${{ steps.source.outputs.commit_count }}
      release_policy: ${{ steps.source.outputs.release_policy }}
      payload_matrix: ${{ steps.source.outputs.payload_matrix }}
      producer_runner: ${{ steps.source.outputs.producer_runner }}
      producer_timeout_minutes: ${{ steps.source.outputs.producer_timeout_minutes }}
      source_admission_sha256: ${{ steps.source.outputs.source_admission_sha256 }}
      source_sha: ${{ steps.source-select.outputs.source_sha }}
      workflow_authority_sha: ${{ steps.source-select.outputs.workflow_authority_sha }}
      ci_run_id: ${{ steps.source-select.outputs.ci_run_id }}
      ci_attempt: ${{ steps.source-select.outputs.ci_attempt }}
      checkout_lfs: ${{ steps.source-select.outputs.checkout_lfs }}
      source_admission_artifact_id: ${{ steps.source-admission-upload.outputs.artifact-id }}
      source_admission_artifact_digest: ${{ steps.source-admission-upload.outputs.artifact-digest }}
    steps:
      - name: Set up Velnor-owned Mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
          install: false
          env: false
          cache: false
          cache_save: false
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.0
      - name: Acquire Velnor
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: 7a990700bd02778bddf09fc84399d3d4937c9ee3497e134f63aad19a12695be9
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.52/velnor-actions-0.1.52-x86_64-unknown-linux-gnu
          VELNOR_RELEASE_COMMIT: 1bd31f8203ecf40d141c331e5195eb422e0904d3
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Execute native release operation
        id: source-select
        shell: bash
        env:
          VELNOR_RELEASE_POLICY: "{\"channel\":\"preview\",\"companions\":[{\"asset_name\":\"capsule-manifest.json\",\"id\":\"capsule-manifest\",\"path\":\"capsule-manifest.json\"}],\"default_branch\":\"main\",\"products\":[{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"format\":\"tar-gz\",\"id\":\"jackin\",\"package\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},{\"bins\":[\"jackin-capsule\"],\"format\":\"tar-gz\",\"id\":\"jackin-capsule\",\"package\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"repository\":\"jackin-project/jackin\",\"schema\":\"velnor.package-release-policy.v1\",\"version\":{\"bindings\":[{\"manifest_path\":\"crates/apps/jackin/Cargo.toml\",\"package\":\"jackin\",\"workspace_manifest_path\":\"Cargo.toml\"},{\"manifest_path\":\"crates/apps/jackin-capsule/Cargo.toml\",\"package\":\"jackin-capsule\",\"workspace_manifest_path\":\"Cargo.toml\"}],\"version_package\":\"jackin\"}}"
          VELNOR_INTERNAL_OP: select-preview-source-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/preview-source-seed-policy.json
          VELNOR_RELEASE_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          VELNOR_RELEASE_ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n(set -C; printf '%s' \"$VELNOR_RELEASE_POLICY\" > \"$VELNOR_REQUEST_FILE\")\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"\n"
      - name: Check out exact source with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source-select.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: ${{ steps.source-select.outputs.checkout_lfs }}
      - name: Execute native release operation
        id: source
        shell: bash
        env:
          VELNOR_RELEASE_POLICY: "{\"channel\":\"preview\",\"companions\":[{\"asset_name\":\"capsule-manifest.json\",\"id\":\"capsule-manifest\",\"path\":\"capsule-manifest.json\"}],\"default_branch\":\"main\",\"products\":[{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"format\":\"tar-gz\",\"id\":\"jackin\",\"package\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},{\"bins\":[\"jackin-capsule\"],\"format\":\"tar-gz\",\"id\":\"jackin-capsule\",\"package\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"repository\":\"jackin-project/jackin\",\"schema\":\"velnor.package-release-policy.v1\",\"version\":{\"bindings\":[{\"manifest_path\":\"crates/apps/jackin/Cargo.toml\",\"package\":\"jackin\",\"workspace_manifest_path\":\"Cargo.toml\"},{\"manifest_path\":\"crates/apps/jackin-capsule/Cargo.toml\",\"package\":\"jackin-capsule\",\"workspace_manifest_path\":\"Cargo.toml\"}],\"version_package\":\"jackin\"}}"
          VELNOR_INTERNAL_OP: finalize-preview-source-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/preview-source-seed-policy.json
          VELNOR_RELEASE_ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          VELNOR_RELEASE_ORIGINAL_RUN_ATTEMPT: ${{ inputs.original_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
          VELNOR_RELEASE_SOURCE_SHA: ${{ steps.source-select.outputs.source_sha }}
          VELNOR_RELEASE_WORKFLOW_AUTHORITY_SHA: ${{ steps.source-select.outputs.workflow_authority_sha }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ steps.source-select.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ steps.source-select.outputs.ci_attempt }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"\n"
      - name: Retain authenticated preview source admission
        id: source-admission-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-preview-source-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/preview-source-admission.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  preview-payload:
    name: Build ${{ matrix.product_id }} / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    defaults:
      run:
        shell: bash
    if: ${{ github.event_name == 'workflow_run' }}
    needs:
      - preview-eligibility
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preview-eligibility.outputs.payload_matrix) }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VELNOR_RELEASE_POLICY: ${{ needs.preview-eligibility.outputs.release_policy }}
    steps:
      - name: Reject unsupported Velnor SDK host
        run: "case \"${RUNNER_OS-}/${RUNNER_ARCH-}\" in Linux/X64|macOS/ARM64|macOS/X64) ;; *) echo 'unsupported native SDK host' >&2; exit 1 ;; esac"
      - name: Set up Velnor-owned Mise for x86_64-unknown-linux-gnu
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      - name: Set up Velnor-owned Mise for aarch64-apple-darwin
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: d40e2fcd96fed7c70b04af282c36534d87d0318bef89c16fa00c9f98e55ade88
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
      - name: Set up Velnor-owned Mise for x86_64-apple-darwin
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: 72e1ced3bac89d0e0aa28b04bd22f8941c111d3b20c74a77bfb6a9486f25f7d3
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.0
      - name: Acquire Velnor
        id: acquire-x86_64-unknown-linux-gnu
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: 7a990700bd02778bddf09fc84399d3d4937c9ee3497e134f63aad19a12695be9
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.52/velnor-actions-0.1.52-x86_64-unknown-linux-gnu
          VELNOR_RELEASE_COMMIT: 1bd31f8203ecf40d141c331e5195eb422e0904d3
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      - name: Acquire Velnor
        id: acquire-aarch64-apple-darwin
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: 27f6d0efa3a988c200f0ca4a79207048ce844661dcafb431237f33d075a97d0c
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.52/velnor-actions-0.1.52-aarch64-apple-darwin
          VELNOR_RELEASE_COMMIT: 1bd31f8203ecf40d141c331e5195eb422e0904d3
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|shasum -a 256 -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|shasum -a 256 -c -;fi&&chmod +x \"$d\"'"
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
      - name: Acquire Velnor
        id: acquire-x86_64-apple-darwin
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: 5e1ec28cb703fc3e76a6de5b27330afb90f8078245df7b38166d615595527ec5
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.52/velnor-actions-0.1.52-x86_64-apple-darwin
          VELNOR_RELEASE_COMMIT: 1bd31f8203ecf40d141c331e5195eb422e0904d3
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|shasum -a 256 -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|shasum -a 256 -c -;fi&&chmod +x \"$d\"'"
        if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
      - name: Execute native release operation
        id: policy-admission
        shell: bash
        env:
          VELNOR_INTERNAL_OP: acquire-preview-source-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/package-release-policy.json
          VELNOR_RELEASE_COMMIT_COUNT: ${{ needs.preview-eligibility.outputs.commit_count }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ needs.preview-eligibility.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ needs.preview-eligibility.outputs.ci_attempt }}
          VELNOR_RELEASE_SOURCE_SHA: ${{ needs.preview-eligibility.outputs.source_sha }}
          VELNOR_RELEASE_WORKFLOW_AUTHORITY_SHA: ${{ needs.preview-eligibility.outputs.workflow_authority_sha }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_ID: ${{ needs.preview-eligibility.outputs.source_admission_artifact_id }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_DIGEST: ${{ needs.preview-eligibility.outputs.source_admission_artifact_digest }}
          VELNOR_RELEASE_SOURCE_ADMISSION_SHA256: ${{ needs.preview-eligibility.outputs.source_admission_sha256 }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
          VELNOR_RELEASE_PRODUCT_ID: ${{ matrix.product_id }}
          VELNOR_RELEASE_TARGET: ${{ matrix.target }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"\n"
      - name: Check out exact source with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preview-eligibility.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          lfs: ${{ needs.preview-eligibility.outputs.checkout_lfs }}
      - name: Execute native release operation
        id: release
        shell: bash
        env:
          VELNOR_INTERNAL_OP: execute-release-producer-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/package-release-plan.json
          VELNOR_RELEASE_COMMIT_COUNT: ${{ needs.preview-eligibility.outputs.commit_count }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ needs.preview-eligibility.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ needs.preview-eligibility.outputs.ci_attempt }}
          VELNOR_RELEASE_SOURCE_SHA: ${{ needs.preview-eligibility.outputs.source_sha }}
          VELNOR_RELEASE_WORKFLOW_AUTHORITY_SHA: ${{ needs.preview-eligibility.outputs.workflow_authority_sha }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_ID: ${{ needs.preview-eligibility.outputs.source_admission_artifact_id }}
          VELNOR_RELEASE_SOURCE_ADMISSION_ARTIFACT_DIGEST: ${{ needs.preview-eligibility.outputs.source_admission_artifact_digest }}
          VELNOR_RELEASE_SOURCE_ADMISSION_SHA256: ${{ needs.preview-eligibility.outputs.source_admission_sha256 }}
          VELNOR_RELEASE_STAGE: payload
          VELNOR_RELEASE_PRODUCT_ID: ${{ matrix.product_id }}
          VELNOR_RELEASE_TARGET: ${{ matrix.target }}
          VELNOR_RELEASE_POLICY_ADMISSION_DIGEST: ${{ steps.policy-admission.outputs.admission_digest }}
        run: "unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; unset VELNOR_RELEASE_STATUS_TOKEN; set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.52\"\n"
      - name: Retain immutable native production evidence
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-release-payload-r${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.product_id }}-${{ matrix.target }}
          path: ${{ runner.temp }}/velnor/release-output
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  preview-assemble:
    name: preview-assemble
    runs-on: ${{ needs.preview-eligibility.outputs.producer_runner }}
    timeout-minutes: ${{ fromJSON(needs.preview-eligibility.outputs.producer_timeout_minutes) }}
    defaults:
      run:
        shell: bash
    if: ${{ github.event_name == 'workflow_run' }}
    needs:
      - preview-eligibility
      - preview-payload
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VELNOR_RELEASE_POLICY: ${{ needs.preview-eligibility.outputs.release_policy }}
    steps:
      - name: Reject unsupported Velnor SDK host
        run: "case \"${RUNNER_OS-}/${RUNNER_ARCH-}\" in Linux/X64|macOS/ARM64|macOS/X64) ;; *) echo 'unsupported native SDK host' >&2; exit 1 ;; esac"
      - name: Set up Velnor-owned Mise for x86_64-unknown-linux-gnu
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
      - name: Set up Velnor-owned Mise for aarch64-apple-darwin
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: d40e2fcd96fed7c70b04af282c36534d87d0318bef89c16fa00c9f98e55ade88
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
      - name: Set up Velnor-owned Mise for x86_64-apple-darwin
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.18
          sha256: 72e1ced3bac89d0e0aa28b04bd22f8941c111d3b20c74a77bfb6a9486f25f7d3
          install: false
          env: false
          cache: false
          cache_save: false
        if: ${{ runner.os == 'macOS' && runner.arch == 'X64' }}
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.0
      - name: Acquire Velnor
        id: acquire-x86_64-unknown-linux-gnu
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
