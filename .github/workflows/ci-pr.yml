  ci-required:
    name: ci-required
    if: ${{ !cancelled() }}
    needs: [plan, github-hosted-bun-jackin-docs, github-hosted-docker-docker-construct, github-hosted-rust-arrayref, github-hosted-rust-jackin, github-hosted-rust-jackin-agent-status, github-hosted-rust-jackin-brand, github-hosted-rust-jackin-build-meta, github-hosted-rust-jackin-capsule, github-hosted-rust-jackin-config, github-hosted-rust-jackin-config-fuzz, github-hosted-rust-jackin-console, github-hosted-rust-jackin-core, github-hosted-rust-jackin-dev, github-hosted-rust-jackin-diagnostics, github-hosted-rust-jackin-docker, github-hosted-rust-jackin-env, github-hosted-rust-jackin-env-fuzz, github-hosted-rust-jackin-host, github-hosted-rust-jackin-image, github-hosted-rust-jackin-instance, github-hosted-rust-jackin-isolation, github-hosted-rust-jackin-launch, github-hosted-rust-jackin-manifest, github-hosted-rust-jackin-manifest-fuzz, github-hosted-rust-jackin-oppicker, github-hosted-rust-jackin-otlp-testbed, github-hosted-rust-jackin-pr-trailers, github-hosted-rust-jackin-process, github-hosted-rust-jackin-protocol, github-hosted-rust-jackin-protocol-fuzz, github-hosted-rust-jackin-runtime, github-hosted-rust-jackin-telemetry, github-hosted-rust-jackin-test-support, github-hosted-rust-jackin-tui, github-hosted-rust-jackin-usage, github-hosted-rust-jackin-usage-ffi, github-hosted-rust-jackin-xtask, github-hosted-rust-policy, github-hosted-swift-package-native, github-hosted-swift-package-native-design-prototypes-unifiedagentusage, github-hosted-swift-xcodegen-native-project-yml-jackindesktop]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime-816046893ef55359ee2f41903d1f1f893d59303e-${{ runner.os }}-${{ runner.arch }}
          path: .velnor-workflow-runtime
      - name: Verify Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 816046893ef55359ee2f41903d1f1f893d59303e
        run: |
          set -euo pipefail
          manifest=.velnor-workflow-runtime/manifest.json
          jq -e --arg revision "$EXPECTED_REVISION" --arg repository "$GITHUB_REPOSITORY" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg run_id "$GITHUB_RUN_ID" '.revision == $revision and .repository == $repository and .platform == $platform and .run_id == $run_id and (.run_id | test("^[0-9]+$")) and .job_id != "" and (.binary_sha256 | test("^[0-9a-f]{64}$")) and (.policy_binary_sha256 | test("^[0-9a-f]{64}$")) and (.closure | test("^[0-9a-f]{64}$")) and (.policy_closure | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          expected="$(jq -er '.binary_sha256' "$manifest")"
          actual="$(sha256sum .velnor-workflow-runtime/velnor-workflow | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::runtime digest mismatch" >&2; exit 1; }
          expected="$(jq -er '.policy_binary_sha256' "$manifest")"
          actual="$(sha256sum .velnor-workflow-runtime/velnor-workflow-policy | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::policy runtime digest mismatch" >&2; exit 1; }
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        env:
          EXPECTED_REVISION: 816046893ef55359ee2f41903d1f1f893d59303e
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/velnor-workflow-runtime-artifact"
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow "$home/bin/velnor-workflow"
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow-policy "$home/bin/velnor-workflow-policy"
          expected_closure="$(jq -er '.policy_closure' .velnor-workflow-runtime/manifest.json)"
          reported="$("$home/bin/velnor-workflow-policy" --closure)"
          [[ "$reported" == "$expected_closure" ]] || { echo "::error::policy runtime reports closure $reported, expected $expected_closure" >&2; exit 1; }
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$home/bin/velnor-workflow-policy" >> "$GITHUB_ENV"
      - name: Download expected work
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-expected-work
          path: .velnor-ci-expected-work
      - name: Download reported unit results
        # A no-work plan runs no unit jobs, so zero result artifacts is the
        # expected case there — and the aggregate fails a real-work plan with
        # zero records anyway. Tolerate the empty download; never the verdict.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: velnor-result-*
          merge-multiple: true
          path: .velnor-ci-results
      - name: Collect reported unit results
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p .velnor-ci-results
          files=(.velnor-ci-results/result-*.json)
          for file in "${files[@]}"; do
            if jq -e 'any(.results[]?; has("reused_from"))' "$file" >/dev/null; then
              echo "::error::$file carries reused_from without a validate_reuse decision; render emits no reused results" >&2
              exit 1
            fi
          done
          if (( ${#files[@]} == 0 )); then
            printf '{"results":[]}\n' > .velnor-ci-results.json
          else
            jq -s '{results: ([.[].results // empty] | add // [])}' "${files[@]}" > .velnor-ci-results.json
          fi
          echo "collected $(jq '.results | length' .velnor-ci-results.json) reported result(s) from ${#files[@]} record file(s)"
      - name: Score expected work against reported results
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          velnor-workflow aggregate --expected .velnor-ci-expected-work/expected-work.json --results .velnor-ci-results.json
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          EXCLUDED: ${{ needs.plan.outputs.excluded }}
          EXPECTED_CALLERS: "[{\"job_id\":\"github-hosted-bun-jackin-docs\",\"provider\":\"github-hosted\",\"unit_id\":\"bun-jackin-docs\"},{\"job_id\":\"github-hosted-docker-docker-construct\",\"provider\":\"github-hosted\",\"unit_id\":\"docker-docker-construct\"},{\"job_id\":\"github-hosted-rust-arrayref\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-arrayref\"},{\"job_id\":\"github-hosted-rust-jackin\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin\"},{\"job_id\":\"github-hosted-rust-jackin-agent-status\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-agent-status\"},{\"job_id\":\"github-hosted-rust-jackin-brand\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-brand\"},{\"job_id\":\"github-hosted-rust-jackin-build-meta\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-build-meta\"},{\"job_id\":\"github-hosted-rust-jackin-capsule\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-capsule\"},{\"job_id\":\"github-hosted-rust-jackin-config\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-config\"},{\"job_id\":\"github-hosted-rust-jackin-config-fuzz\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-config-fuzz\"},{\"job_id\":\"github-hosted-rust-jackin-console\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-console\"},{\"job_id\":\"github-hosted-rust-jackin-core\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-core\"},{\"job_id\":\"github-hosted-rust-jackin-dev\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-dev\"},{\"job_id\":\"github-hosted-rust-jackin-diagnostics\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-diagnostics\"},{\"job_id\":\"github-hosted-rust-jackin-docker\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-docker\"},{\"job_id\":\"github-hosted-rust-jackin-env\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-env\"},{\"job_id\":\"github-hosted-rust-jackin-env-fuzz\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-env-fuzz\"},{\"job_id\":\"github-hosted-rust-jackin-host\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-host\"},{\"job_id\":\"github-hosted-rust-jackin-image\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-image\"},{\"job_id\":\"github-hosted-rust-jackin-instance\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-instance\"},{\"job_id\":\"github-hosted-rust-jackin-isolation\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-isolation\"},{\"job_id\":\"github-hosted-rust-jackin-launch\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-launch\"},{\"job_id\":\"github-hosted-rust-jackin-manifest\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-manifest\"},{\"job_id\":\"github-hosted-rust-jackin-manifest-fuzz\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-manifest-fuzz\"},{\"job_id\":\"github-hosted-rust-jackin-oppicker\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-oppicker\"},{\"job_id\":\"github-hosted-rust-jackin-otlp-testbed\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-otlp-testbed\"},{\"job_id\":\"github-hosted-rust-jackin-pr-trailers\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-pr-trailers\"},{\"job_id\":\"github-hosted-rust-jackin-process\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-process\"},{\"job_id\":\"github-hosted-rust-jackin-protocol\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-protocol\"},{\"job_id\":\"github-hosted-rust-jackin-protocol-fuzz\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-protocol-fuzz\"},{\"job_id\":\"github-hosted-rust-jackin-runtime\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-runtime\"},{\"job_id\":\"github-hosted-rust-jackin-telemetry\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-telemetry\"},{\"job_id\":\"github-hosted-rust-jackin-test-support\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-test-support\"},{\"job_id\":\"github-hosted-rust-jackin-tui\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-tui\"},{\"job_id\":\"github-hosted-rust-jackin-usage\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-usage\"},{\"job_id\":\"github-hosted-rust-jackin-usage-ffi\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-usage-ffi\"},{\"job_id\":\"github-hosted-rust-jackin-xtask\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-jackin-xtask\"},{\"job_id\":\"github-hosted-rust-policy\",\"provider\":\"github-hosted\",\"unit_id\":\"rust-policy\"},{\"job_id\":\"github-hosted-swift-package-native\",\"provider\":\"github-hosted\",\"unit_id\":\"swift-package-native\"},{\"job_id\":\"github-hosted-swift-package-native-design-prototypes-unifiedagentusage\",\"provider\":\"github-hosted\",\"unit_id\":\"swift-package-native-design-prototypes-unifiedagentusage\"},{\"job_id\":\"github-hosted-swift-xcodegen-native-project-yml-jackindesktop\",\"provider\":\"github-hosted\",\"unit_id\":\"swift-xcodegen-native-project-yml-jackindesktop\"}]"
          PROVIDER_ADMITTED_GITHUB_HOSTED: ${{ true }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLAN_DIGEST" ]]; then
            echo "plan did not freeze a plan digest: the expected set has no identity" >&2
            exit 1
          fi
          echo "verdict binds plan digest $PLAN_DIGEST"
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          plan_expects() {
            [[ "$(jq -r --arg unit "$1" --arg provider "$2" '[.[] | select(.unit_id == $unit) | .providers[] | select(. == $provider)] | length' <<<"$SELECTED_UNITS")" -gt 0 ]]
          }
          if ! jq -e --argjson expected "$EXPECTED_CALLERS" '($expected | type == "array") and all($expected[]; type == "object" and (.unit_id | type) == "string" and (.provider | type) == "string" and (.job_id | type) == "string")' -n; then
            echo "generated required-caller contract is malformed" >&2
            exit 1
          fi
          if ! jq -e --argjson expected "$EXPECTED_CALLERS" 'type == "array" and (map(.unit_id) | unique | length) == length and all(.[]; . as $entry | ($entry | type) == "object" and ($entry.unit_id | type) == "string" and ($entry.unit_id | length) > 0 and ($entry.providers | type) == "array" and ($entry.providers | length) > 0 and (($entry.providers | map(type == "string" and length > 0) | all)) and (($entry.providers | unique | length) == ($entry.providers | length)) and all($entry.providers[]; . as $provider | any($expected[]; .unit_id == $entry.unit_id and .provider == $provider)))' <<<"$SELECTED_UNITS" >/dev/null; then
            echo "plan selected-unit output contains an unknown, duplicate, empty, or unmapped obligation" >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' <<<"$NEEDS_JSON" >/dev/null; then
            echo "workflow needs output is malformed" >&2
            exit 1
          fi
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          if plan_expects "bun-jackin-docs" "github-hosted"; then
            result="$(result_for_job github-hosted-bun-jackin-docs)"
            if [[ "$PROVIDER_ADMITTED_GITHUB_HOSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job github-hosted-bun-jackin-docs was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job github-hosted-bun-jackin-docs was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job github-hosted-bun-jackin-docs did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-hosted-bun-jackin-docs ran outside its provider admission (PROVIDER_ADMITTED_GITHUB_HOSTED=$PROVIDER_ADMITTED_GITHUB_HOSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-hosted-bun-jackin-docs)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job github-hosted-bun-jackin-docs succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job github-hosted-bun-jackin-docs ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects "docker-docker-construct" "github-hosted"; then
            result="$(result_for_job github-hosted-docker-docker-construct)"
            if [[ "$PROVIDER_ADMITTED_GITHUB_HOSTED" == true ]]; then
              case "$result" in
                success) ;;
