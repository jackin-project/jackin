          VELNOR_HOMEBREW_FORMULA_SPEC: "{\"auxiliaries\":[{\"files\":[{\"destination\":\"jackin-capsule/linux-arm64/jackin-capsule\",\"member\":\"jackin-capsule\",\"mode\":\"executable\",\"target\":\"aarch64-unknown-linux-gnu\",\"test\":\"linux_elf\"},{\"destination\":\"jackin-capsule/linux-amd64/jackin-capsule\",\"member\":\"jackin-capsule\",\"mode\":\"executable\",\"target\":\"x86_64-unknown-linux-gnu\",\"test\":\"linux_elf\"}],\"product\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"channels\":[{\"channel\":\"preview\",\"conflicts\":[\"jackin\"],\"destination\":\"Formula/jackin-preview.rb\",\"formula\":\"jackin-preview\",\"formula_class\":\"JackinPreview\"},{\"channel\":\"stable\",\"conflicts\":[\"jackin-preview\"],\"destination\":\"Formula/jackin.rb\",\"formula\":\"jackin\",\"formula_class\":\"Jackin\"}],\"description\":\"CLI for orchestrating autonomous AI coding agents\",\"homepage\":\"https://github.com/jackin-project/jackin\",\"host\":{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"product\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},\"license\":\"Apache-2.0\",\"schema\":\"velnor.homebrew-formula-spec.v1\",\"stable_sentinel\":{\"date\":\"2026-10-20\",\"reason\":\"has no native stable release yet\"},\"template\":\"velnor-homebrew-standalone-v1\"}"
          VELNOR_TAP_APP_ID: ${{ vars.HOMEBREW_TAP_APP_ID }}
          VELNOR_TAP_APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
          VELNOR_TAP_INSTALLATION_ID: ${{ steps.tap-token.outputs.installation-id }}
          VELNOR_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n(set -C; printf '%s' \"$VELNOR_RELEASE_POLICY\" > \"$VELNOR_REQUEST_FILE\")\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.65\"\n"
      - name: Retain original release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: velnor-stable-tap-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/tap-pr.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
  stable-tap-merge:
    name: Merge only the validated and fully reviewed PR head
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - stable-tap-selection
      - stable-tap-writer
    permissions:
      contents: read
      actions: read
      attestations: read
    environment: tap-update
    steps:
      - name: Set up Velnor-owned Mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d
        with:
          version: 2026.10.21
          sha256: ccfe12d7a62c6fb9def2a20db1f210f13a51de881f21fd8c85db4b6312405d07
          install: false
          env: false
          cache: false
          cache_save: false
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.3
      - name: Acquire Velnor
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: a657a9bfc1f3569edc529bb823dffa7411d5420a95263320c45f3bdd7b19c92e
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.65/velnor-actions-0.1.65-x86_64-unknown-linux-gnu
          VELNOR_RELEASE_COMMIT: 6a5983bf92a51c66e26200566328e87d5ab99dae
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.65\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors --retry-max-time 180 --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Download exact release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-stable-tap-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/tap-candidate
      - name: Download exact release evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-stable-tap-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/
      - name: Mint a short-lived token scoped to the single tap repository
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: jackin-project
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Mint a separate read-only tap protection observer
        id: tap-protection-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.HOMEBREW_TAP_PROTECTION_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_PROTECTION_APP_PRIVATE_KEY }}
          owner: jackin-project
          repositories: homebrew-tap
          permission-administration: read
          skip-token-revoke: false
      - name: Execute native release operation
        id: release
        shell: bash
        env:
          VELNOR_RELEASE_POLICY: "{\"channel\":\"stable\",\"companions\":[{\"asset_name\":\"capsule-manifest.json\",\"id\":\"capsule-manifest\",\"path\":\"capsule-manifest.json\"}],\"default_branch\":\"main\",\"products\":[{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"format\":\"tar-gz\",\"id\":\"jackin\",\"package\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},{\"bins\":[\"jackin-capsule\"],\"format\":\"tar-gz\",\"id\":\"jackin-capsule\",\"package\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"repository\":\"jackin-project/jackin\",\"schema\":\"velnor.package-release-policy.v1\",\"version\":{\"bindings\":[{\"manifest_path\":\"crates/apps/jackin/Cargo.toml\",\"package\":\"jackin\",\"workspace_manifest_path\":\"Cargo.toml\"},{\"manifest_path\":\"crates/apps/jackin-capsule/Cargo.toml\",\"package\":\"jackin-capsule\",\"workspace_manifest_path\":\"Cargo.toml\"}],\"version_package\":\"jackin\"}}"
          VELNOR_INTERNAL_OP: merge-homebrew-tap-pr-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/package-release-policy.json
          VELNOR_RELEASE_COMMIT_COUNT: ${{ needs.stable-tap-selection.outputs.commit_count }}
          VELNOR_RELEASE_CI_RUN_ID: ${{ needs.stable-tap-selection.outputs.ci_run_id }}
          VELNOR_RELEASE_CI_RUN_ATTEMPT: ${{ needs.stable-tap-selection.outputs.ci_attempt }}
          VELNOR_STABLE_VERSION_PACKAGE: jackin
          VELNOR_RELEASE_ORIGINAL_RUN_ID: ${{ needs.stable-tap-selection.outputs.original_run_id }}
          VELNOR_RELEASE_ORIGINAL_RUN_ATTEMPT: ${{ needs.stable-tap-selection.outputs.original_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_READ_TOKEN }}
          VELNOR_TAP_POLICY: "{\"app_id_variable\":\"HOMEBREW_TAP_APP_ID\",\"app_private_key_secret\":\"HOMEBREW_TAP_APP_PRIVATE_KEY\",\"destinations\":{\"preview\":{\"formula\":\"Formula/jackin-preview.rb\"},\"stable\":{\"formula\":\"Formula/jackin.rb\"}},\"enabled\":true,\"environment\":\"tap-update\",\"merge\":\"squash-after-gates\",\"protection_observer\":{\"app_id_variable\":\"HOMEBREW_TAP_PROTECTION_APP_ID\",\"app_private_key_secret\":\"HOMEBREW_TAP_PROTECTION_APP_PRIVATE_KEY\"},\"repository\":\"jackin-project/homebrew-tap\",\"review_completion\":{\"app_id_variable\":\"HOMEBREW_TAP_COMPLETION_APP_ID\",\"check_name\":\"Review completion\",\"expected_reviewers\":[{\"app_id_variable\":\"HOMEBREW_TAP_REVIEWER_APP_ID\"}]}}"
          VELNOR_HOMEBREW_FORMULA_SPEC: "{\"auxiliaries\":[{\"files\":[{\"destination\":\"jackin-capsule/linux-arm64/jackin-capsule\",\"member\":\"jackin-capsule\",\"mode\":\"executable\",\"target\":\"aarch64-unknown-linux-gnu\",\"test\":\"linux_elf\"},{\"destination\":\"jackin-capsule/linux-amd64/jackin-capsule\",\"member\":\"jackin-capsule\",\"mode\":\"executable\",\"target\":\"x86_64-unknown-linux-gnu\",\"test\":\"linux_elf\"}],\"product\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"channels\":[{\"channel\":\"preview\",\"conflicts\":[\"jackin\"],\"destination\":\"Formula/jackin-preview.rb\",\"formula\":\"jackin-preview\",\"formula_class\":\"JackinPreview\"},{\"channel\":\"stable\",\"conflicts\":[\"jackin-preview\"],\"destination\":\"Formula/jackin.rb\",\"formula\":\"jackin\",\"formula_class\":\"Jackin\"}],\"description\":\"CLI for orchestrating autonomous AI coding agents\",\"homepage\":\"https://github.com/jackin-project/jackin\",\"host\":{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"product\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},\"license\":\"Apache-2.0\",\"schema\":\"velnor.homebrew-formula-spec.v1\",\"stable_sentinel\":{\"date\":\"2026-10-20\",\"reason\":\"has no native stable release yet\"},\"template\":\"velnor-homebrew-standalone-v1\"}"
          VELNOR_TAP_APP_ID: ${{ vars.HOMEBREW_TAP_APP_ID }}
          VELNOR_TAP_APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
          VELNOR_TAP_INSTALLATION_ID: ${{ steps.tap-token.outputs.installation-id }}
          VELNOR_TAP_MERGE_TOKEN: ${{ steps.tap-token.outputs.token }}
          VELNOR_TAP_PROTECTION_TOKEN: ${{ steps.tap-protection-token.outputs.token }}
          VELNOR_TAP_PROTECTION_APP_ID: ${{ vars.HOMEBREW_TAP_PROTECTION_APP_ID }}
          VELNOR_TAP_PROTECTION_APP_SLUG: ${{ steps.tap-protection-token.outputs.app-slug }}
          VELNOR_TAP_PROTECTION_INSTALLATION_ID: ${{ steps.tap-protection-token.outputs.installation-id }}
          VELNOR_TAP_COMPLETION_APP_ID: ${{ vars.HOMEBREW_TAP_COMPLETION_APP_ID }}
          VELNOR_TAP_REVIEWER_APP_ID_0: ${{ vars.HOMEBREW_TAP_REVIEWER_APP_ID }}
        run: "set -euo pipefail\numask 077\nmkdir -p \"$RUNNER_TEMP/velnor\"\n(set -C; printf '%s' \"$VELNOR_RELEASE_POLICY\" > \"$VELNOR_REQUEST_FILE\")\n\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.65\"\n"
