# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / Main
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: false
        default: both
        type: choice
        options:
          - velnor
          - github
          - both
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-26.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      rust-2_matrix: ${{ steps.plan.outputs.rust-2_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      swift_matrix: ${{ steps.plan.outputs.swift_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@7fa4a0731ee8bedc5b02d90507d6dbe8b719153a
        with:
          rev: 7fa4a0731ee8bedc5b02d90507d6dbe8b719153a
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_LANES: ${{ github.event.inputs.runner || 'both' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 7fa4a0731ee8bedc5b02d90507d6dbe8b719153a
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-7fa4a0731ee8bedc5b02d90507d6dbe8b719153a-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  policy:
    name: Advisory policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
            .github-gen
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea
          restore-keys: |
            velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          CACHED_POLICY_RUNTIME="$HOME/.cargo/bin/velnor-workflow-policy-92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea"
          if [ -x "$CACHED_POLICY_RUNTIME" ]; then
            ln -sf "velnor-workflow-policy-92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea" "$HOME/.cargo/bin/velnor-workflow"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          STAGED_POLICY_RUNTIME="$CACHED_POLICY_RUNTIME.$$"
          install -Dm0755 "$VELNOR_WORKFLOW_ROOT/bin/velnor-workflow" "$STAGED_POLICY_RUNTIME"
          mv -f "$STAGED_POLICY_RUNTIME" "$CACHED_POLICY_RUNTIME"
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: 92f933fdb7f84ef8d6e6eb3c1b5809d8231fbaea
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
  group-bun:
    name: "Bun / Packages"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.bun_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-bun.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-docker:
    name: "Docker / Images"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.docker_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-rust:
    name: Rust
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.rust_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-rust-2:
    name: group-rust-2
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.rust-2_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-rust-2.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  group-swift:
    name: "Swift / Packages"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && needs.plan.outputs.swift_matrix != '[]' }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-swift.yml
    with:
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, policy, group-bun, group-docker, group-rust, group-rust-2, group-swift]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          matrix="$(jq -r --arg key 'bun_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-bun)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-bun did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-bun failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'docker_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-docker)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-docker did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-docker failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'rust_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-rust)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-rust did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-rust failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'rust-2_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-rust-2)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-rust-2 did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-rust-2 failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
          matrix="$(jq -r --arg key 'swift_matrix' --arg empty '[]' '.plan.outputs[$key] // $empty' <<<"$NEEDS_JSON")"
          result="$(result_for_job group-swift)"
          if [[ "$matrix" != '[]' ]]; then
            if [[ "$result" != success ]]; then
              echo "selected CI group group-swift did not pass: $result" >&2
              exit 1
            fi
          else
            case "$result" in
              success|skipped) ;;
              *) echo "unselected CI group group-swift failed unexpectedly: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: Required
    if: ${{ always() }}
    needs: [ci-required]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}
        run: exit 1
