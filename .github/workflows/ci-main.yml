# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: CI / Main
run-name: CI / main · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated provider subset of [github-hosted, github-self-hosted, velnor]
        required: false
        default: github-hosted,github-self-hosted,velnor
        type: string
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string


concurrency:
  group: jackin-agent-brown-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-main-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: "Control / Planning"
    runs-on: velnor-scale-set
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      units: ${{ steps.plan.outputs.units }}
      unit_ids: ${{ steps.plan.outputs.unit_ids }}
      full_units: ${{ steps.plan.outputs.full_units }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      excluded: ${{ steps.plan.outputs.excluded }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      docs_matrix: ${{ steps.plan.outputs.docs_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@1048337062ea625fada1b4f7c07f2feed75f60c7
        with:
          rev: 1048337062ea625fada1b4f7c07f2feed75f60c7
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=1048337062ea625fada1b4f7c07f2feed75f60c7" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_PROVIDERS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.providers || 'github-hosted,github-self-hosted,velnor' }}
          VELNOR_EVENT_TRUSTED: ${{ (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 1048337062ea625fada1b4f7c07f2feed75f60c7
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          src="$(command -v velnor-workflow)"
          install -m 0755 "$src" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          policy_src="${VELNOR_WORKFLOW_PINNED_BINARY:-$src}"
          install -m 0755 "$policy_src" "$stage/velnor-workflow-policy"
          policy_revision="$("$stage/velnor-workflow-policy" --revision)"
          policy_closure="$("$stage/velnor-workflow-policy" --closure)"
          [[ "$policy_closure" == "${{ steps.runtime.outputs.closure }}" ]] || { echo "::error::policy runtime reports closure $policy_closure, expected ${{ steps.runtime.outputs.closure }}" >&2; exit 1; }
          policy_digest="$(sha256sum "$stage/velnor-workflow-policy" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg closure "${{ steps.runtime.outputs.closure }}" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" --arg policy_revision "$policy_revision" --arg policy_closure "$policy_closure" --arg policy_binary_sha256 "$policy_digest" '{repository: $repository, revision: $revision, closure: $closure, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256, policy_revision: $policy_revision, policy_closure: $policy_closure, policy_binary_sha256: $policy_binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-1048337062ea625fada1b4f7c07f2feed75f60c7-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
  policy:
    name: Policy
    runs-on: velnor-scale-set
    timeout-minutes: 20
    # Trust invariant: this job runs the base branch's Stage-0 validator
    # product against the audited tree under pull_request_target. It holds
    # `contents: read` only, references no secrets, persists no credentials,
    # and never compiles. When the audited tree differs from the declared
    # pin's render, it additionally EXECUTES the PR run's prebuilt
    # candidate generator — PR-built code, same-repository runs only, bound
    # to the audited tree by manifest closure plus binary digest before
    # execution — with no secret references, no persisted credentials, the
    # read-only github.token confined to the Acquire/Ruleset API steps,
    # and both candidate exec points tokenless.
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: policy-checkout
          fetch-depth: 0
          persist-credentials: false
      - name: Check out audited head
        working-directory: policy-checkout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags "$GITHUB_SERVER_URL/$HEAD_REPOSITORY" "$HEAD_SHA"
          fi
          git checkout --quiet --detach "$HEAD_SHA"
      - name: Set up Velnor workflow runtime
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@1048337062ea625fada1b4f7c07f2feed75f60c7
        with:
          rev: 1048337062ea625fada1b4f7c07f2feed75f60c7
          checkout-path: ${{ github.workspace }}/policy-checkout
      - name: Read declared generator pin
        id: pin
        working-directory: policy-checkout
        run: |
          set -euo pipefail
          pin="$(sed -n -E 's/^[[:space:]]*revision[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*/\1/p' .github-gen/velnor-workflow.toml | head -n 1)"
          test "$pin" != '' || pin="$(sed -n -E 's/^.*VELNOR_WORKFLOW_POLICY_REVISION:[[:space:]]*([0-9a-f]{40}).*/\1/p' .github/workflows/ci-policy.yml | head -n 1)"
          test "$pin" != '' || { echo "::error::audited tree declares no generator pin" >&2; exit 1; }
          echo "value=$pin" >> "$GITHUB_OUTPUT"
      - name: Set up declared generator product
        id: renderer
        if: steps.pin.outputs.value != '1048337062ea625fada1b4f7c07f2feed75f60c7'
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@1048337062ea625fada1b4f7c07f2feed75f60c7
        with:
          rev: ${{ steps.pin.outputs.value }}
          checkout-path: ${{ github.workspace }}/policy-checkout
      - name: Resolve declared generator product
        if: steps.pin.outputs.value != '1048337062ea625fada1b4f7c07f2feed75f60c7'
        run: |
          set -euo pipefail
          binary="$HOME/.cache/velnor/workflow-runtime/${{ steps.renderer.outputs.closure }}/bin/velnor-workflow"
          test -x "$binary"
          echo "VELNOR_WORKFLOW_PINNED_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Resolve required status checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
          DECLARED_RULESET_CONTEXTS: DCO,Policy,ci-required
        run: |
          set -euo pipefail
          stderr="$(mktemp)"
          trap 'rm -f "$stderr"' EXIT
          if contexts="$(gh api "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true" 2>"$stderr" \
            | jq -r '.[] | select(.target == "branch" and .enforcement == "active") | .id' \
            | while read -r id; do gh api "repos/$GITHUB_REPOSITORY/rulesets/$id"; done \
            | jq -r --arg branch "refs/heads/$DEFAULT_BRANCH" 'select(.conditions.ref_name.include | any(. == "~DEFAULT_BRANCH" or . == "~ALL" or . == $branch)) | .rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' \
            | sort -u | paste -sd, -)"; then
            :
          elif grep -qE '(HTTP 403|Upgrade to GitHub Team)' "$stderr"; then
            echo "::warning::rulesets API returned 403; falling back to declared contexts [$DECLARED_RULESET_CONTEXTS]"
            contexts="$DECLARED_RULESET_CONTEXTS"
          else
            cat "$stderr" >&2
            exit 1
          fi
          echo "RULESET_CONTEXTS=$contexts" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          VELNOR_WORKFLOW_POLICY_REVISION: 1048337062ea625fada1b4f7c07f2feed75f60c7
        run: |
          set -euo pipefail
          velnor-workflow policy \
            --workflow-root "$WORKFLOW_ROOT" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --candidate-manifest "${VELNOR_WORKFLOW_CANDIDATE_MANIFEST:-}" \
            --ruleset-contexts "$RULESET_CONTEXTS"

      - name: Set up actionlint
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: actionlint@1.7.12
          cache: false
      - name: Lint caller workflows
        working-directory: policy-checkout
        env:
          MISE_NO_CONFIG: "1"
        run: mise exec actionlint@1.7.12 -- actionlint
  github-hosted-docker:
    name: "Docker · Docker · github-hosted — docker"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-hosted
  github-self-hosted-docker:
    name: "Docker · Docker · github-self-hosted — docker"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-self-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: github-self-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-self-hosted-trust-gated
  velnor-docker:
    name: "Docker · Docker · velnor — docker"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docker"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docker.yml
    with:
      unit: docker
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
  github-hosted-docs-prek:
    name: "Documentation · Pre-commit checks · github-hosted — docs-prek"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docs-prek"') && ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch')) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      unit: docs-prek
      provider: github-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      mise_tools: "prek gitleaks actionlint shellcheck"
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-hosted
  github-self-hosted-docs-prek:
    name: "Documentation · Pre-commit checks · github-self-hosted — docs-prek"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docs-prek"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-self-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      unit: docs-prek
      provider: github-self-hosted
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      mise_tools: "prek gitleaks actionlint shellcheck"
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: github-self-hosted-trust-gated
  velnor-docs-prek:
    name: "Documentation · Pre-commit checks · velnor — docs-prek"
    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(needs.plan.outputs.units, '"unit_id":"docs-prek"') && (((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot')))) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-docs.yml
    with:
      unit: docs-prek
      provider: velnor
      selected_units: ${{ needs.plan.outputs.units }}
      selected_unit_ids: ${{ needs.plan.outputs.unit_ids }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      plan_digest: ${{ needs.plan.outputs.plan_digest }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
      head_sha: ${{ needs.plan.outputs.head_sha }}
      mise_tools: "prek gitleaks actionlint shellcheck"
      unit_platform: linux-x64
      unit_trust: untrusted-ok
      unit_admission: velnor-trust-gated
  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [plan, policy, github-hosted-docker, github-self-hosted-docker, velnor-docker, github-hosted-docs-prek, github-self-hosted-docs-prek, velnor-docs-prek]
    runs-on: velnor-scale-set
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
          PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
          EXCLUDED: ${{ needs.plan.outputs.excluded }}
          PROVIDER_ADMITTED_GITHUB_HOSTED: ${{ (github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-hosted,')) || (github.event_name != 'workflow_dispatch') }}
          PROVIDER_ADMITTED_GITHUB_SELF_HOSTED_TRUSTED: ${{ ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',github-self-hosted,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
          PROVIDER_ADMITTED_VELNOR_TRUSTED: ${{ ((github.event_name == 'workflow_dispatch' && contains(format(',{0},', github.event.inputs.providers), ',velnor,')) || (github.event_name != 'workflow_dispatch')) && (!(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.type == 'Bot'))) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLAN_DIGEST" ]]; then
            echo "plan did not freeze a plan digest: the expected set has no identity" >&2
            exit 1
          fi
          echo "verdict binds plan digest $PLAN_DIGEST"
          result_for_job() {
            jq -r --arg job "$1" '.[$job].result // empty' <<<"$NEEDS_JSON"
          }
          plan_expects() {
            [[ "$(jq -r --arg unit "$1" --arg provider "$2" '[.[] | select(.unit_id == $unit) | .providers[] | select(. == $provider)] | length' <<<"$SELECTED_UNITS")" -gt 0 ]]
          }
          result="$(result_for_job plan)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite plan did not pass: $result" >&2
            exit 1
          fi
          result="$(result_for_job policy)"
          if [[ "$result" != success ]]; then
            echo "required CI prerequisite policy did not pass: $result" >&2
            exit 1
          fi
          if plan_expects "docker" "github-hosted"; then
            result="$(result_for_job github-hosted-docker)"
            if [[ "$PROVIDER_ADMITTED_GITHUB_HOSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job github-hosted-docker was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job github-hosted-docker was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job github-hosted-docker did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-hosted-docker ran outside its provider admission (PROVIDER_ADMITTED_GITHUB_HOSTED=$PROVIDER_ADMITTED_GITHUB_HOSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-hosted-docker)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job github-hosted-docker succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job github-hosted-docker ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects "docker" "github-self-hosted"; then
            result="$(result_for_job github-self-hosted-docker)"
            if [[ "$PROVIDER_ADMITTED_GITHUB_SELF_HOSTED_TRUSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job github-self-hosted-docker was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job github-self-hosted-docker was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job github-self-hosted-docker did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job github-self-hosted-docker ran outside its provider admission (PROVIDER_ADMITTED_GITHUB_SELF_HOSTED_TRUSTED=$PROVIDER_ADMITTED_GITHUB_SELF_HOSTED_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job github-self-hosted-docker)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job github-self-hosted-docker succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job github-self-hosted-docker ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects "docker" "velnor"; then
            result="$(result_for_job velnor-docker)"
            if [[ "$PROVIDER_ADMITTED_VELNOR_TRUSTED" == true ]]; then
              case "$result" in
                success) ;;
                skipped) echo "expected CI job velnor-docker was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job velnor-docker was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
                *) echo "expected CI job velnor-docker did not pass: $result" >&2; exit 1 ;;
              esac
            else
              case "$result" in
                skipped) ;;
                *) echo "selected CI job velnor-docker ran outside its provider admission (PROVIDER_ADMITTED_VELNOR_TRUSTED=$PROVIDER_ADMITTED_VELNOR_TRUSTED): $result" >&2; exit 1 ;;
              esac
            fi
          else
            result="$(result_for_job velnor-docker)"
            case "$result" in
              skipped) ;;
              success) echo "unexpected CI job velnor-docker succeeded outside the expected set: the plan did not declare it" >&2; exit 1 ;;
              *) echo "unexpected CI job velnor-docker ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
          if plan_expects "docs-prek" "github-hosted"; then
            result="$(result_for_job github-hosted-docs-prek)"
            if [[ "$PROVIDER_ADMITTED_GITHUB_HOSTED" == true ]]; then
