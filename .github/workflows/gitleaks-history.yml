name: gitleaks history

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

concurrency:
  group: gitleaks-history-${{ github.ref }}
  cancel-in-progress: false

# Both lanes run the SAME steps with the SAME toolchain; only runs-on differs.
# The GitHub-hosted label lives in the matrix include so that no runs-on line
# carries a GitHub-hosted literal: Velnor is the only literal runner default.

jobs:
  scan:
    name: Gitleaks history (Velnor)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.lanes != 'github' }}
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: [self-hosted, velnor-target-mvp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history is the scanner input
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.11"
          install_args: gitleaks
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: gitleaks detect --source . --redact --verbose --no-banner

  scan-github:
    name: Gitleaks history (GitHub)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor' }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history is the scanner input
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.11"
          install_args: gitleaks
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: gitleaks detect --source . --redact --verbose --no-banner

  gitleaks-required:
    needs: [scan, scan-github]
    if: always()
    name: Gitleaks required (Velnor)
    permissions: {}
    # Headroom for fleet admission/finalization: the gate itself takes seconds,
    # but a short timeout previously killed it while the fleet was saturated.
    timeout-minutes: 15
    runs-on: [self-hosted, velnor-target-mvp]
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON" | jq -e '[to_entries[].value.result] as $r | ($r | any(. == "failure" or . == "cancelled") | not) and ($r | any(. == "success"))' >/dev/null
