# Repo-owned frozen bytes (vendored from the velnor-workflow schema-1 render).
# The schema-2 generator cannot emit the GitHub-hosted Renovate writer
# ([renovate] requires the velnor provider); this static source preserves
# the writer byte-for-byte until generic hosted-renovate support exists.
# TO REGENERATE: delete this file + its [[static_files]] row, restore
# [renovate] + [[declare]] rows, and regen with a generator that supports it.
name: Renovate validate
run-name: Renovate validate · ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - renovate.json
      - renovate.json5
      - .github/renovate.json
      - .github/renovate.json5
  pull_request:
    paths:
      - renovate.json
      - renovate.json5
      - .github/renovate.json
      - .github/renovate.json5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-validate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/renovatebot/renovate:44.93.6 \
            renovate-config-validator --strict --no-global renovate.json
name: Renovate Validate
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
  group: renovate-validate-${{ github.ref }}
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
      - name: Verify the pinned mise release ships both construct architectures
        shell: bash
          source docker/construct/versions.env
          if [ -z "${MISE_VERSION:-}" ]; then
            echo "::error::MISE_VERSION is empty"
            exit 1
          fi
          for arch in x64 arm64; do
            url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-${arch}.tar.gz"
            if ! curl --fail --silent --show-error --location --head \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 60 \
              -o /dev/null "$url"; then
              echo "::error::${url} did not resolve — mise v${MISE_VERSION} is missing the linux-${arch} release asset"
              exit 1
            fi
          done
