name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both lanes run the SAME steps with the SAME toolchain; only runs-on differs.
# Fleet admission rejects post-merge push jobs on Velnor (merged_push_occupancy)
# so open PRs keep the fleet, therefore push events route to the GitHub lane;
# every other event defaults to Velnor. The GitHub-hosted label lives in the
# matrix include so that no runs-on line carries a GitHub-hosted literal:
# Velnor is the only literal runner default.

jobs:
  prek:
    name: Pre-commit (Velnor)
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.lanes != 'github') }}
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: [self-hosted, velnor-target-mvp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.12"
          install_args: prek
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: prek run --all-files

  prek-github:
    name: Pre-commit (GitHub)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor') }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.8.12"
          install_args: prek
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: prek run --all-files

  precommit-required:
    needs: [prek, prek-github]
    # On push a single GitHub-lane job runs and is itself the check; the gate
    # aggregates lanes for every other event. Velnor-labeled jobs must not run
    # on push (merged_push_occupancy), so the gate skips push.
    if: ${{ always() && github.event_name != 'push' }}
    name: Pre-commit required (Velnor)
    permissions: {}
    # Headroom for fleet admission/finalization: the gate itself takes seconds,
    # but a short timeout previously killed it while the fleet was saturated.
    timeout-minutes: 15
    runs-on: [self-hosted, velnor-target-mvp]
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON" | jq -e '[to_entries[].value.result] as $r | ($r | any(. == "failure" or . == "cancelled") | not) and ($r | any(. == "success"))' >/dev/null
