    name: Advisory policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
            .github-gen
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
