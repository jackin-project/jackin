  nightly-alert:
    name: Nightly red-to-signal
    if: ${{ always() }}
    needs: [nightly-required]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update nightly failure signal
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RESULT: ${{ needs.nightly-required.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIGHTLY_RESULT" == success ]]; then
            exit 0
          fi
          echo "::error::nightly-required failed: $NIGHTLY_RESULT"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open" --jq '.[] | select(.title == "Nightly CI red") | .number' | sed -n '1p')"
          body="$(printf '%s\n%s\n' \
            "nightly-required result: $NIGHTLY_RESULT" \
            "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$existing" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title='Nightly CI red' -f body="$body" >/dev/null
          fi
