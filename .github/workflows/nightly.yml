# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Nightly
run-name: Nightly · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: Execution backend
        required: true
        default: github
        type: choice
        options:
          - github
      scope:
        description: Verification scope
        required: true
        default: full
        type: choice
        options:
          - affected
          - full
      base_sha:
        description: Git ref or SHA used as the affected-selection base
        required: false
        default: refs/heads/main
        type: string
      simulate_failure:
        description: Force the red-to-signal test path
        required: false
        default: false
        type: boolean


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Planning
    runs-on: ubuntu-26.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      units: ${{ steps.plan.outputs.units }}
      full_units: ${{ steps.plan.outputs.full_units }}
      bun_matrix: ${{ steps.plan.outputs.bun_matrix }}
      docker_matrix: ${{ steps.plan.outputs.docker_matrix }}
      rust-2_matrix: ${{ steps.plan.outputs.rust-2_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
      swift_matrix: ${{ steps.plan.outputs.swift_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@8a17976725d2cf1a0517d2f9621083de9486c0b0
        with:
          rev: 8a17976725d2cf1a0517d2f9621083de9486c0b0
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=8a17976725d2cf1a0517d2f9621083de9486c0b0" >> "$GITHUB_ENV"
      - name: Select affected units
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_OVERRIDE: ${{ github.event.inputs.scope || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: ${{ runner.temp }}/velnor-ci-selection
          VELNOR_RUNNER: ${{ github.event.inputs.runner || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_SCOPE_OVERRIDE:-}" ]]; then unset CI_SCOPE_OVERRIDE; fi
          velnor-workflow plan --config .github/ci/project.toml

      - name: Prepare Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 8a17976725d2cf1a0517d2f9621083de9486c0b0
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/velnor-workflow-runtime"
          rm -rf "$stage"
          mkdir -p "$stage"
          install -m 0755 "$HOME/.cargo/bin/velnor-workflow" "$stage/velnor-workflow"
          digest="$(sha256sum "$stage/velnor-workflow" | awk '{print $1}')"
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$EXPECTED_REVISION" --arg head_branch "${{ github.ref_name }}" --arg platform "${{ runner.os }}-${{ runner.arch }}" --arg run_id "$GITHUB_RUN_ID" --arg job_id "${{ github.job }}" --arg binary_sha256 "$digest" '{repository: $repository, revision: $revision, head_branch: $head_branch, platform: $platform, run_id: $run_id, job_id: $job_id, binary_sha256: $binary_sha256}' > "$stage/manifest.json"
      - name: Publish Velnor workflow runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-workflow-runtime-8a17976725d2cf1a0517d2f9621083de9486c0b0-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/velnor-workflow-runtime
          if-no-files-found: error
          retention-days: 7
      - name: Publish Velnor CI selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-ci-selection
          path: ${{ runner.temp }}/velnor-ci-selection
          if-no-files-found: error
