      github.ref == 'refs/heads/main' &&
      needs.source-changed.outputs.source == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 45
    outputs:
      ci_ok: ${{ steps.ci.outputs.ok }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Accept successful triggering CI
        id: ci
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::unsupported preview event '${EVENT_NAME}' for source ${SOURCE_SHA}"
          exit 1

  publish-preview:
    needs: [source-changed, build-preview, build-jackin-capsule, publish-gate]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.source-changed.outputs.source == 'true' &&
      needs.publish-gate.outputs.ci_ok == 'true'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes != 'velnor') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 60
    concurrency:
      group: homebrew-tap-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source-changed.outputs.sha }}
          # Publishing verifies source ancestry before updating the formula.
          fetch-depth: 0
      - name: Bind publisher cache restore into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind publisher cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind publisher xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind publisher fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: preview-${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push') && 'GitHub' || 'Velnor' }}-*
          merge-multiple: true

      - name: Bind CI xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind CI xtask fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Restore prepared CI xtask
        uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'push') && 'GitHub' || 'Velnor' }}
          xtask-contract: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'crates/*/Cargo.toml', 'crates/jackin-xtask/src/**', 'crates/jackin-process/src/**') }}
          include-tools: "false"

      - name: Verify source SHA is on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SHA: ${{ needs.source-changed.outputs.sha }}
        run: |
          # Use GitHub's compare API instead of mutating the local checkout.
          # A prior run published preview.1 for f6327ae because the runner
          # behaved like it only had a one-commit checkout even with
          # fetch-depth: 0, so local git ancestry checks were no longer
          # reliable enough for preview versioning.
          compare_status=$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${FULL_SHA}...main" |
              jq -er '.status'
          )

          case "$compare_status" in
            identical|ahead) ;;
            *)
              echo "::error::source SHA ${FULL_SHA} is not on main (compare status: ${compare_status})"
              exit 1
              ;;
          esac

      - name: Read platform SHA256s
        id: shas
        run: |
          {
            echo "arm64_macos=$(cat artifacts/jackin-aarch64-apple-darwin.tar.gz.sha256)"
            echo "x86_macos=$(cat artifacts/jackin-x86_64-apple-darwin.tar.gz.sha256)"
            echo "arm64_linux=$(cat artifacts/jackin-aarch64-unknown-linux-gnu.tar.gz.sha256)"
            echo "x86_linux=$(cat artifacts/jackin-x86_64-unknown-linux-gnu.tar.gz.sha256)"
            echo "capsule_arm64_linux=$(cat artifacts/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256)"
            echo "capsule_x86_linux=$(cat artifacts/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Produce and sign capsule manifest
        uses: ./.github/actions/sign-capsule-manifest
        with:
          version: ${{ needs.source-changed.outputs.version }}
          arm64-sha: ${{ steps.shas.outputs.capsule_arm64_linux }}
          x86-sha: ${{ steps.shas.outputs.capsule_x86_linux }}
          github-token: ${{ github.token }}

      - name: Publish preview GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source-changed.outputs.version }}
          SHA: ${{ needs.source-changed.outputs.sha }}
        run: >-
          "$CI_XTASK" github publish-preview
          --repository "$GITHUB_REPOSITORY"
          --version "$VERSION"
          --sha "$SHA"
          --assets artifacts
