      VELNOR_PACKAGE_CHANNEL: preview
      EXPECTED_SOURCE_REPOSITORY: "jackin-project/jackin"
      EXPECTED_SOURCE_REF: "refs/heads/main"
      EXPECTED_MANIFEST_SCHEMA: velnor.package-release.v1
      EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      VELNOR_SOURCE_CHECKOUT_DIR: ${{ github.workspace }}/source
      RELEASE_TAG: preview
      RELEASE_PRERELEASE: "true"
      RELEASE_TITLE_PREFIX: Preview
      CONSUMER_REPOSITORY: "jackin-project/homebrew-tap"
      CONSUMER_BRANCH: main
      UPDATER: "./scripts/package-update.sh"
      UPDATER_TOKEN: ${{ secrets.TAP_TOKEN }}
      UPDATE_COMMIT_MESSAGE: "chore: update verified jackin preview"
    concurrency:
      group: jackin-package-release-preview
      cancel-in-progress: false
    steps:
      - name: Checkout verified source for publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "jackin-project/jackin"
          ref: ${{ needs.build.outputs.source_commit }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        id: runtime
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@89f82dd8b287f46a3cf4c0920f341f6ca6c736db
        with:
          rev: 89f82dd8b287f46a3cf4c0920f341f6ca6c736db
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=89f82dd8b287f46a3cf4c0920f341f6ca6c736db" >> "$GITHUB_ENV"
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Install locked package verification tools
        working-directory: source
        run: mise --yes install --locked --include-task-tools
      - name: Download verified package handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-release
          path: package
          merge-multiple: true
      - name: Re-verify downloaded handoff
        id: verify
        run: |
          set -euo pipefail
          dir="$VELNOR_VERIFIED_PACKAGE_DIR"
          test -d "$dir"
          manifest="$dir/release-manifest.json"
          identity="$dir/identity.json"
          test -s "$manifest"
          test -s "$identity"
          expected_files="$(mktemp)"
          actual_files="$(mktemp)"
          expected_names="$(mktemp)"
          actual_names="$(mktemp)"
          checksum_names="$(mktemp)"
          expected_supporting_names="$(mktemp)"
          actual_supporting_names="$(mktemp)"
          trap 'rm -f -- "$expected_files" "$actual_files" "$expected_names" "$actual_names" "$checksum_names" "$expected_supporting_names" "$actual_supporting_names"' EXIT
          {
            printf '%s\n' "release-manifest.json" "identity.json"
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'SHA256SUMS'
            printf '%s\n' 'capsule-manifest.json'
            printf '%s\n' 'capsule-manifest.json.bundle'
          } | LC_ALL=C sort > "$expected_files"
          find "$dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual_files"
          if find "$dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::verified package directory contains a non-file entry" >&2
            exit 1
          fi
          if ! cmp -s "$expected_files" "$actual_files"; then
            echo "::error::verified package directory contains an undeclared or missing file" >&2
            diff -u "$expected_files" "$actual_files" >&2 || true
            exit 1
          fi
          source_checkout="${VELNOR_SOURCE_CHECKOUT_DIR:-$GITHUB_WORKSPACE}"
          actual_source_commit="$(git -C "$source_checkout" rev-parse HEAD)"
          [[ "$actual_source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source checkout HEAD is not 40 lowercase hex" >&2; exit 1; }
          [ "$actual_source_commit" = "$EXPECTED_SOURCE_COMMIT" ] || { echo "::error::source checkout HEAD does not match the expected source commit" >&2; exit 1; }
          source_remote="$(git -C "$source_checkout" remote get-url origin)"
          case "$source_remote" in
            https://github.com/*|http://github.com/*) actual_source_repository="${source_remote#*github.com/}" ;;
            ssh://git@github.com/*) actual_source_repository="${source_remote#ssh://git@github.com/}" ;;
            git@github.com:*) actual_source_repository="${source_remote#git@github.com:}" ;;
            *) echo "::error::source checkout origin is not a GitHub repository URL" >&2; exit 1 ;;
          esac
          actual_source_repository="${actual_source_repository%.git}"
          [ "$actual_source_repository" = "$EXPECTED_SOURCE_REPOSITORY" ] || { echo "::error::source checkout repository does not match the declared repository" >&2; exit 1; }
          source_commit="$(jq -er '.source_commit | strings' "$manifest")"
          version="$(jq -er '.version | strings' "$manifest")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::manifest source_commit is not 40 lowercase hex" >&2; exit 1; }
          [ "$source_commit" = "$actual_source_commit" ] || { echo "::error::manifest source_commit is not the checked-out commit" >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z0-9_-]+)\.[0-9]+\+[0-9a-f]{7}$ ]] || { echo "::error::manifest version is not a source-bound channel version" >&2; exit 1; }
          [ "${BASH_REMATCH[1]}" = "$VELNOR_PACKAGE_CHANNEL" ] || { echo "::error::manifest version channel does not match the configured channel" >&2; exit 1; }
          short_commit="$(printf '%s' "$source_commit" | cut -c1-7)"
          version_suffix="$(printf '%s' "$version" | awk -F+ '{print $2}')"
          [ "$version_suffix" = "$short_commit" ] || { echo "::error::version does not bind its source commit" >&2; exit 1; }
          jq -e \
            --arg schema "$EXPECTED_MANIFEST_SCHEMA" \
            --arg repository "$EXPECTED_SOURCE_REPOSITORY" \
            --arg source_ref "$EXPECTED_SOURCE_REF" \
            --arg commit "$source_commit" \
            --slurpfile package_manifest "$manifest" \
            'keys == ["assets","schema","source_commit","source_ref","source_repository","supporting_assets","version"] and
             .schema == $schema and .source_repository == $repository and
             .source_ref == $source_ref and .source_commit == $commit and
             (.assets | type == "array" and
              all(.[]; type == "object" and (keys == ["name","sha256"]) and
                (.name | strings | length > 0) and
                (.sha256 | strings | test("^[0-9a-f]{64}$")))) and
             (.supporting_assets | type == "array" and
              all(.[]; type == "object" and (keys == ["name","sha256"]) and
                (.name | strings | length > 0) and
                (.sha256 | strings | test("^[0-9a-f]{64}$"))))' "$manifest" >/dev/null
          jq -e \
            --arg repository "$EXPECTED_SOURCE_REPOSITORY" \
            --arg source_ref "$EXPECTED_SOURCE_REF" \
            --arg commit "$source_commit" \
            --slurpfile package_manifest "$manifest" \
            'keys == ["manifest","source_digest","source_ref","source_repository"] and
             .source_repository == $repository and .source_ref == $source_ref and
             .source_digest == $commit and .manifest == $package_manifest[0]' "$identity" >/dev/null
          {
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz'
          } | LC_ALL=C sort > "$expected_names"
          jq -r '.assets[].name' "$manifest" | LC_ALL=C sort > "$actual_names"
          if ! cmp -s "$expected_names" "$actual_names"; then
            echo "::error::manifest asset names do not equal the declared payloads" >&2
            exit 1
          fi
          jq -e '(.assets | map(.name)) as $names | ($names | unique | length) == ($names | length)' "$manifest" >/dev/null
          for name in \
            'jackin-aarch64-apple-darwin.tar.gz' \
            'jackin-x86_64-apple-darwin.tar.gz' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz'; do
            test -s "$dir/$name"
            expected="$(jq -er --arg name "$name" '[.assets[] | select(.name == $name)] | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' "$manifest")"
            actual="$(sha256sum "$dir/$name" | awk '{print $1}')"
            [ "$actual" = "$expected" ] || { echo "::error::payload checksum mismatch: $name" >&2; exit 1; }
           done
          {
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'SHA256SUMS'
            printf '%s\n' 'capsule-manifest.json'
            printf '%s\n' 'capsule-manifest.json.bundle'
          } | LC_ALL=C sort > "$expected_supporting_names"
          jq -r '.supporting_assets[].name' "$manifest" | LC_ALL=C sort > "$actual_supporting_names"
          if ! cmp -s "$expected_supporting_names" "$actual_supporting_names"; then
            echo "::error::manifest supporting assets do not equal the declared supporting assets" >&2
            exit 1
          fi
          for name in \
            'jackin-aarch64-apple-darwin.tar.gz.sha256' \
            'jackin-aarch64-apple-darwin.tar.gz.bundle' \
            'jackin-aarch64-apple-darwin.tar.gz.sbom.json' \
            'jackin-x86_64-apple-darwin.tar.gz.sha256' \
            'jackin-x86_64-apple-darwin.tar.gz.bundle' \
            'jackin-x86_64-apple-darwin.tar.gz.sbom.json' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json' \
            'SHA256SUMS' \
            'capsule-manifest.json' \
            'capsule-manifest.json.bundle'; do
            test -s "$dir/$name"
            expected="$(jq -er --arg name "$name" '[.supporting_assets[] | select(.name == $name)] | select(length == 1) | .[0].sha256 | select(test("^[0-9a-f]{64}$"))' "$manifest")"
            actual="$(sha256sum "$dir/$name" | awk '{print $1}')"
            [ "$actual" = "$expected" ] || { echo "::error::supporting asset checksum mismatch: $name" >&2; exit 1; }
          done
          for name in \
            'jackin-aarch64-apple-darwin.tar.gz.sha256' \
            'jackin-aarch64-apple-darwin.tar.gz.bundle' \
            'jackin-aarch64-apple-darwin.tar.gz.sbom.json' \
            'jackin-x86_64-apple-darwin.tar.gz.sha256' \
            'jackin-x86_64-apple-darwin.tar.gz.bundle' \
            'jackin-x86_64-apple-darwin.tar.gz.sbom.json' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle' \
            'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json' \
            'SHA256SUMS' \
            'capsule-manifest.json' \
            'capsule-manifest.json.bundle'; do
            test -s "$dir/$name"
          done
          if ! awk '
            NF == 2 {
              name = $2
              sub(/^\*/, "", name)
              if (length($1) != 64 || $1 !~ /^[0-9a-f]+$/ || name == "" || name ~ /[\\/[:space:]]/) {
                exit 1
              }
              print name
              next
            }
            { exit 1 }
          ' "$dir/SHA256SUMS" | LC_ALL=C sort > "$checksum_names"; then
            echo "::error::SHA256SUMS has an invalid line" >&2
            exit 1
          fi
          if ! cmp -s "$expected_names" "$checksum_names"; then
            echo "::error::SHA256SUMS does not name exactly the declared payloads" >&2
            exit 1
          fi
          if ! (cd "$dir" && sha256sum --check --strict SHA256SUMS) >/dev/null; then
            echo "::error::SHA256SUMS does not verify the downloaded payload bytes" >&2
            exit 1
          fi
          verify_sha256_sidecar() {
            local sidecar="$1"
            local payload="$2"
            local expected_name="${payload##*/}"
            local digest
            test -s "$sidecar"
            test "$(wc -c < "$sidecar" | tr -d ' ')" -le 4096
            if ! digest="$(awk -v expected_name="$expected_name" '
              NR == 1 && (NF == 1 || NF == 2) {
                if (length($1) != 64 || $1 !~ /^[0-9a-f]+$/) exit 1
                if (NF == 2) {
                  name = $2
                  sub(/^\*/, "", name)
                  if (name != expected_name) exit 1
                }
                print $1
                next
              }
              { exit 1 }
              END { if (NR != 1) exit 1 }
            ' "$sidecar")"; then
              echo "::error::checksum sidecar is not one strict digest line: $sidecar" >&2
              exit 1
            fi
            actual="$(sha256sum -- "$payload" | awk '{print $1}')"
            [ "$digest" = "$actual" ] || {
              echo "::error::checksum sidecar does not match payload: $sidecar" >&2
              exit 1
            }
          }
          verify_sha256_sidecar "$dir/jackin-aarch64-apple-darwin.tar.gz.sha256" "$dir/jackin-aarch64-apple-darwin.tar.gz"
          verify_sha256_sidecar "$dir/jackin-x86_64-apple-darwin.tar.gz.sha256" "$dir/jackin-x86_64-apple-darwin.tar.gz"
          verify_sha256_sidecar "$dir/jackin-aarch64-unknown-linux-gnu.tar.gz.sha256" "$dir/jackin-aarch64-unknown-linux-gnu.tar.gz"
          verify_sha256_sidecar "$dir/jackin-x86_64-unknown-linux-gnu.tar.gz.sha256" "$dir/jackin-x86_64-unknown-linux-gnu.tar.gz"
          verify_sha256_sidecar "$dir/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256" "$dir/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz"
          verify_sha256_sidecar "$dir/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256" "$dir/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Run handoff package verification tasks
        run: |
          set -euo pipefail
          cd "$VELNOR_SOURCE_CHECKOUT_DIR"
          mise run 'verify-preview-package'
      - name: Verify build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for payload in \
            "$PACKAGE_DIR/jackin-aarch64-apple-darwin.tar.gz" \
            "$PACKAGE_DIR/jackin-x86_64-apple-darwin.tar.gz" \
            "$PACKAGE_DIR/jackin-aarch64-unknown-linux-gnu.tar.gz" \
            "$PACKAGE_DIR/jackin-x86_64-unknown-linux-gnu.tar.gz" \
            "$PACKAGE_DIR/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz" \
            "$PACKAGE_DIR/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz" \
            "$PACKAGE_DIR/jackin-aarch64-apple-darwin.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-aarch64-apple-darwin.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-aarch64-apple-darwin.tar.gz.sbom.json" \
            "$PACKAGE_DIR/jackin-x86_64-apple-darwin.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-x86_64-apple-darwin.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-x86_64-apple-darwin.tar.gz.sbom.json" \
            "$PACKAGE_DIR/jackin-aarch64-unknown-linux-gnu.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-aarch64-unknown-linux-gnu.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json" \
            "$PACKAGE_DIR/jackin-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-x86_64-unknown-linux-gnu.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-x86_64-unknown-linux-gnu.tar.gz.sbom.json" \
            "$PACKAGE_DIR/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-capsule-aarch64-unknown-linux-gnu.tar.gz.sbom.json" \
            "$PACKAGE_DIR/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            "$PACKAGE_DIR/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.bundle" \
            "$PACKAGE_DIR/jackin-capsule-x86_64-unknown-linux-gnu.tar.gz.sbom.json" \
            "$PACKAGE_DIR/SHA256SUMS" \
            "$PACKAGE_DIR/capsule-manifest.json" \
            "$PACKAGE_DIR/capsule-manifest.json.bundle" \
            "$PACKAGE_DIR/release-manifest.json" \
            "$PACKAGE_DIR/identity.json"
          do
            gh attestation verify "$payload" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/preview.yml" --source-ref "$EXPECTED_SOURCE_REF" --source-digest "$EXPECTED_SOURCE_COMMIT"
          done
      - name: Publish immutable source-bound release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_PRERELEASE" in
            true|false) ;;
            *) echo "::error::invalid configured GitHub release type" >&2; exit 1 ;;
          esac
          release_flags=(--latest=false)
          if [ "$RELEASE_PRERELEASE" = true ]; then
            release_flags+=(--prerelease)
          fi
          tag="$RELEASE_TAG-$EXPECTED_SOURCE_COMMIT"
          version="$(jq -er '.version | strings' "$PACKAGE_DIR/release-manifest.json")"
          title="$RELEASE_TITLE_PREFIX $version"
          transaction_dir="$(mktemp -d)"
          release_json="$transaction_dir/release-response"
          expected_assets="$transaction_dir/expected-assets"
          existing_assets="$transaction_dir/existing-assets"
          download_dir="$transaction_dir/download"
          immutable_public=0
          trap 'rm -rf -- "$transaction_dir"' EXIT

          remote_tag_sha() {
            local tag_name="$1"
            local sha
            sha="$(git -C source -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" ls-remote origin "refs/tags/$tag_name^{}" | awk 'NR == 1 {print $1}')"
            if [ -z "$sha" ]; then
