            cmp -s "$names_file" "$downloaded_assets" || {
              echo "::error::immutable release downloaded asset set differs from its API asset set" >&2
              return 1
            }
            while IFS= read -r name; do
              test -n "$name"
              test -s "$source_dir/$name"
              test -s "$target_dir/$name"
              expected="$(sha256sum -- "$source_dir/$name" | awk '{print $1}')"
              actual="$(sha256sum -- "$target_dir/$name" | awk '{print $1}')"
              [ "$actual" = "$expected" ] || {
                echo "::error::immutable release asset bytes differ: $name" >&2
                return 1
              }
            done < "$names_file"
          }

          {
            printf '%s\n' 'release-manifest.json'
            printf '%s\n' 'identity.json'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-aarch64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-capsule-x86_64-unknown-linux-gnu.tar.gz'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.bundle'
            printf '%s\n' 'jackin-x86_64-apple-darwin.tar.gz.sbom.json'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.bundle'
            printf '%s\n' 'jackin-aarch64-unknown-linux-gnu.tar.gz.sbom.json'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.sha256'
            printf '%s\n' 'jackin-x86_64-unknown-linux-gnu.tar.gz.bundle'
