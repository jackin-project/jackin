# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Velnor workflow policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: policy-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller workflow data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: policy-checkout
          sparse-checkout: |
            .github/workflows
            .github-gen
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false
          # Static policy validation only; fork head checkout is intentional.
          allow-unsafe-pr-checkout: true
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          version: 1.8.3
          cache-key: velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-7fa4a0731ee8bedc5b02d90507d6dbe8b719153a
          restore-keys: |
            velnor-policy-mbx-1.8.3-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned Velnor workflow runtime
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor-workflow-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/velnor-workflow-cargo-target
          VELNOR_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/velnor-workflow-install
          VELNOR_WORKFLOW_ROOT: ${{ runner.temp }}/velnor-workflow
        run: |
          set -euo pipefail
          CACHED_POLICY_RUNTIME="$HOME/.cargo/bin/velnor-workflow-policy-7fa4a0731ee8bedc5b02d90507d6dbe8b719153a"
          if [ -x "$CACHED_POLICY_RUNTIME" ]; then
            ln -sf "velnor-workflow-policy-7fa4a0731ee8bedc5b02d90507d6dbe8b719153a" "$HOME/.cargo/bin/velnor-workflow"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          install -d -m 700 \
            "$CARGO_HOME" \
            "$CARGO_TARGET_DIR" \
            "$VELNOR_WORKFLOW_INSTALL_DIR"
          cd "$VELNOR_WORKFLOW_INSTALL_DIR"
          cargo install \
            --locked \
            --git https://github.com/tailrocks/velnor \
            --rev 7fa4a0731ee8bedc5b02d90507d6dbe8b719153a \
            --root "$VELNOR_WORKFLOW_ROOT" \
            velnor-workflow \
            --bin velnor-workflow
          STAGED_POLICY_RUNTIME="$CACHED_POLICY_RUNTIME.$$"
          install -Dm0755 "$VELNOR_WORKFLOW_ROOT/bin/velnor-workflow" "$STAGED_POLICY_RUNTIME"
          mv -f "$STAGED_POLICY_RUNTIME" "$CACHED_POLICY_RUNTIME"
          echo "$VELNOR_WORKFLOW_ROOT/bin" >> "$GITHUB_PATH"
      - name: Enforce workflow policy
        env:
          WORKFLOW_ROOT: ${{ github.workspace }}/policy-checkout
          VELNOR_WORKFLOW_POLICY_REVISION: 7fa4a0731ee8bedc5b02d90507d6dbe8b719153a
        run: velnor-workflow policy --workflow-root "$WORKFLOW_ROOT"
