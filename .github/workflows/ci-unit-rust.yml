          log="$RUNNER_TEMP/velnor-unit-log.txt"
          log_present=false
          if [[ -s "$log" ]]; then log_present=true; fi
          started="${VELNOR_CHECKS_STARTED_EPOCH:-}"
          ended="${VELNOR_CHECKS_ENDED_EPOCH:-}"
          wall=""
