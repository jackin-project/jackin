  verify-github-hosted-apple:
    name: "GitHub · hosted · Apple"
    if: ${{ inputs.provider == 'github-hosted' && contains(inputs.selected_units, format('"unit_id":"{0}"', inputs.unit)) && (true) && inputs.apple_executor }}
