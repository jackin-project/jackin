        with:
          path: |
            ${{ inputs.cache_paths }}
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-rust-${{ hashFiles(inputs.cache_key_files) }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-rust-
      - name: Mark cache prep end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CACHE_PREP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Prepare Cargo sources
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          CARGO_FETCH_ROOT: ${{ inputs.cargo_root }}
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -euo pipefail
          root="$CARGO_FETCH_ROOT"
          if [[ "$root" != "." ]]; then
            cd -- "$root"
          fi
          cargo fetch --locked
      - name: Mark cargo fetch end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CARGO_FETCH_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Run unit checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
          CARGO_NET_OFFLINE: "true"
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
