      - name: Stage product velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
        env:
          VELNOR_TRANSPORT_OUTPUTS: |
            target/xcframework/JackinUsage.xcframework
        run: velnor-workflow stage-product --producer 'rust-jackin-usage-ffi' --product 'xcframework-jackinusage' --digest '453ff3e83f1dfc3c8985760ff8f5131a794a4c373140873fc7a0617b5d6c804b' --stage "$RUNNER_TEMP/velnor-products/velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage"
      - name: Upload product velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
