        required: false
        type: string
        default: ""
      policy_runtime:
        required: false
        type: boolean
        default: false
      candidate_publish:
        required: false
        type: boolean
        default: false
      apple_executor:
        required: false
        type: boolean
        default: false
      unit_dependencies:
        required: false
        type: string
        default: ""
      unit_admission:
        required: false
        type: string
        default: ""

jobs:
  verify-github:
    name: GitHub
    if: ${{ inputs.lane == 'github' && contains(format(',{0},', inputs.selected_units), format(',{0},', inputs.unit)) && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'github' || github.event.inputs.runner == 'both' || github.event.inputs.runner == ''))) }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Mark CI job start
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/JOB_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
      - name: Record unit dependencies
        env:
          UNIT_ID: ${{ inputs.unit }}
          UNIT_DEPENDENCIES: ${{ inputs.unit_dependencies }}
          UNIT_ADMISSION: ${{ inputs.unit_admission }}
          UNIT_LANE: ${{ inputs.lane }}
        run: |
          {
            echo '## Unit dependencies'
            echo
            echo "- Unit: $UNIT_ID"
            echo "- Lane: $UNIT_LANE"
            echo "- Admission: $UNIT_ADMISSION"
            if [[ -z "$UNIT_DEPENDENCIES" ]]; then
              echo '- Dependencies: none'
            else
              echo "- Dependencies: $UNIT_DEPENDENCIES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Velnor workflow runtime
        id: runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@9660c9ff8336760c7b7e54e1814e012e0b34951c
        with:
          rev: 9660c9ff8336760c7b7e54e1814e012e0b34951c
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=9660c9ff8336760c7b7e54e1814e012e0b34951c" >> "$GITHUB_ENV"
      - name: Mark runner setup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/RUNNER_SETUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Materialize Velnor CI selection
        shell: bash
        env:
          SELECTION_BASE_SHA: ${{ inputs.base_sha }}
          SELECTION_HEAD_SHA: ${{ inputs.head_sha }}
          SELECTION_SCOPE: ${{ inputs.scope }}
          SELECTION_UNITS: ${{ inputs.selected_units }}
          SELECTION_FULL_UNITS: ${{ inputs.full_units }}
        run: |
          set -euo pipefail
          mkdir -p .velnor-ci-selection
          {
            printf 'version=1\n'
            printf 'base_sha=%s\n' "$SELECTION_BASE_SHA"
            printf 'head_sha=%s\n' "$SELECTION_HEAD_SHA"
            printf 'scope=%s\n' "$SELECTION_SCOPE"
            printf 'units=%s\n' "$SELECTION_UNITS"
            printf 'full_units=%s\n' "$SELECTION_FULL_UNITS"
          } > .velnor-ci-selection/velnor-ci-selection
      - name: Mark selection transport end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/SELECTION_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Set up Mise tools
        if: ${{ inputs.mise_tools != '' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.mise_tools }}
          cache: true
          cache_save: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      - name: Mark tool bootstrap end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/TOOL_BOOTSTRAP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Restore unit cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.cache_paths }}
          key: ci-${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles(inputs.cache_key_files) }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-swift-
      - name: Mark cache prep end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CACHE_PREP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Mark cargo fetch end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CARGO_FETCH_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Run unit checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_STARTED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CHECKS_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
          exit $rc
      - name: Save unit cache
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.cache_paths }}
          key: ci-${{ runner.os }}-${{ runner.arch }}-swift-${{ hashFiles(inputs.cache_key_files) }}
      - name: Mark cleanup end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CLEANUP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Report phase timings and cache outcomes
        if: always()
        uses: tailrocks/velnor/.github/actions/report-velnor-ci-outcomes@9660c9ff8336760c7b7e54e1814e012e0b34951c
        with:
          job_label: ${{ inputs.unit }}
          ci_lane: github
          cache_cargo_primary: ${{ steps.cache.outputs.cache-primary-key }}
          cache_cargo_matched: ${{ steps.cache.outputs.cache-matched-key }}
      - name: Record unit result
        if: ${{ always() && inputs.unit_admission == 'github' }}
        env:
          VELNOR_RESULT_UNIT: ${{ inputs.unit }}
          VELNOR_RESULT_LANE: github
          VELNOR_RESULT_OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VELNOR_RESULT_OUTCOME" in
            success) outcome=success ;;
            cancelled) outcome=cancelled ;;
            *) outcome=failure ;;
          esac
          mkdir -p .velnor-ci-results
          jq -n --arg unit "$VELNOR_RESULT_UNIT" --arg lane "$VELNOR_RESULT_LANE" --arg outcome "$outcome" '{results: [{unit: $unit, lane: $lane, outcome: $outcome}]}' > ".velnor-ci-results/result-$VELNOR_RESULT_UNIT-$VELNOR_RESULT_LANE.json"
      - name: Upload unit result
        if: ${{ always() && inputs.unit_admission == 'github' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velnor-result-${{ inputs.unit }}-github
          path: .velnor-ci-results/result-${{ inputs.unit }}-github.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

