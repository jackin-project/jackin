      - name: Download product velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
        if: ${{ contains(format(',{0},', inputs.product_transport_ready), ',rust-jackin-usage-ffi/xcframework-jackinusage:true,') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
          path: ${{ runner.temp }}/velnor-products/velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
      - name: Verify product velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage
        if: ${{ contains(format(',{0},', inputs.product_transport_ready), ',rust-jackin-usage-ffi/xcframework-jackinusage:true,') }}
        env:
          VELNOR_TRANSPORT_OUTPUTS: |
            target/xcframework/JackinUsage.xcframework
          VELNOR_TRANSPORT_OUTPUT_FILES: |
            target/xcframework/JackinUsage.xcframework/Info.plist
            target/xcframework/JackinUsage.xcframework/macos-arm64/Headers/module.modulemap
            target/xcframework/JackinUsage.xcframework/macos-arm64/libjackin_usage_ffi.a
        run: velnor-workflow verify-product --producer 'rust-jackin-usage-ffi' --product 'xcframework-jackinusage' --digest '136a3dfc92cd5337ff49e882927bc8d98f71ac54b6156d1a33925865883e7c29' --stage "$RUNNER_TEMP/velnor-products/velnor-product-rust-jackin-usage-ffi--xcframework-jackinusage" --marker VELNOR_PRODUCT_RUST_JACKIN_USAGE_FFI__XCFRAMEWORK_JACKINUSAGE_READY
      - name: Run unit checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          EVENT_NAME: ${{ github.event_name }}
