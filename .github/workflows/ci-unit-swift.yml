      - name: Record unit dependencies
        env:
          UNIT_ID: ${{ inputs.unit }}
          UNIT_DEPENDENCIES: ${{ inputs.unit_dependencies }}
          UNIT_ADMISSION: ${{ inputs.unit_admission }}
          UNIT_PROVIDER: ${{ inputs.provider }}
        run: |
          {
            echo '## Unit dependencies'
            echo
            echo "- Unit: $UNIT_ID"
            echo "- Provider: $UNIT_PROVIDER"
            echo "- Admission: $UNIT_ADMISSION"
