          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-swift-${{ hashFiles(inputs.cache_key_files) }}
          restore-keys: |
            ci-${{ runner.os }}-${{ runner.arch }}-${{ inputs.provider }}-${{ inputs.unit_platform }}-${{ inputs.unit_trust }}-swift-
      - name: Mark cache prep end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
          marker="$timing_dir/CACHE_PREP_ENDED"
          if [[ ! -e "$marker" ]]; then
            if (set -C; printf '%s\n' "$(date +%s)" > "$marker") 2>/dev/null; then
              chmod 0444 "$marker" 2>/dev/null || true
            fi
          fi
      - name: Mark cargo fetch end
        if: always()
        run: |
          timing_dir="$RUNNER_TEMP/velnor-ci-timing-${GITHUB_RUN_ID:-unknown}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-unknown}"
          umask 077
          mkdir -p "$timing_dir"
