          VELNOR_STABLE_TAG_ORIGIN_ARTIFACT_DIGEST: ${{ needs.stable-tag.outputs.origin_artifact_digest }}
          VELNOR_STABLE_TAG_INTENT_ARTIFACT_ID: ${{ needs.stable-tag.outputs.intent_artifact_id }}
