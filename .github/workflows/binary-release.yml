  stable-assemble:
    name: stable-assemble
    runs-on: xcode-27
    timeout-minutes: 35
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' && inputs.original_run_id == '' && inputs.original_run_attempt == '' }}
