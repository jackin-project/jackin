  stable-payload-001:
    name: Build jackin / aarch64-unknown-linux-gnu
    runs-on: xcode-27
    timeout-minutes: 35
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'release' && inputs.original_run_id == '' && inputs.original_run_attempt == '' }}
    needs:
      - stable-tag
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VELNOR_RELEASE_POLICY: "{\"channel\":\"stable\",\"companions\":[{\"asset_name\":\"capsule-manifest.json\",\"id\":\"capsule-manifest\",\"path\":\"capsule-manifest.json\"}],\"default_branch\":\"main\",\"products\":[{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"format\":\"tar-gz\",\"id\":\"jackin\",\"package\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},{\"bins\":[\"jackin-capsule\"],\"format\":\"tar-gz\",\"id\":\"jackin-capsule\",\"package\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"repository\":\"jackin-project/jackin\",\"schema\":\"velnor.package-release-policy.v1\",\"version\":{\"bindings\":[{\"manifest_path\":\"crates/apps/jackin/Cargo.toml\",\"package\":\"jackin\",\"workspace_manifest_path\":\"Cargo.toml\"},{\"manifest_path\":\"crates/apps/jackin-capsule/Cargo.toml\",\"package\":\"jackin-capsule\",\"workspace_manifest_path\":\"Cargo.toml\"}],\"version_package\":\"jackin\"}}"
    steps:
      - name: Set up Velnor-owned Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e
        with:
          version: 2026.10.18
          sha256: d40e2fcd96fed7c70b04af282c36534d87d0318bef89c16fa00c9f98e55ade88
          install: false
          env: false
          cache: false
          cache_save: false
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_AUTO_INSTALL: "false"
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_LOCKFILE: "0"
          MISE_NO_CONFIG: "1"
          MISE_NO_ENV: "1"
          MISE_NO_HOOKS: "1"
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
      - name: Install pinned GitHub CLI
        run: mise --no-config --no-env --no-hooks install gh@2.103.2
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_AUTO_INSTALL: "false"
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_LOCKFILE: "0"
          MISE_NO_CONFIG: "1"
          MISE_NO_ENV: "1"
          MISE_NO_HOOKS: "1"
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
      - name: Acquire Velnor
        timeout-minutes: 6
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          CARGO_REGISTRY_TOKEN: ""
          GH_CONFIG_DIR: ""
          GH_HOST: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          VELNOR_ASSET_SHA256: 5a3e138b7d9143b5fca8bb73467fcbc21f52374fc8d47e46be67b5d78983344b
          VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.54/velnor-actions-0.1.54-aarch64-apple-darwin
          VELNOR_RELEASE_COMMIT: a2ec35929e51b336bf54bd982f4cc0f5774eb397
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
