      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VELNOR_RELEASE_POLICY: "{\"channel\":\"stable\",\"companions\":[{\"asset_name\":\"capsule-manifest.json\",\"id\":\"capsule-manifest\",\"path\":\"capsule-manifest.json\"}],\"default_branch\":\"main\",\"products\":[{\"bins\":[\"jackin\",\"jackin-role\",\"jackin-usage-broker\"],\"format\":\"tar-gz\",\"id\":\"jackin\",\"package\":\"jackin\",\"targets\":[\"aarch64-apple-darwin\",\"aarch64-unknown-linux-gnu\",\"x86_64-apple-darwin\",\"x86_64-unknown-linux-gnu\"]},{\"bins\":[\"jackin-capsule\"],\"format\":\"tar-gz\",\"id\":\"jackin-capsule\",\"package\":\"jackin-capsule\",\"targets\":[\"aarch64-unknown-linux-gnu\",\"x86_64-unknown-linux-gnu\"]}],\"repository\":\"jackin-project/jackin\",\"schema\":\"velnor.package-release-policy.v1\",\"version\":{\"bindings\":[{\"manifest_path\":\"crates/apps/jackin/Cargo.toml\",\"package\":\"jackin\",\"workspace_manifest_path\":\"Cargo.toml\"},{\"manifest_path\":\"crates/apps/jackin-capsule/Cargo.toml\",\"package\":\"jackin-capsule\",\"workspace_manifest_path\":\"Cargo.toml\"}],\"version_package\":\"jackin\"}}"
