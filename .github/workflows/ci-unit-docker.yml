# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: "Docker / Images"
on:
  workflow_call:
    inputs:
      unit:
        required: true
        type: string
      scope:
        required: true
        type: string
      selection-artifact:
        required: true
        type: string

jobs:
  github-docker-docker-construct:
    name: "GitHub / docker-docker-construct"
    if: ${{ inputs.unit == 'docker-docker-construct' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.lanes == 'github' || github.event.inputs.lanes == 'both'))) }}
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Velnor workflow runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velnor-workflow-runtime-061df0fa39bed6e198fc3e069bc914c05e527f92-${{ runner.os }}-${{ runner.arch }}
          path: .velnor-workflow-runtime
      - name: Verify Velnor workflow runtime
        shell: bash
        env:
          EXPECTED_REVISION: 061df0fa39bed6e198fc3e069bc914c05e527f92
        run: |
          set -euo pipefail
          manifest=.velnor-workflow-runtime/manifest.json
          jq -e --arg revision "$EXPECTED_REVISION" --arg repository "$GITHUB_REPOSITORY" --arg platform "${RUNNER_OS}-${RUNNER_ARCH}" --arg run_id "$GITHUB_RUN_ID" '.revision == $revision and .repository == $repository and .platform == $platform and .run_id == $run_id and (.run_id | test("^[0-9]+$")) and .job_id != "" and (.binary_sha256 | test("^[0-9a-f]{64}$"))' "$manifest" >/dev/null
          expected="$(jq -er '.binary_sha256' "$manifest")"
          actual="$(sha256sum .velnor-workflow-runtime/velnor-workflow | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::runtime digest mismatch" >&2; exit 1; }
      - name: Add Velnor workflow runtime to PATH
        shell: bash
        run: |
          set -euo pipefail
          install -Dm0755 .velnor-workflow-runtime/velnor-workflow "$HOME/.cargo/bin/velnor-workflow"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Download Velnor CI selection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.selection-artifact }}
          path: .velnor-ci-selection
      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Run "Docker (docker/construct)" checks
        env:
          CI_SCOPE: ${{ inputs.scope }}
          CI_UNIT_ID: ${{ inputs.unit }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.inputs.base_sha || github.event.before || 'refs/heads/main' }}
          HEAD_SHA: ${{ github.sha }}
          VELNOR_SELECTION_FILE: .velnor-ci-selection/velnor-ci-selection
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: |
          set -o pipefail
          echo "VELNOR_CHECKS_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          rc=0
          velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit "$CI_UNIT_ID" 2>&1 | tee "$RUNNER_TEMP/velnor-unit-log.txt" || rc=$?
          echo "VELNOR_CHECKS_ENDED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          exit $rc
      - name: Report phase timings and cache outcomes
        if: always()
        env:
          VELNOR_WORKFLOW_NAME: "Docker · Docker (docker/construct)"
          VELNOR_LANE_NAME: GitHub
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/velnor-unit-log.txt"
          log_present=false
          if [[ -s "$log" ]]; then log_present=true; fi
          started="${VELNOR_CHECKS_STARTED_EPOCH:-}"
          ended="${VELNOR_CHECKS_ENDED_EPOCH:-}"
          wall=""
          if [[ "$started" =~ ^[0-9]+$ && "$ended" =~ ^[0-9]+$ ]]; then
            wall=$((ended - started))
          fi
          queue=""
          job_name=""
          expected_job="$VELNOR_WORKFLOW_NAME / $VELNOR_LANE_NAME"
          if command -v gh >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            run_started="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at // empty' 2>/dev/null || true)"
            jobs_json="$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" 2>/dev/null || true)"
            job_name="$(printf '%s' "$jobs_json" | jq -r --arg wf "$VELNOR_WORKFLOW_NAME" --arg lane "$VELNOR_LANE_NAME" '[.jobs[]? | select(.name == ($wf + " / " + $lane))][0].name // empty' 2>/dev/null | head -n1 || true)"
            if [[ -z "$job_name" ]]; then
              job_name="$(printf '%s' "$jobs_json" | jq -r --arg lane "$VELNOR_LANE_NAME" '[.jobs[]? | select(.name | endswith(" / " + $lane))][0].name // empty' 2>/dev/null | head -n1 || true)"
            fi
            if [[ -n "$job_name" && -n "$run_started" ]]; then
              job_started="$(printf '%s' "$jobs_json" | jq -r --arg name "$job_name" '.jobs[]? | select(.name == $name) | .started_at' 2>/dev/null | head -n1 || true)"
              if [[ -n "$job_started" ]]; then
                queue="$(jq -n --arg job "$job_started" --arg run "$run_started" '($job | fromdateiso8601) - ($run | fromdateiso8601)' 2>/dev/null || true)"
              fi
            fi
          fi
          if [[ -z "$job_name" ]]; then
            job_name="$expected_job"
          fi
          updating_index=0
          updating_git=0
          downloading_crates=0
          compiling_count=0
          downloaded_lines=""
          mbx_lines=""
          finished_lines=""
          if [[ -s "$log" ]]; then
            updating_index="$(grep -c 'Updating crates.io index' "$log" || true)"
            updating_git="$(grep -cE 'Updating git (repository|submodule)' "$log" || true)"
            downloading_crates="$(grep -c 'Downloading crates' "$log" || true)"
            compiling_count="$(grep -c 'Compiling ' "$log" || true)"
            downloaded_lines="$(grep -E 'Downloaded [0-9]+ crate' "$log" || true)"
            mbx_lines="$(grep -E 'mbx(\[cache\])?:' "$log" | grep -E 'hits|misses' || true)"
            finished_lines="$(grep -E 'Finished .* in ' "$log" || true)"
          fi
          positive_int() {
            local value="$1"
            [[ "$value" =~ ^[0-9]+$ ]] || value=0
            printf '%s' "$value"
          }
          report_json="$(jq -nc \
            --arg job "$job_name" \
            --arg queue "$queue" \
            --arg wall "$wall" \
            --argjson log_present "$log_present" \
            --argjson updating_index "$(positive_int "$updating_index")" \
            --argjson updating_git "$(positive_int "$updating_git")" \
            --argjson downloading_crates "$(positive_int "$downloading_crates")" \
            --argjson compiling_count "$(positive_int "$compiling_count")" \
            --argjson downloaded_lines "$(printf '%s' "$downloaded_lines" | jq -Rsc 'split("\n") | map(select(length > 0))' || true)" \
            --argjson mbx "$(printf '%s' "$mbx_lines" | jq -Rsc 'split("\n") | map(select(length > 0))' || true)" \
            --argjson finished "$(printf '%s' "$finished_lines" | jq -Rsc 'split("\n") | map(select(length > 0))' || true)" \
            '{
              job: $job,
              log_present: $log_present,
              queue_seconds: ($queue | if test("^[0-9]+$") then tonumber else null end),
              checks_wall_seconds: ($wall | if test("^[0-9]+$") then tonumber else null end),
              origin_downloads: {
                updating_crates_io_index: $updating_index,
                updating_git: $updating_git,
                downloading_crates: $downloading_crates,
                downloaded_lines: $downloaded_lines
              },
              compiler: {
                mbx_outcomes: $mbx,
                finished_segments: $finished,
                compiling_lines: $compiling_count
              }
            }' 2>/dev/null || true)"
          if [[ -z "$report_json" ]]; then
            report_json="VELNOR_CI_REPORT_FALLBACK job=$job_name"
          fi
          echo "VELNOR_CI_REPORT $report_json"
          {
            echo ""
            echo '### Phase timings and cache outcomes'
            echo ""
            echo '```json'
            echo "$report_json"
            echo '```'
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| queue_seconds | ${queue:-unknown} |"
            echo "| checks_wall_seconds | ${wall:-unknown} |"
            echo "| updating_crates_io_index | $updating_index |"
            echo "| updating_git | $updating_git |"
            echo "| downloading_crates | $downloading_crates |"
            echo "| compiling_lines | $compiling_count |"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

