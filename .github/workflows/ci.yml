  rust-lane-all-features:
    needs:
      - rust-plan
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (needs.rust-plan.result == ''success'' && needs.rust-plan.outputs.rust_root_mode != ''none'') }}'
    permissions:
      contents: read
    cache-mode: write
    outputs:
      # jactionlint ignore=unused-job-output
      tests_run: '${{ steps.test.outputs.tests_run }}'
      # jactionlint ignore=unused-job-output
      tests_listed: '${{ steps.test.outputs.tests_listed }}'
      # jactionlint ignore=unused-job-output
      tests_ignored: '${{ steps.test.outputs.tests_ignored }}'
      # jactionlint ignore=unused-job-output
      tests_by_package: '${{ steps.test.outputs.tests_by_package }}'
    runs-on: '${{ (!startsWith(github.event_name, ''pull_request'') || github.event.pull_request.head.repo.full_name == github.repository) && ''ubuntu-26.04-scale-set'' || ''ubuntu-26.04'' }}'
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: '${{ github.workspace }}/target'
      VELNOR_MBX_REPORTS: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
      - name: Install velnor-ci 0.1.115
        uses: tailrocks/velnor-new/actions/setup-velnor@6f0f6154efac858505f7e5c1d8c55a900ede0370  # tools-v0.1.115
        with:
          version: '0.1.115'
          sha256-linux-x64: '09c060db9864631df6a8df14ee0166ac4351c34071673789fe6b9f33172546dc'
          sha256-linux-arm64: '46b204124b3d90f0dd029480e0caa9875af85783217b186fb7d4e3cb619f1336'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      - name: Private mbx store
        run: 'echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"'
      - name: Keep mbx build-script outputs in target
        run: 'echo "MBX_SHARE_OUT_DIR=0" >> "$GITHUB_ENV"'
      # jactionlint ignore=shellcheck
      - name: Clear the tools directories
        run: '. "$VELNOR_EXEC" tools-local clear'
      # jactionlint ignore=shellcheck
      - id: toolslocal
        name: Restore the tools from the node store
        env:
          VELNOR_TOOLS_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ needs.rust-plan.outputs.tools_anchor }}'
        run: '. "$VELNOR_EXEC" tools-local restore --key "$VELNOR_TOOLS_KEY"'
      - id: tools
        name: Restore the tools cache
        if: *velnor_7
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_8
      # jactionlint ignore=shellcheck
      - id: toolsverify
        name: Verify tools
        env:
          VELNOR_TOOLS_ANCHOR: *velnor_9
          VELNOR_ANCHOR_CACHE_KEY: *velnor_10
          VELNOR_TOOLS_CACHE_KEY: *velnor_11
        run: '. "$VELNOR_EXEC" tools-verify check'
      - id: tools_restored
        name: Record where the tools came from
        env:
          CACHE_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ needs.rust-plan.outputs.tools_anchor }}'
          NODE_HIT: '${{ steps.toolslocal.outputs.hit == ''true'' && ''true'' || '''' }}'
          MATCHED: '${{ steps.tools.outputs.cache-matched-key }}'
          EXACT: '${{ steps.toolslocal.outputs.hit == ''true'' && ''true'' || steps.tools.outputs.cache-hit }}'
        run: *velnor_12
      - name: Install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          sha256: '${{ runner.os != ''Windows'' && runner.os != ''Linux'' && (runner.os == ''macOS'' && runner.arch == ''ARM64'' && ''3f4ba9d21c6f2170048d0870fd98ab287e04730b76a6fc8e83964d59c80eb704'' || runner.os == ''macOS'' && runner.arch == ''X64'' && ''7eab8054d301b75dcbd93440ff184bee6864d95799cfdc4a00ce858313b68783'' || ''no-mise-digest-for-this-runner'') || '''' }}'
          cache: false
      - name: Add Rust components
        run: rustup component add clippy rustfmt
      - name: Add Rust targets
        run: rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
      # jactionlint ignore=shellcheck
      - id: toolsrecord
        name: Record anchor
        env:
          VELNOR_TOOLS_ANCHOR: *velnor_9
          VELNOR_TOOLS_VERIFIED: *velnor_13
        run: '. "$VELNOR_EXEC" tools-verify record'
      - name: Save anchor
        if: *velnor_14
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
      - id: toolslookup
        name: Look up the tools cache
        if: '${{ github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && steps.toolslocal.outputs.hit == ''true'' && runner.environment != ''self-hosted'' }}'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ needs.rust-plan.outputs.tools_anchor }}'
          lookup-only: 'true'
      # jactionlint ignore=shellcheck
      - id: toolslocalsave
        name: Save the tools to the node store
        if: *velnor_15
        continue-on-error: true
        env:
          VELNOR_TOOLS_KEY: *velnor_16
        run: '. "$VELNOR_EXEC" tools-local save --key "$VELNOR_TOOLS_KEY"'
      - id: save_tools
        name: Save the tools cache
        if: *velnor_17
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_16
      - id: tools_saved_key
        name: Record the tools cache key
        if: '${{ !cancelled() && steps.save_tools.outcome != ''skipped'' }}'
        env:
          CACHE_KEY: 'velnor-tools-${{ runner.os }}-${{ runner.arch }}-mise2026.11.10-${{ hashFiles(''mise.lock'') }}-${{ steps.toolsrecord.outputs.digest }}'
        run: 'echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"'
      # jactionlint ignore=shellcheck
      - id: save_tools_node
        name: Record the tools save
        if: '${{ (!cancelled() && (steps.toolslocalsave.outcome == ''failure'' || steps.save_tools.outcome == ''success'' || steps.save_tools.outcome == ''failure'')) && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) && (github.event_name == ''push'' || github.event_name == ''schedule'' || github.event_name == ''workflow_dispatch'')) }}'
        continue-on-error: true
        env:
          CACHE_OK: '${{ steps.toolslocalsave.outcome != ''failure'' && steps.save_tools.outcome != ''failure'' }}'
        run: '. "$VELNOR_EXEC" cache check --success "$CACHE_OK"'
      # jactionlint ignore=shellcheck
      - id: prepare
        name: velnor-ci prepare
        run: '. "$VELNOR_EXEC" prepare --lock-root root'
      # jactionlint ignore=shellcheck
      - name: velnor-ci check-metadata
        run: '. "$VELNOR_EXEC" check-metadata'
      - id: sources_locks
        name: Hash the sources lockfiles
        env:
          SOURCES_LOCKS: '${{ hashFiles(''Cargo.lock'') }}'
        run: 'echo "hash=$SOURCES_LOCKS" >> "$GITHUB_OUTPUT"'
      - id: sources_root
        name: Restore the sources cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-${{ steps.sources_locks.outputs.hash }}'
          restore-keys: 'velnor-src-${{ runner.os }}-${{ runner.arch }}-all.roots-'
      - id: target_root
        name: Restore the target cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: 'velnor-tgt-rust-lane-all-features.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_root }}-${{ github.sha }}-${{ github.run_id }}'
          restore-keys: |
            velnor-tgt-rust-lane-all-features.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-${{ steps.prepare.outputs.lock_root }}-
            velnor-tgt-rust-lane-all-features.root.${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.compat }}-
      # jactionlint ignore=shellcheck
      - name: velnor-ci inputs restore
        run: *velnor_18
      # jactionlint ignore=shellcheck
      - id: restored
        name: velnor-ci restored
        run: '. "$VELNOR_EXEC" restored --target-dir "${GITHUB_WORKSPACE}"/target'
      - id: test_setup_26
        name: Install native libraries
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' }}'
        run: bash ci/native-libs.sh
      # jactionlint ignore=shellcheck
      - id: test
        name: 'Test (all features)'
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.test_setup_26.outcome != ''failure'' && steps.test_setup_26.outcome != ''cancelled'' }}'
        env:
          TEST_FILTER: '${{ needs.rust-plan.outputs.rust_root_test_filter }}'
        run: '. "$VELNOR_EXEC" run -- velnor-ci inputs build -- cargo-nextest nextest run --workspace --locked --cargo-message-format=json-render-diagnostics --all-features --profile ci --no-fail-fast --ignore-default-filter --status-level pass -E "$TEST_FILTER" --no-tests=fail'
      # jactionlint ignore=shellcheck
      - name: 'Lint (all features)'
        if: '${{ !cancelled() && steps.restored.outcome == ''success'' && steps.test_setup_26.outcome != ''failure'' && steps.test_setup_26.outcome != ''cancelled'' }}'
        run: '. "$VELNOR_EXEC" run -- velnor-ci inputs build -- cargo-clippy clippy --workspace --all-targets --locked --message-format=json-render-diagnostics --all-features -- -D warnings'
      # jactionlint ignore=shellcheck
      - name: velnor-ci inputs audit --root .
