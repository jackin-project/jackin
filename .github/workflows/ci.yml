        run: '. "$VELNOR_EXEC" inputs audit --root .'
      # jactionlint ignore=shellcheck
      - id: report_cache_metrics
        name: Report cache telemetry
        if: '${{ !cancelled() }}'
        continue-on-error: true
        env:
          VELNOR_REPORT_CACHES: '[{"family":"tools","restore_step":"tools_restored","root":null,"save_key_step":"tools_saved_key","save_step":"save_tools_node"},{"family":"sources","not_generated":"private dependencies","restore_step":"sources_root","root":null},{"family":"target","not_generated":"private dependencies","restore_step":"target_root","root":"."}]'
          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
          VELNOR_TESTS_RUN: '${{ steps.test.outputs.tests_run }}'
