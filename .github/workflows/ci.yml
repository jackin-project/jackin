      VELNOR_RELEASE_COMMIT: c622bfb187556afb8d3ff3ca917a719e4bb7f32a
      VELNOR_RUN_KEY_ATTEMPT: ${{ needs.plan.outputs.plan_attempt || github.run_attempt }}
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - check-dependency-usage
      - check-repository-steps
      - check-secrets-scan
      - rust-jackin
      - rust-jackin-core
      - rust-jackin-image
      - rust-jackin-openshell
      - rust-jackin-session
      - rust-jackin-testkit
      - rust-jackin-tui
      - rust-jackin-usage
      - rust-jackin-usage-provider-claude
