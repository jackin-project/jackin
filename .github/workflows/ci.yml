    if: ${{ !cancelled() }}
    steps:
      - *s3
      - *s9
      - name: Prepare pinned tools
        env: *m13
        run: mise --no-config --no-env --no-hooks install gh@2.102.1
      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: *m10
