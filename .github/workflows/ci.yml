
name: CI
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  merge_group:
permissions:
  contents: read
env:
  ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
  ACTIONS_ID_TOKEN_REQUEST_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""
  CARGO_REGISTRY_TOKEN: ""
  GH_CONFIG_DIR: ""
  GH_HOST: ""
  GH_TOKEN: ""
  GITHUB_TOKEN: ""
  MISE_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_GITHUB_TOKEN: ""
  MISE_LOCKFILE: "0"
  MISE_NO_CONFIG: "1"
  MISE_NO_ENV: "1"
  MISE_NO_HOOKS: "1"
  NODE_AUTH_TOKEN: ""
  NPM_TOKEN: ""
concurrency:
  group: velnor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26
        with:
          d: 9d90371d425335330150a44ddd82153a0f76ae85f2523f9e2af30607ea568f1e
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Prepare pinned tools
        run: mise --no-config --no-env --no-hooks install actionlint@1.7.12 shellcheck@0.11.0
      - name: Run actionlint
        run: env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks exec actionlint@1.7.12 shellcheck@0.11.0 -- actionlint -color
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      VELNOR_ASSET_SHA256: 84dcfc3c62e509c70c24d2feb74e53866a1fb0d930d2a290efb3edfd0676e9f5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.8/velnor-actions-0.1.8-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 7c594f7aef03990d8ff952727b0c56497372e355
    outputs:
      covered_tasks: ${{ steps.plan.outputs.covered_tasks }}
      qualification_campaign: ${{ steps.plan.outputs.qualification_campaign }}
      qualification_phase: ${{ steps.plan.outputs.qualification_phase }}
      qualification_cache_enabled: ${{ steps.plan.outputs.qualification_cache_enabled }}
      qualification_cache_write: ${{ steps.plan.outputs.qualification_cache_write }}
      qualification_cache_directives: ${{ steps.plan.outputs.qualification_cache_directives }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26
        with:
          d: ff4be321ca53f634bfaadf6142068935be6143b00229b65a246944c3acd91de5
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: &r1 mise --no-config --no-env --no-hooks install rust@1.98.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Restore Cargo sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.98.1-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
          restore-keys: velnor-v1-sources-x86_64-unknown-linux-gnu-1.98.1-
      - name: Fetch Cargo sources
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: &r2 "sh -c 'mkdir -p \"$RUNNER_TEMP/velnor/cargo-clean\" && cd \"$RUNNER_TEMP/velnor/cargo-clean\" && if mise --no-config --no-env --no-hooks exec rust@1.98.1 -- cargo metadata --locked --offline --manifest-path \"$GITHUB_WORKSPACE/Cargo.toml\" >/dev/null 2>&1; then echo \"velnor: sources hit, skipping fetch\"; else echo \"velnor: sources miss (source_missing), fetching\"; mise --no-config --no-env --no-hooks exec rust@1.98.1 -- cargo fetch --locked --manifest-path \"$GITHUB_WORKSPACE/Cargo.toml\"; fi'"
      - name: Save Cargo sources
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.98.1-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
      - name: Acquire Velnor
        run: &r3 "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.8\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --retry 5 --retry-all-errors --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/plan-v1-request.json
        run: &r4 "\"$RUNNER_TEMP\"'/velnor/bin/velnor-actions-0.1.8'"
      - name: Check generated files
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; $RUNNER_TEMP/velnor/bin/velnor-actions-0.1.8 generate --output-dir \"$RUNNER_TEMP/velnor-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\" && diff -r --brief .github \"$RUNNER_TEMP/velnor-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/.github\"'"
      - name: Plan
        id: plan
        env:
          VELNOR_INTERNAL_OP: plan-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/plan-v1-request.json
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: *r4
      - name: Publish plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: "30"
      - name: Save Mise tools
        if: success() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true && steps.v2.outputs.enabled == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          path: "~/.local/share/mise\n${{ runner.temp }}/velnor/rustup\n${{ runner.temp }}/velnor/cargo/.crates.toml\n${{ runner.temp }}/velnor/cargo/.crates2.json\n${{ runner.temp }}/velnor/cargo/bin"
  publish-baseline:
    name: Publish baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VELNOR_ASSET_SHA256: 84dcfc3c62e509c70c24d2feb74e53866a1fb0d930d2a290efb3edfd0676e9f5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.8/velnor-actions-0.1.8-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 7c594f7aef03990d8ff952727b0c56497372e355
    needs:
      - required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Acquire Velnor
        run: *r3
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/publish-baseline-v1-request.json
        run: *r4
      - name: Publish baseline
        id: publish-baseline
        env:
          VELNOR_INTERNAL_OP: publish-baseline-v1
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/publish-baseline-v1-request.json
        run: *r4
      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: ${{ steps.publish-baseline.outputs.artifact_name }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}/published-baseline/baseline.json
          retention-days: "90"
  required:
    name: Required
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      VELNOR_ASSET_SHA256: 84dcfc3c62e509c70c24d2feb74e53866a1fb0d930d2a290efb3edfd0676e9f5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.8/velnor-actions-0.1.8-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 7c594f7aef03990d8ff952727b0c56497372e355
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - rust-jackin
      - rust-jackin-agent-status
      - rust-jackin-capsule
      - rust-jackin-config
      - rust-jackin-console
      - rust-jackin-core
      - rust-jackin-dev
      - rust-jackin-diagnostics
      - rust-jackin-docker
      - rust-jackin-env
      - rust-jackin-host
      - rust-jackin-image
      - rust-jackin-instance
      - rust-jackin-isolation
      - rust-jackin-launch
      - rust-jackin-manifest
      - rust-jackin-otlp-testbed
      - rust-jackin-process
      - rust-jackin-process-directory
      - rust-jackin-protocol
      - rust-jackin-runtime
      - rust-jackin-telemetry
      - rust-jackin-test-support
      - rust-jackin-tui
      - rust-jackin-usage
      - rust-jackin-usage-ffi
      - rust-jackin-xtask
      - actionlint
    if: always()
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Acquire Velnor
        run: *r3
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install gh@2.102.0
      - name: Download plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Download every expected matrix artifact
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VELNOR_INTERNAL_OP: fetch-reports-v1
        run: *r4
      - name: Write request
        env:
          VELNOR_INTERNAL_OP: write-request-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"plan\",\"rust-jackin\",\"rust-jackin-agent-status\",\"rust-jackin-capsule\",\"rust-jackin-config\",\"rust-jackin-console\",\"rust-jackin-core\",\"rust-jackin-dev\",\"rust-jackin-diagnostics\",\"rust-jackin-docker\",\"rust-jackin-env\",\"rust-jackin-host\",\"rust-jackin-image\",\"rust-jackin-instance\",\"rust-jackin-isolation\",\"rust-jackin-launch\",\"rust-jackin-manifest\",\"rust-jackin-otlp-testbed\",\"rust-jackin-process\",\"rust-jackin-process-directory\",\"rust-jackin-protocol\",\"rust-jackin-runtime\",\"rust-jackin-telemetry\",\"rust-jackin-test-support\",\"rust-jackin-tui\",\"rust-jackin-usage\",\"rust-jackin-usage-ffi\",\"rust-jackin-xtask\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: *r4
      - name: Merge reports
        env:
          VELNOR_INTERNAL_OP: merge-v1
          VELNOR_NEEDS_JSON: ${{ toJSON(needs) }}
          VELNOR_NEEDS_EXPECTED: "[\"actionlint\",\"plan\",\"rust-jackin\",\"rust-jackin-agent-status\",\"rust-jackin-capsule\",\"rust-jackin-config\",\"rust-jackin-console\",\"rust-jackin-core\",\"rust-jackin-dev\",\"rust-jackin-diagnostics\",\"rust-jackin-docker\",\"rust-jackin-env\",\"rust-jackin-host\",\"rust-jackin-image\",\"rust-jackin-instance\",\"rust-jackin-isolation\",\"rust-jackin-launch\",\"rust-jackin-manifest\",\"rust-jackin-otlp-testbed\",\"rust-jackin-process\",\"rust-jackin-process-directory\",\"rust-jackin-protocol\",\"rust-jackin-runtime\",\"rust-jackin-telemetry\",\"rust-jackin-test-support\",\"rust-jackin-tui\",\"rust-jackin-usage\",\"rust-jackin-usage-ffi\",\"rust-jackin-xtask\"]"
          VELNOR_REQUEST_FILE: ${{ runner.temp }}/velnor/request/merge-v1-request.json
        run: *r4
      - name: Publish final report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: velnor-final-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}/final-report.json
          retention-days: "30"
  rust-jackin:
    name: Rust / jackin
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      RUSTUP_TOOLCHAIN: 1.98.1
      VELNOR_ASSET_SHA256: 84dcfc3c62e509c70c24d2feb74e53866a1fb0d930d2a290efb3edfd0676e9f5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.8/velnor-actions-0.1.8-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 7c594f7aef03990d8ff952727b0c56497372e355
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26
        with:
          d: 8c09d17163064f5865e6a0cf17c91516dfa013b64dfc51c2335f94f34ce0d21a
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Acquire Velnor
        run: *r3
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: *r1
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: &r5 mise --no-config --no-env --no-hooks exec rust@1.98.1 -- rustup component add --toolchain 1.98.1-x86_64-unknown-linux-gnu clippy rustfmt
      - name: Restore Cargo sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.98.1-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
          restore-keys: velnor-v1-sources-x86_64-unknown-linux-gnu-1.98.1-
      - name: Verify Rust before MBX action
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MBX_CACHE_DIR: ${{ runner.temp }}/velnor/mbx
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
