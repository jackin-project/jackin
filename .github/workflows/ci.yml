  required:
    name: Required verdict
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      VELNOR_ASSET_SHA256: 5be423e9380583136eee1e5dc7315dc97bcf11e04eaeae01d629fac6dd907a94
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.27/velnor-actions-0.1.27-x86_64-unknown-linux-gnu
