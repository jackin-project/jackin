      - *s4
  required:
    name: Required verdict
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      VELNOR_ASSET_SHA256: 3d12c51ccd6d6cfc8073e802dc8020a88281b0a4ebe0f8511441a32db4b94fd5
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.28/velnor-actions-0.1.28-x86_64-unknown-linux-gnu
