name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: |
          Which runner(s) to run on. Default velnor; use both for parity runs.
        type: choice
        default: velnor
        options: [velnor, github, both]

jobs:
  matrix-setup:
    name: Select runner lane
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configs: ${{ steps.set.outputs.configs }}
    steps:
      - id: set
        env:
          LANES: ${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'velnor' }}
        run: |
          github='{"lane":"GitHub","runner":"\"ubuntu-24.04\""}'
          velnor='{"lane":"Velnor","runner":"[\"self-hosted\",\"velnor-target-mvp\"]"}'
          case "$LANES" in
            github) configs="[$github]" ;;
            both)   configs="[$github,$velnor]" ;;
            *)      configs="[$velnor]" ;;
          esac
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  validate:
    needs: matrix-setup
    name: validate (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix-setup.outputs.configs) }}
    runs-on: ${{ fromJSON(matrix.config.runner) }}
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub for base image pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: jackin-project/jackin-role-action@889e01e1fec152cc68271385f8976319244d9251 # pinned
        with:
          jackin-version: latest-build
          # Warm PR CI from the last published image's registry layer cache.
          registry-cache-image: docker.io/chainargos/jackin-agent-brown
