name: Publish Image

# IMPORTANT: image MUST be private. See AGENTS.md § Hard rules.

on:
  push:
    branches: [main]
    # `hooks/` is intentionally omitted — the Dockerfile does not COPY
    # it; jackin reads `hooks/pre-launch.sh` from this repo at runtime
    # so a hooks-only commit produces a byte-identical image.
    paths:
      - 'Dockerfile'
      - 'jackin.role.toml'
      - 'zshrc.d/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

jobs:
  publish:
    uses: jackin-project/jackin-role-action/.github/workflows/publish.yml@f79883f57448b81ade0450e7b0fed58fa8bd9bdf # latest
    permissions:
      contents: read
      id-token: write
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
