name: Publish Image

# IMPORTANT: image MUST be private. See AGENTS.md § Hard rules.

on:
  push:
    branches: [main]
    # `hooks/` is intentionally omitted — the Dockerfile does not COPY
    # it; jackin reads `hooks/pre-launch.sh` from this repo at runtime
    # so a hooks-only commit produces a byte-identical image.
    paths:
      - 'Dockerfile'
      - 'jackin.role.toml'
      - 'zshrc.d/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: hetzner-sentry
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jackin-project/jackin-role-action@f59949f92906655d2c5a1a6747390d4d49b0b9cd # latest
        with:
          jackin-version: latest-build
          push: 'true'
          image: docker.io/chainargos/jackin-agent-brown
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
          sign: 'true'