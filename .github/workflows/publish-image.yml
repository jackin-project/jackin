name: Publish Image

# IMPORTANT: image MUST be private. See AGENTS.md § Hard rules.

on:
  push:
    branches: [main]
    # `hooks/` is intentionally omitted — the Dockerfile does not COPY
    # it; jackin reads `hooks/pre-launch.sh` from this repo at runtime
    # so a hooks-only commit produces a byte-identical image.
    paths:
      - 'Dockerfile'
      - 'jackin.role.toml'
      - 'zshrc.d/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

jobs:
  publish:
    uses: jackin-project/jackin-role-action/.github/workflows/publish.yml@fe73996146153765c69e3334269e18779e8f3bb9 # latest
    permissions:
      contents: read
      id-token: write
    with:
      runner-amd64: hetzner-sentry
      runner-arm64: hetzner-sentry
      runner-merge: hetzner-sentry
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      github-readonly-token: ${{ secrets.GH_READONLY_TOKEN }}