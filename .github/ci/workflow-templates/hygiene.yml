  # Plan 035: Miri pure-crate lane (advisory).
  miri:
    name: Miri ${{ matrix.crate }} (advisory)
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        crate: [jackin-core, jackin-config, jackin-manifest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # jackin-config tests use tempdirs.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-nightly-miri-v1
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: "rust"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - name: Install nightly + miri
        run: rustup toolchain install nightly --profile minimal --component miri
      # Independent matrix invocations prevent one slow crate from starving the rest.
      - name: miri ${{ matrix.crate }}
        id: miri-crate
        continue-on-error: true
        run: cargo +nightly miri test -p "${{ matrix.crate }}" --no-default-features --locked
      - name: miri summary
        if: always()
        # Bind step/matrix context through `env` instead of inline `${{ }}`
        # in the run script: the Velnor runner does not interpolate
        # expressions inside run: blocks (bash "bad substitution").
        env:
          MIRI_OUTCOME: ${{ steps.miri-crate.outcome }}
          MIRI_CRATE: ${{ matrix.crate }}
        run: |
          echo "### Miri pure crates" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MIRI_OUTCOME" = "success" ]; then
            echo "miri $MIRI_CRATE: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "miri $MIRI_CRATE: FAIL($MIRI_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
          fi

