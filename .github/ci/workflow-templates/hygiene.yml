    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: "rust"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - run: rustup component add rust-analyzer
      - name: rust-analyzer analysis-stats
        run: |
          set -euo pipefail
          rust-analyzer analysis-stats . > ra-stats.txt 2>&1 || true
          cat ra-stats.txt
          {
            echo "### rust-analyzer analysis-stats (advisory)"
            echo
            echo '```'
            tail -40 ra-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on hard analysis errors (advisory continue-on-error)
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -i '^error' ra-stats.txt; then
            echo "rust-analyzer reported error lines" >&2
            exit 1
          fi
      - name: Upload RA stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-analyzer-clean
          path: ra-stats.txt
          if-no-files-found: error

  # Scheduled per-crate clean + incremental build-time ceiling (plans 026/048).
  build-time-measure:
    name: Per-crate build-time ratchet
    # Platform-only (calibration contract): ratchet.toml's build-time ceilings
    # are sampled exclusively on GitHub-hosted runners and must be measured on
    # comparable hardware. Velnor runners are materially slower (run 32711045540:
    # jackin-runtime.clean_s 220 -> 322), which would force ceiling inflation or
    # flapping, so this job always measures on the GitHub lane.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: shared
          xtask-contract: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'crates/*/Cargo.toml', 'crates/jackin-xtask/src/**', 'crates/jackin-process/src/**') }}
          include-tools: "false"
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: "rust"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind CI xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind CI xtask fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - name: Measure clean + incremental builds
        run: >-
          "$CI_XTASK" ci-build-times
      - name: Enforce scheduled build-time ceilings
        run: >-
          "$CI_XTASK" lint ratchet --only build-time
      - name: Upload build-time artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-time-measure
          path: target/build-times.json
          if-no-files-found: error

  # Plan 022: beta-toolchain clippy canary (advisory — never blocks).
  beta-clippy-canary:
    name: Beta clippy canary (advisory)
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-beta-clippy-v1
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: "rust"
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - name: Install beta toolchain + clippy
        run: rustup toolchain install beta --profile minimal --component clippy
      - name: cargo +beta clippy
        run: cargo +beta clippy --workspace --all-targets --all-features --locked 2>&1 | tee beta-clippy.log || true
      - name: Summarize beta clippy
        run: |
          echo "### Beta clippy canary" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(warning|error)' beta-clippy.log | sort | uniq -c | sort -rn | head -20 >> "$GITHUB_STEP_SUMMARY" || echo "clean" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-clippy-log
          path: beta-clippy.log
          retention-days: 7
          if-no-files-found: warn

  # Plan 035: coverage artifact lane (advisory).
  coverage:
    name: Coverage (advisory)
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 45
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
