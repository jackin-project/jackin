      - name: Restore prepared CI tools
        uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: shared
          tools-contract: ${{ hashFiles('mise.toml', 'mise.lock', 'crates/jackin-xtask/src/ci_stage.rs') }}
          include-xtask: "false"
          allow-miss: "true"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
