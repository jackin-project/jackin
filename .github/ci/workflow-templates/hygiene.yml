          disable_annotations: "false"
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore prepared CI tools
        uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: shared
          tools-contract: ${{ hashFiles('mise.toml', 'mise.lock', 'crates/jackin-xtask/src/ci_stage.rs') }}
          include-xtask: "false"
          allow-miss: "true"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: >-
            rust
            ${{ env.CI_TOOLS_HIT != 'true' &&
                'cargo-binstall cargo:cargo-hakari' || '' }}
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind CI xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind CI xtask fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - *cargo-target-cache
      # Exit-checked hakari with before/after wall-clock (advisory job; summary distinguishes tool failure).
      - name: baseline workspace build (before)
        id: hakari-before
        run: |
          echo "### hakari investigation" >> "$GITHUB_STEP_SUMMARY"
          cargo hakari --version >> "$GITHUB_STEP_SUMMARY" || true
          cargo clean
          START=$(date +%s)
          mbx build --workspace --timings --locked
          END=$(date +%s)
          echo "before_secs=$((END - START))" >> "$GITHUB_OUTPUT"
          echo "before wall-clock: $((END - START))s" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/hakari-timings-before
          cp -a target/cargo-timings/. /tmp/hakari-timings-before/ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-hakari-before
          path: |
            /tmp/hakari-timings-before/*
            target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: warn
      - name: hakari init + generate
        id: hakari-tool
        continue-on-error: true
        run: |
          set -o pipefail
          cargo hakari init .config/workspace-hack --yes 2>&1 | tee hakari-run.txt
          cargo hakari generate 2>&1 | tee -a hakari-run.txt
          cargo hakari manage-deps --yes 2>&1 | tee -a hakari-run.txt
          echo "hakari_exit=0" >> "$GITHUB_OUTPUT"
      - name: workspace build after hakari (after)
        id: hakari-after
        if: always()
        run: |
          cargo clean
          START=$(date +%s)
          mbx build --workspace --timings --locked
          END=$(date +%s)
          echo "after_secs=$((END - START))" >> "$GITHUB_OUTPUT"
          echo "after wall-clock: $((END - START))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cargo-timings-hakari-after
          path: |
            target/cargo-timings/*.html
            hakari-run.txt
          retention-days: 7
          if-no-files-found: warn
      - name: hakari summary
        if: always()
        # Bind step outputs through `env` instead of inline `${{ }}` in the
        # run script: the Velnor runner does not interpolate expressions
        # inside run: blocks (bash "bad substitution").
        env:
          HAKARI_OUTCOME: ${{ steps.hakari-tool.outcome }}
          HAKARI_BEFORE: ${{ steps.hakari-before.outputs.before_secs }}
          HAKARI_AFTER: ${{ steps.hakari-after.outputs.after_secs }}
        run: |
          {
            echo ""
            echo "### hakari result"
            if [ "$HAKARI_OUTCOME" = "success" ]; then
              echo "hakari tool: CLEAN (exit 0)"
            else
              echo "hakari tool: TOOL FAILURE (outcome=$HAKARI_OUTCOME)"
            fi
            echo "before wall-clock (s): $HAKARI_BEFORE"
            echo "after wall-clock (s): $HAKARI_AFTER"
            echo "Comparison uses shell wall-clock of the two \`mbx build --workspace --timings\` steps (stable cargo; no -Z JSON timings)."
            echo "Adopt/no-adopt decision: update rust-ci-tooling.mdx from this observed delta."
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan 048: hyperfine cold-start measurement (advisory).
  dylint-advisory:
    name: dylint render purity
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-dylint-v1
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore prepared CI tools
        uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: shared
          tools-contract: ${{ hashFiles('mise.toml', 'mise.lock', 'crates/jackin-xtask/src/ci_stage.rs') }}
          include-xtask: "false"
          allow-miss: "true"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: >-
            rust
            ${{ env.CI_TOOLS_HIT != 'true' &&
                'cargo-binstall cargo:cargo-dylint cargo:dylint-link' || '' }}
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind CI xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind CI xtask fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - name: cargo dylint
        id: dylint-run
        run: |
          echo "### dylint render_thread_purity" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -d crates/jackin-lints ]; then
            echo "crates/jackin-lints missing — skip" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          set +e
          PATH="$PWD/target/dylint-tools/bin:$PATH" \
            cargo dylint --all -- --workspace --ignore-rust-version 2>&1 | tee dylint-findings.txt
          status=${PIPESTATUS[0]}
          set -e
          tail -n 80 dylint-findings.txt >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -eq 0 ]; then
            echo "dylint: CLEAN (exit 0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dylint: FINDINGS_OR_TOOL_FAILURE (exit ${status})" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dylint-findings
          path: dylint-findings.txt
          retention-days: 7
          if-no-files-found: warn

  dind-chaos:
    name: Full DinD E2E
    # Platform-only (fleet-design exception): the DinD + usage-broker E2E
    # suites only need a working Docker daemon (docker info + buildx), not a
    # specific engine, so this job always runs GitHub-hosted Linux where
    # Docker is preinstalled — regardless of the lane selector. The previous
    # macOS/OrbStack incarnation could not pass anywhere: OrbStack's VM
    # manager panics at boot on GitHub-hosted macOS runners (both macos-15
    # and macos-26 images) with "vm config get max ipa size: unsupported"
    # because those runners are themselves VMs whose Apple Virtualization
    # framework does not expose what OrbStack's macvirt requires, and the
    # Velnor fleet has no macOS runners.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      JACKIN_CHAOS_SEED: ${{ inputs.chaos_seed }}
    steps:
      - name: Verify Docker engine
        run: |
          set -euo pipefail
          docker info --format 'engine {{.OperatingSystem}} {{.ServerVersion}}'
          docker buildx version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            rustup-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore prepared CI tools
        uses: ./.github/actions/download-ci-xtask
        with:
          token: ${{ github.token }}
          lane: shared
          tools-contract: ${{ hashFiles('mise.toml', 'mise.lock', 'crates/jackin-xtask/src/ci_stage.rs') }}
          xtask-contract: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/**', 'crates/*/Cargo.toml', 'crates/jackin-xtask/src/**', 'crates/jackin-process/src/**') }}
          allow-miss: "true"
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          cache_key_prefix: "mise-v2"
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          install_args: >-
            rust zig
            ${{ env.CI_TOOLS_HIT != 'true' &&
                'cargo-binstall aqua:nextest-rs/nextest/cargo-nextest cargo:cargo-zigbuild' || '' }}
          github_token: ${{ secrets.GH_READONLY_TOKEN }}
      - name: Bind Cargo cache actions into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind Cargo cache save into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - name: Bind CI xtask resolver into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      - name: Bind CI xtask fallback toolchain into admitted closure
        if: github.event_name == 'velnor-admission-closure'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - name: Run full DinD E2E suite
        run: >-
          "$CI_XTASK" ci --only e2e


  # Plan 027: per-main health JSON snapshot (advisory series seed).
  health-trend:
    name: Health trend snapshot (advisory)
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') || github.event_name == 'pull_request' || github.event_name == 'push') && 'ubuntu-26.04' || fromJSON('["self-hosted","velnor-target-mvp"]') }}
    timeout-minutes: 30
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_CACHE_SIZE: 20G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Mr. Boxington
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
