        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      - id: cargo-registry-cache
        uses: ./.github/actions/cache-cargo-registry
      - *cargo-target-cache
      - run: mbx build --release --locked -p jackin
      - name: Hyperfine cold-start
        run: |
          set -euo pipefail
          # The Velnor persistent mise store (/opt/mise) can hold a poisoned
          # hyperfine entry — a version dir mise treats as installed even
          # though its bin/ layout does not yield an executable (see Velnor
          # #275/#277 for the cargo-backend variant; the aqua backend has the
          # same failure shape). Diagnose the stored layout, then force a
          # real reinstall before resolving through `mise x`.
          mise where hyperfine 2>/dev/null | xargs -r ls -la || true
          mise install --force hyperfine
          bin="$PWD/target/release/jackin"
          test -x "$bin"
          # Preflight: fail with the binary's own output instead of an opaque
          # hyperfine "exit code 127 in the first warmup run".
          "$bin" --help >/dev/null
          mise x hyperfine -- hyperfine --warmup 3 --min-runs 10 --export-json cold-start.json \
            "$bin --help" \
            "$bin console --help"
          {
            echo "### Cold-start hyperfine (advisory)"
            echo
            echo "| Command | Mean (s) |"
            echo "| --- | ---: |"
            jq -r '.results[] | "| `\(.command)` | \(.mean) |"' cold-start.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure PTY first-frame and input-to-frame
        run: |
          set -euo pipefail
          mbx run -p jackin-xtask --locked -- frame-timing \
            --binary target/release/jackin \
            --output frame-timing.json \
            --samples 3
          {
            echo
            echo "### PTY frame timing (advisory)"
            echo
            jq -r '"- First-frame max: \(.first_frame_max_ms) ms\n- Input-to-frame max: \(.input_to_frame_max_ms) ms\n- Samples: \(.samples | length)"' frame-timing.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cold-start artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cold-start-bench
          path: |
            cold-start.json
            frame-timing.json
          if-no-files-found: error

  # Advisory rust-analyzer workspace load check (plan 048).
  rust-analyzer-clean:
